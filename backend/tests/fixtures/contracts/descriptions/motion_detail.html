<script>self.__next_f.push([1," \u003cp\u003eOur client is seeking a Network Automation Engineer for a 12+ month contract opportunity supporting large-scale data center and distributed network automation initiatives. This role will focus on building and scaling “network as code” capabilities across hyperscale cloud and enterprise network environments, using Python, APIs, AWS/Azure networking, Kafka-driven event streams, Cisco/Meraki platforms, and network automation tooling to automate delivery, configuration, drift remediation, and production rollout across complex infrastructure.\u003cbr /\u003e\n\u003cbr /\u003e\nThis is a high-impact opportunity for an engineer who wants to work on automation at serious scale: thousands of data center racks, distributed workforce and retail access environments, and cloud-integrated network operations. The team is looking for strong Python engineers who can move fast, build clean automation workflows, test safely in lab environments, and help create a reliable orchestration layer for network provisioning, remediation, and change management. This is a chance to help shape how network infrastructure is deployed, validated, monitored, and remediated through modern software engineering practices.\u003cbr /\u003e\n\u003cbr /\u003e\nContract Duration: 12+ Months W2\u003cbr /\u003e\nLocation,: Irving TX Hybrid (3 days onsite per week)\u003cbr /\u003e\n\u003cbr /\u003e\n\u003cstrong\u003eRequired Skills \u0026 Experience\u003c/strong\u003e\u003c/p\u003e \u003cul\u003e \u003cli\u003eStrong hands-on Python development experience, ideally building automation, orchestration, or workflow-driven platforms \u003c/li\u003e\u003cli\u003eExperience with network automation and infrastructure-as-code / network-as-code concepts \u003c/li\u003e\u003cli\u003eBackground automating delivery and management of large-scale data center networks \u003c/li\u003e\u003cli\u003eExperience building or supporting API-driven automation for infrastructure, network devices, or cloud services \u003c/li\u003e\u003cli\u003eFamiliarity with AWS environments, cloud networking concepts, and automation inside cloud-based ecosystems \u003c/li\u003e\u003cli\u003eExperience with event-driven systems, preferably Kafka or similar streaming/event platforms \u003c/li\u003e\u003cli\u003eAbility to build workflows for configuration management, provisioning, upgrades, drift detection, and remediation \u003c/li\u003e\u003cli\u003eUnderstanding of network primitives such as IP addresses, device state, configuration actions, access controls, and telemetry \u003c/li\u003e\u003cli\u003eAbility to work in a fast-moving engineering environment with rapid iteration, testing, and deployment expectations \u003c/li\u003e\u003cli\u003eStrong troubleshooting skills and ability to safely automate changes across large, complex environments\n\u003c/li\u003e\u003c/ul\u003e\n\u003cstrong\u003eDesired Skills \u0026 Experience\u003c/strong\u003e \u003cul\u003e \u003cli\u003eExperience with Temporo or similar Python workflow/orchestration engines \u003c/li\u003e\u003cli\u003eFamiliarity with Notobot or other network automation platforms \u003c/li\u003e\u003cli\u003eExperience integrating automation tooling with Kafka event streams for closed-loop remediation \u003c/li\u003e\u003cli\u003eHands-on experience with Cisco and/or Meraki environments \u003c/li\u003e\u003cli\u003eExperience using a lab-as-a-service or validation environment to test automation workflows before production rollout \u003c/li\u003e\u003cli\u003eExposure to Meraki portal workflows, production promotion processes, rollback processes, or kill-switch style change controls \u003c/li\u003e\u003cli\u003eExperience with Microsoft Azure or other hyperscale cloud environments \u003c/li\u003e\u003cli\u003eExperience building endpoint or device agents for telemetry collection, state assessment, or readiness checks \u003c/li\u003e\u003cli\u003eBackground supporting distributed enterprise environments, including retail store access, workforce access, or multi-site network operations \u003c/li\u003e\u003cli\u003ePrior experience working on core engineering teams supporting high-scale network automation or infrastructure modernization\n\u003c/li\u003e\u003c/ul\u003e \u003cul\u003e \u003cli\u003e \u003cul\u003e \u003cli\u003e\u003cstrong\u003eWhat You Will Be Doing\u003c/strong\u003e\u003cbr /\u003e This engineer will help design, build, and deploy automation workflows that simplify and scale the management of large integrated data center networks and distributed access environments. The role will focus on developing Python-based automation that treats network infrastructure as code, enabling atomic actions to be called through APIs, integrated with cloud environments, and safely promoted from lab validation into production.\u003cbr /\u003e You will work on automation workflows that support provisioning, configuration, upgrades, drift detection, drift remediation, and end-to-end orchestration. This includes connecting event streams, network automation platforms, and workflow engines to create a closed-loop model where issues can be detected, validated, remediated, and rolled out safely at scale.\u003cbr /\u003e You will also support testing and validation of automation in Cisco-based lab environments, help promote validated workflows into production portals, and contribute to rollback or kill-switch capabilities that reduce risk during large-scale deployment. The team is moving quickly, so the right candidate should be comfortable building, testing, iterating, and deploying automation in a highly collaborative engineering environment. \u003c/li\u003e\u003c/ul\u003e \u003c/li\u003e\u003c/ul\u003e\n"])</script>
