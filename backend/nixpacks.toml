# Nixpacks configuration for Railway deployment
# Adds Chromium dependencies for Playwright

[phases.setup]
nixPkgs = ["...", "chromium", "nss", "alsa-lib", "at-spi2-atk", "gtk3", "libdrm", "mesa"]

[start]
cmd = "playwright install chromium --with-deps && uvicorn main:app --host 0.0.0.0 --port $PORT"
