<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Apply · Cariara Jobs</title>
    <script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('jobtrails-theme') || 'light'); } catch (e) {}</script>
    <link rel="stylesheet" href="/css/theme.css?v=202609291817">
    <link rel="stylesheet" href="/css/sidebar.css?v=202609291817">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; background: var(--c-canvas, #fff); color: var(--c-ink, #1f1f1f); font-family: var(--c-font); overflow-x: hidden; }

        /* ── App shell (mobile drawer; desktop margin comes from cariara.css) ── */
        .mobile-menu-btn {
            display: none; position: fixed; top: 16px; left: 16px; z-index: 250;
            align-items: center; justify-content: center; cursor: pointer;
        }
        .mobile-menu-btn svg { width: 22px; height: 22px; }
        .mobile-menu-btn .menu-close { display: none; }
        .mobile-menu-btn.active .menu-open { display: none; }
        .mobile-menu-btn.active .menu-close { display: block; }
        .sidebar-backdrop { display: none; position: fixed; inset: 0; z-index: 150; opacity: 0; transition: opacity .3s ease; }
        .sidebar-backdrop.active { opacity: 1; }
        .top-right-controls { position: fixed; top: 16px; right: 24px; z-index: 200; display: flex; align-items: center; gap: 12px; }
        .theme-toggle {
            display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;
            background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 999px; color: var(--c-ink-2); cursor: pointer;
        }
        .theme-toggle svg { width: 18px; height: 18px; }
        .main-content { min-height: 100vh; padding: 24px 32px 64px; }
        @media (max-width: 768px) {
            .mobile-menu-btn { display: flex; }
            .sidebar { transform: translateX(-100%); transition: transform .3s cubic-bezier(.4,0,.2,1); max-width: 85vw; }
            .sidebar.mobile-open { transform: translateX(0); }
            .sidebar-backdrop { display: block; pointer-events: none; }
            .sidebar-backdrop.active { pointer-events: auto; }
            .main-content { margin-left: 0; padding: 72px 16px 40px; }
            .top-right-controls { right: 16px; }
        }

        /* ── Page ─────────────────────────────────────────────────────── */
        .aa-page { max-width: 1040px; margin: 0 auto; }
        .aa-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 0 56px 16px 0; }
        .aa-title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
        .aa-sub { margin: 4px 0 0; color: var(--c-ink-2); font-size: 14px; }
        .aa-header-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .aa-today { font-size: 14px; color: var(--c-ink-2); font-variant-numeric: tabular-nums; }
        .aa-today strong { color: var(--c-ink); font-weight: 500; }
        .aa-pill {
            display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px;
            font-size: 13px; font-weight: 500; background: var(--c-surface-3); color: var(--c-ink-2); white-space: nowrap;
        }
        .aa-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .aa-pill.is-on { background: var(--c-green-tint); color: var(--c-green); }

        /* Switch */
        .aa-switch-wrap { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: var(--c-ink); cursor: pointer; background: none; border: 0; padding: 4px; font-family: var(--c-display); }
        .aa-switch { position: relative; width: 52px; height: 32px; border-radius: 999px; background: var(--c-surface-3); border: 2px solid var(--c-outline); flex: none; transition: background .15s, border-color .15s; }
        .aa-switch::after { content: ""; position: absolute; top: 6px; left: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--c-outline); transition: all .15s; }
        [aria-checked="true"] > .aa-switch { background: var(--c-blue); border-color: var(--c-blue); }
        [aria-checked="true"] > .aa-switch::after { left: 22px; top: 2px; width: 24px; height: 24px; background: var(--c-on-blue); }
        .aa-switch-wrap:disabled { opacity: .6; cursor: progress; }
        .aa-switch-wrap:focus-visible { outline: 2px solid var(--c-blue); outline-offset: 2px; border-radius: 999px; }

        /* Cards / banners */
        .aa-card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; }
        .aa-card h2 { font-size: 16px; line-height: 24px; font-weight: 500; margin: 0 0 4px; }
        .aa-card p { margin: 0; color: var(--c-ink-2); }
        .aa-upgrade { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--c-blue-tint); border-color: transparent; }
        .aa-upgrade h2 { color: var(--c-ink); }
        .aa-upgrade p { color: var(--c-ink); }
        .aa-banner { display: flex; gap: 12px; align-items: flex-start; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; }
        .aa-banner svg { flex: none; width: 20px; height: 20px; margin-top: 1px; }
        .aa-banner-body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .aa-banner.is-error { background: var(--c-red-tint); color: var(--c-red); }
        .aa-banner.is-warn { background: var(--c-yellow-tint); color: var(--c-ink); }
        .aa-banner.is-info { background: var(--c-surface-2); color: var(--c-ink-2); }
        .aa-banner.is-success { background: var(--c-green-tint); color: var(--c-green); }
        .aa-banner-close { background: none; border: 0; color: inherit; cursor: pointer; font-size: 20px; line-height: 20px; padding: 0 4px; border-radius: 4px; }

        .aa-checklist ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 4px; }
        .aa-checklist li { display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 32px; }
        .aa-checklist li svg { width: 20px; height: 20px; flex: none; }
        .aa-checklist li.done { color: var(--c-ink-2); }
        .aa-checklist li.done svg { color: var(--c-green); }
        .aa-checklist li.todo svg { color: var(--c-yellow); }
        .aa-checklist-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
        .aa-progress { font-size: 13px; color: var(--c-ink-3); }

        /* Tabs */
        .aa-tabs-wrap { overflow-x: auto; scrollbar-width: none; margin-bottom: 16px; }
        .aa-tabs-wrap::-webkit-scrollbar { display: none; }
        :root:root body .aa-tabs-wrap .tab-bar { min-width: max-content; }
        :root:root body .aa-tabs-wrap .tab-btn { padding: 0 16px !important; white-space: nowrap; }
        .aa-count { display: inline-flex; min-width: 20px; height: 20px; padding: 0 6px; align-items: center; justify-content: center; border-radius: 999px; background: var(--c-surface-3); color: var(--c-ink-2); font-size: 12px; font-weight: 500; }
        .tab-btn.active .aa-count { background: var(--c-blue); color: var(--c-on-blue); }
        .aa-panel[hidden] { display: none; }

        .aa-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .aa-toolbar p { margin: 0; color: var(--c-ink-2); font-size: 14px; }
        .aa-meta { font-size: 12px; color: var(--c-ink-3); }

        /* Lists */
        .aa-list { display: grid; gap: 8px; }
        .aa-item { display: flex; gap: 16px; align-items: flex-start; background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 12px; padding: 16px; }
        .aa-item.is-click { cursor: pointer; }
        .aa-item.is-click:hover { background: var(--c-surface-2); }
        .aa-item-main { flex: 1; min-width: 0; }
        .aa-item-title { font-family: var(--c-display); font-size: 16px; line-height: 22px; font-weight: 500; color: var(--c-ink); margin: 0; overflow-wrap: anywhere; }
        .aa-item-title a { color: inherit; text-decoration: none; }
        .aa-item-title a:hover { text-decoration: underline; }
        .aa-item-sub { margin: 2px 0 0; font-size: 14px; color: var(--c-ink-2); overflow-wrap: anywhere; }
        .aa-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        :root:root body .aa-chip-reason { background: var(--c-surface-2) !important; border-color: transparent !important; color: var(--c-ink-2) !important; height: auto; min-height: 24px; white-space: normal; }
        :root:root body .aa-chip-ats { color: var(--c-ink-2) !important; }
        :root:root body .aa-chip-warn { background: var(--c-yellow-tint) !important; color: var(--c-ink) !important; border-color: transparent !important; }
        :root:root body .aa-chip-ok { background: var(--c-green-tint) !important; color: var(--c-green) !important; border-color: transparent !important; }
        :root:root body .aa-chip-bad { background: var(--c-red-tint) !important; color: var(--c-red) !important; border-color: transparent !important; }
        :root:root body .aa-chip-blue { background: var(--c-blue-tint) !important; color: var(--c-blue) !important; border-color: transparent !important; }
        .aa-item-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; flex: none; max-width: 50%; }
        :root:root body .btn.aa-sm { min-height: 32px; padding: 0 14px; font-size: 13px !important; }
        .aa-text-btn { background: none; border: 0; color: var(--c-blue); font: 500 14px var(--c-display); padding: 6px 10px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; }
        .aa-text-btn:hover { background: var(--c-blue-tint); }
        .aa-text-btn svg { width: 18px; height: 18px; }

        .aa-ring { position: relative; width: 52px; height: 52px; flex: none; }
        .aa-ring svg { width: 52px; height: 52px; transform: rotate(-90deg); }
        .aa-ring .track { stroke: var(--c-surface-3); }
        .aa-ring .bar { stroke: var(--c-blue); transition: stroke-dashoffset .3s; }
        .aa-ring.hi .bar { stroke: var(--c-green); }
        .aa-ring.lo .bar { stroke: var(--c-outline); }
        .aa-ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 500 14px var(--c-display); color: var(--c-ink); font-variant-numeric: tabular-nums; }

        .aa-empty { text-align: center; padding: 40px 16px; border: 1px dashed var(--c-line); border-radius: 12px; color: var(--c-ink-2); }
        .aa-empty svg { width: 32px; height: 32px; color: var(--c-ink-3); margin-bottom: 8px; }
        .aa-empty h3 { font-size: 16px; font-weight: 500; margin: 0 0 4px; color: var(--c-ink); }
        .aa-empty p { margin: 0 auto 12px; max-width: 460px; font-size: 14px; }
        .aa-skel { height: 88px; border-radius: 12px; background: var(--c-surface-2); border: 1px solid var(--c-line-soft); animation: aa-pulse 1.4s ease-in-out infinite; }
        @keyframes aa-pulse { 50% { opacity: .55; } }

        /* Stepper in Submitted */
        .aa-steps { display: flex; gap: 4px; margin-top: 12px; flex-wrap: wrap; list-style: none; padding: 0; }
        .aa-steps li { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--c-ink-3); }
        .aa-steps li::after { content: ""; width: 16px; height: 1px; background: var(--c-line); margin-left: 2px; }
        .aa-steps li:last-child::after { display: none; }
        .aa-steps .b { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--c-outline); }
        .aa-steps li.done { color: var(--c-ink-2); }
        .aa-steps li.done .b { background: var(--c-green); border-color: var(--c-green); }
        .aa-steps li.cur { color: var(--c-ink); font-weight: 500; }
        .aa-steps li.cur .b { background: var(--c-blue); border-color: var(--c-blue); }

        /* Forms */
        .aa-form { display: grid; gap: 20px; }
        .aa-fieldset { border: 1px solid var(--c-line); border-radius: 12px; padding: 16px 20px 20px; margin: 0; background: var(--c-surface); min-width: 0; }
        .aa-fieldset legend { font: 500 16px/24px var(--c-display); padding: 0 6px; margin-left: -6px; color: var(--c-ink); }
        .aa-fieldset > p.aa-help { margin: -4px 0 12px; }
        .aa-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .aa-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .aa-field { display: grid; gap: 6px; min-width: 0; align-content: start; }
        .aa-field.full { grid-column: 1 / -1; }
        .aa-field > label, .aa-label { font-size: 14px; font-weight: 500; color: var(--c-ink); }
        .aa-help { font-size: 13px; color: var(--c-ink-2); margin: 0; }
        :root:root body .aa-field .form-control, :root:root body .aa-q .form-control { width: 100%; }
        .aa-req { color: var(--c-red); margin-left: 2px; }
        .aa-radios { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .aa-radio-card { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--c-line); border-radius: 12px; padding: 14px 16px; cursor: pointer; background: var(--c-surface); }
        .aa-radio-card:has(input:checked) { border-color: var(--c-blue); box-shadow: inset 0 0 0 1px var(--c-blue); background: var(--c-blue-tint); }
        .aa-radio-card input { margin-top: 3px; width: 18px; height: 18px; flex: none; }
        .aa-radio-card strong { display: block; font: 500 15px/22px var(--c-display); color: var(--c-ink); }
        .aa-radio-card span { font-size: 13px; color: var(--c-ink-2); }
        .aa-range-row { display: flex; align-items: center; gap: 12px; }
        .aa-range-row input[type="range"] { flex: 1; accent-color: var(--c-blue); min-width: 0; }
        .aa-range-row output { font: 500 15px var(--c-display); min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
        .aa-checks { display: flex; flex-wrap: wrap; gap: 8px 20px; }
        .aa-check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--c-ink); cursor: pointer; min-height: 32px; }
        .aa-check input { width: 18px; height: 18px; }
        .aa-actions-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .aa-save-state { font-size: 13px; color: var(--c-ink-2); }

        /* Chips input */
        .aa-chipsbox { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 40px; padding: 4px 8px; border: 1px solid var(--c-line); border-radius: 8px; background: var(--c-surface); cursor: text; }
        .aa-chipsbox:focus-within { border-color: var(--c-blue); box-shadow: inset 0 0 0 1px var(--c-blue); }
        .aa-tag { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 4px 0 10px; border-radius: 8px; background: var(--c-nav-on); color: var(--c-nav-on-ink); font-size: 13px; font-weight: 500; max-width: 100%; }
        .aa-tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .aa-tag button { background: none; border: 0; color: inherit; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; line-height: 1; }
        .aa-tag button:hover { background: rgba(0,0,0,.08); }
        :root:root body .aa-chipsbox input.aa-chips-input.aa-chips-input[type] { flex: 1; min-width: 120px; border: 0 !important; box-shadow: none !important; min-height: 30px; padding: 0 4px; background: transparent !important; outline: none; }

        /* Answer bank table */
        .aa-table-wrap { overflow-x: auto; }
        .aa-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .aa-table th { text-align: left; font-weight: 500; color: var(--c-ink-2); font-size: 13px; padding: 8px 12px; border-bottom: 1px solid var(--c-line); }
        .aa-table td { padding: 10px 12px; border-bottom: 1px solid var(--c-line-soft); vertical-align: top; overflow-wrap: anywhere; color: var(--c-ink); }
        .aa-table td.aa-td-actions { white-space: nowrap; text-align: right; width: 1%; }

        /* Drawer */
        .aa-scrim { position: fixed; inset: 0; background: rgba(32,33,36,.45); z-index: 400; opacity: 0; transition: opacity .2s; }
        .aa-scrim.show { opacity: 1; }
        .aa-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--c-surface); z-index: 410; display: flex; flex-direction: column; box-shadow: var(--c-shadow-2); transform: translateX(100%); transition: transform .22s cubic-bezier(.2,0,0,1); }
        .aa-drawer.show { transform: none; }
        .aa-drawer[hidden], .aa-scrim[hidden] { display: none; }
        .aa-drawer-head { display: flex; gap: 12px; align-items: flex-start; padding: 16px 20px; border-bottom: 1px solid var(--c-line); }
        .aa-drawer-head h2 { font: 400 22px/28px var(--c-display); margin: 0; color: var(--c-ink); overflow-wrap: anywhere; }
        :root:root body .aa-drawer-head h2:focus, :root:root body .aa-drawer-head h2:focus-visible { outline: none; }
        .aa-drawer-head p { margin: 2px 0 0; color: var(--c-ink-2); font-size: 14px; }
        .aa-icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: var(--c-ink-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
        .aa-icon-btn:hover { background: var(--c-state); color: var(--c-ink); }
        .aa-icon-btn svg { width: 22px; height: 22px; }
        .aa-drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px 24px; overscroll-behavior: contain; }
        .aa-drawer-foot { border-top: 1px solid var(--c-line); padding: 12px 20px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--c-surface); }
        .aa-drawer-foot .aa-foot-note { flex: 1 1 200px; font-size: 13px; color: var(--c-ink-2); min-width: 0; }
        .aa-section-h { font: 500 14px/20px var(--c-display); color: var(--c-ink-2); margin: 20px 0 8px; letter-spacing: .1px; }
        .aa-section-h:first-child { margin-top: 0; }

        .aa-q { border: 1px solid var(--c-line-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; background: var(--c-surface); }
        .aa-q.is-needs { background: var(--c-yellow-tint); border-color: var(--c-yellow); }
        .aa-q.is-missing { border-color: var(--c-red); box-shadow: inset 0 0 0 1px var(--c-red); }
        .aa-q-head { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; }
        .aa-q-head label, .aa-q-head .aa-q-label { font-size: 14px; font-weight: 500; color: var(--c-ink); flex: 1 1 240px; overflow-wrap: anywhere; }
        .aa-badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--c-surface-3); color: var(--c-ink-2); }
        .aa-badge.src-profile { background: var(--c-blue-tint); color: var(--c-blue); }
        .aa-badge.src-bank { background: var(--c-green-tint); color: var(--c-green); }
        .aa-badge.src-ai { background: var(--c-yellow-tint); color: var(--c-ink); border: 1px solid var(--c-yellow); }
        .aa-badge.src-user { background: var(--c-surface-3); color: var(--c-ink); }
        .aa-q-foot { display: flex; align-items: center; gap: 8px; justify-content: space-between; margin-top: 8px; flex-wrap: wrap; font-size: 13px; color: var(--c-ink-2); }
        .aa-q-needs { color: var(--c-ink); font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
        .aa-q-needs svg { width: 16px; height: 16px; color: var(--c-yellow); }
        .aa-attest { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; font-size: 14px; color: var(--c-ink); line-height: 20px; }
        .aa-attest input { width: 20px; height: 20px; margin-top: 0; flex: none; }
        .aa-attest-set { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
        .aa-attest-set legend { padding: 0; margin-bottom: 4px; font-size: 14px; font-weight: 500; color: var(--c-ink); }
        .aa-attest-opt { display: inline-block; margin-top: 4px; font-weight: 500; }
        .aa-attest-desc { max-height: 160px; overflow-y: auto; white-space: pre-wrap; margin: 0 0 4px; }
        .aa-attest-desc.is-indented { margin: 8px 0 0 32px; }
        .aa-details { border: 1px solid var(--c-line); border-radius: 12px; margin: 8px 0; }
        .aa-details > summary { cursor: pointer; padding: 12px 14px; font: 500 14px var(--c-display); color: var(--c-ink); list-style: none; display: flex; justify-content: space-between; gap: 8px; }
        .aa-details > summary::-webkit-details-marker { display: none; }
        .aa-details > summary::after { content: "Show"; color: var(--c-blue); font-weight: 500; }
        .aa-details[open] > summary::after { content: "Hide"; }
        .aa-details > .aa-details-body { padding: 0 14px 12px; }
        .aa-missing-list { margin: 8px 0 0; padding-left: 20px; }
        .aa-missing-list a { color: inherit; font-weight: 500; }

        .aa-prefill { display: grid; gap: 8px; }
        .aa-prefill-row { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--c-line-soft); border-radius: 10px; padding: 10px 12px; }
        .aa-prefill-row > div { flex: 1; min-width: 0; }
        .aa-prefill-label { font-size: 12px; color: var(--c-ink-2); margin-bottom: 2px; overflow-wrap: anywhere; }
        .aa-prefill-value { font-size: 14px; color: var(--c-ink); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 160px; overflow-y: auto; }
        .aa-copy { flex: none; }

        .aa-timeline { list-style: none; margin: 0; padding: 0 0 0 4px; }
        .aa-timeline li { position: relative; padding: 0 0 16px 22px; border-left: 2px solid var(--c-line); margin-left: 5px; }
        .aa-timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
        .aa-timeline li::before { content: ""; position: absolute; left: -7px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--c-surface); border: 2px solid var(--c-blue); }
        .aa-timeline .t-type { font-weight: 500; font-size: 14px; color: var(--c-ink); }
        .aa-timeline .t-msg { font-size: 14px; color: var(--c-ink-2); overflow-wrap: anywhere; }
        .aa-timeline .t-time { font-size: 12px; color: var(--c-ink-2); }

        .aa-note { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--c-ink-2); background: var(--c-surface-2); border-radius: 8px; padding: 10px 12px; margin-top: 12px; }
        .aa-note svg { width: 18px; height: 18px; flex: none; color: var(--c-blue); }

        /* Toast */
        .aa-toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 120px); z-index: 600; display: flex; align-items: center; gap: 12px; max-width: min(560px, calc(100vw - 32px)); padding: 12px 16px; border-radius: 8px; background: #303134; color: #e8eaed; box-shadow: var(--c-shadow-2); font-size: 14px; opacity: 0; transition: all .2s; }
        .aa-toast.show { transform: translate(-50%, 0); opacity: 1; }
        .aa-toast.is-error { background: #8c1d18; color: #fff; }
        .aa-page [hidden], .aa-drawer [hidden] { display: none !important; }
        :root:root body .aa-toast a, .aa-toast button { color: #a8c7fa; font-weight: 500; background: none; border: 0; cursor: pointer; font-size: 14px; white-space: nowrap; padding: 0; }
        :root:root body .aa-toast.is-error a, .aa-toast.is-error button { color: #fff; text-decoration: underline; }

        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        @media (max-width: 720px) {
            .aa-header { margin-right: 48px; }
            .aa-grid, .aa-grid-3, .aa-radios { grid-template-columns: minmax(0, 1fr); }
            .aa-item { flex-wrap: wrap; padding: 14px; gap: 12px; }
            .aa-item-main { flex: 1 1 calc(100% - 68px); }
            .aa-item-actions { max-width: none; width: 100%; justify-content: flex-start; }
            .aa-drawer { width: 100vw; }
            .aa-drawer-head { padding: 12px 16px; }
            .aa-drawer-body { padding: 12px 16px 20px; }
            .aa-drawer-foot { padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
            .aa-fieldset { padding: 12px 14px 16px; }
            .aa-table thead { display: none; }
            .aa-table tr { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--c-line-soft); }
            .aa-table td { border: 0; padding: 0 4px; }
            .aa-table td.aa-td-actions { text-align: left; }
        }
        @media (prefers-reduced-motion: reduce) { .aa-drawer, .aa-scrim, .aa-toast, .aa-skel { transition: none; animation: none; } }
