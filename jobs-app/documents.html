<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumes · Cariara Jobs</title>
    <link rel="stylesheet" href="/css/theme.css?v=202609291426">
    <!-- Shared Sidebar Styles -->
    <link rel="stylesheet" href="/css/sidebar.css?v=202609291426">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            font-size: 13px;
        }
        .sidebar {
            width: 220px;
            background: #0f172a !important;
            border-right: 1px solid #1e293b !important;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 100;
        }
        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid #1e293b !important;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-header .logo { height: 24px; width: auto; }
        .sidebar-header .brand-name { font-size: 16px; font-weight: 600; color: #ffffff !important; }
        .sidebar-nav { flex: 1; padding: 8px; overflow-y: auto; }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            color: #94a3b8 !important;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 2px;
            font-size: 13px;
            font-weight: 500;
        }
        .sidebar-nav a:hover { background: #1e293b !important; color: #ffffff !important; }
        .sidebar-nav a.active { background: #4285f4 !important; color: #ffffff !important; }
        .sidebar-nav a svg { width: 16px; height: 16px; flex-shrink: 0; transition: transform 0.2s; }
        .sidebar-nav a:hover svg { transform: scale(1.1); }
        .nav-section-title {
            font-size: 11px;
            font-weight: 600;
            color: #64748b !important;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 12px 6px;
            margin-top: 8px;
        }
        .nav-section-title:first-child { margin-top: 0; padding-top: 4px; }
        .sidebar-submenu { padding: 2px 0 4px 24px; }
        .sidebar-submenu a { padding: 6px 10px; font-size: 12px; }
        .sidebar-submenu a.active { background: rgba(66, 133, 244, 0.15) !important; color: #4285f4 !important; }
        .sidebar-submenu a svg { width: 14px; height: 14px; }
        .sidebar-user { padding: 12px; border-top: 1px solid #1e293b !important; background: #0f172a !important; }
        .sidebar-user-info { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .sidebar-user-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #4285f4 0%, #1967d2 100%) !important;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 600; font-size: 11px;
        }
        .sidebar-user-name { font-weight: 500; color: #ffffff !important; font-size: 12px; }
        .sidebar-user-email { font-size: 11px; color: #64748b !important; }
        .sidebar-logout-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; padding: 6px; background: transparent !important;
            border: 1px solid #334155 !important; border-radius: 6px;
            color: #94a3b8 !important; font-size: 11px; cursor: pointer;
        }
        .sidebar-logout-btn:hover { background: #334155 !important; color: #ffffff !important; }
        .sidebar-logout-btn svg { width: 12px; height: 12px; }
        .sidebar-login-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; padding: 8px;
            background: #4285f4 !important;
            border: none; border-radius: 6px; color: white;
            font-size: 12px; font-weight: 500; text-decoration: none;
        }

        .main-content {
            flex: 1;
            margin-left: 220px;
            padding: 16px 24px;
            max-width: 600px;
        }
        .page-header {
            margin-bottom: 16px;
        }
        .page-header h1 { font-size: 18px; font-weight: 600; }

        .section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .file-upload-area {
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            background: var(--bg-tertiary);
            position: relative;
        }
        .file-upload-area:hover {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.05);
        }
        .file-upload-area svg { width: 20px; height: 20px; color: var(--accent-blue); margin-bottom: 4px; }
        .file-upload-area p { color: var(--text-secondary); font-size: 12px; margin: 0; }
        .file-upload-area small { color: var(--text-muted); font-size: 10px; }
        .file-upload-area input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        .documents-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }
        .document-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        .document-item:hover { border-color: var(--accent-blue); }
        .document-item .doc-icon {
            width: 28px; height: 28px; border-radius: 6px;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .document-item .doc-icon svg { width: 14px; height: 14px; color: white; }
        .document-item .doc-info { flex: 1; min-width: 0; }
        .document-item .doc-name {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .document-item .doc-meta { color: var(--text-muted); font-size: 10px; }
        .document-item .doc-badge {
            padding: 2px 6px;
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            font-size: 9px;
            font-weight: 600;
            border-radius: 3px;
            text-transform: uppercase;
        }
        .document-item .doc-actions { display: flex; gap: 4px; }
        .document-item .doc-actions button {
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
        }
        .document-item .doc-actions button:hover { background: var(--bg-hover); color: var(--text-primary); }
        .document-item .doc-actions button.delete { color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }
        .document-item .doc-actions button.delete:hover { background: rgba(239, 68, 68, 0.1); }
        .document-item .doc-actions button.primary { color: var(--accent-blue); border-color: rgba(59, 130, 246, 0.3); }
        .document-item .doc-actions button.primary:hover { background: rgba(59, 130, 246, 0.1); }

        .empty-state {
            text-align: center;
            padding: 16px;
            color: var(--text-muted);
            font-size: 12px;
        }
        .empty-state svg { width: 24px; height: 24px; margin-bottom: 4px; opacity: 0.5; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.2s ease;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: var(--c-ink, #202124); color: var(--c-surface, #fff); }
        .toast.error { background: var(--c-red, #d93025); color: #fff; }

        /* Top Right Controls */
        .top-right-controls {
            position: fixed;
            top: 16px;
            right: 24px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }
        .theme-toggle:hover { background: var(--bg-hover); color: var(--text-primary); }
        .theme-toggle svg { width: 18px; height: 18px; }
        .signout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .signout-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .signout-btn svg { width: 16px; height: 16px; }

        /* Mobile Hamburger Menu */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 250;
            width: 44px;
            height: 44px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .mobile-menu-btn:hover { background: var(--bg-hover); }
        .mobile-menu-btn svg { width: 22px; height: 22px; }
        .mobile-menu-btn .menu-close { display: none; }
        .mobile-menu-btn.active .menu-open { display: none; }
        .mobile-menu-btn.active .menu-close { display: block; }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 150;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .sidebar-backdrop.active { opacity: 1; }

        @media (max-width: 768px) {
            .mobile-menu-btn { display: flex; }
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                width: 280px;
                max-width: 85vw;
            }
            .sidebar.mobile-open { transform: translateX(0); }
            .sidebar-backdrop { display: block; }
            .main-content {
                margin-left: 0;
                padding: 16px;
                padding-top: 72px;
            }
            .sidebar-nav a {
                padding: 14px 16px;
                min-height: 48px;
            }
            .top-right-controls { top: 16px; right: 16px; gap: 8px; }
            .theme-toggle, .signout-btn {
                width: 44px; height: 44px; padding: 0; justify-content: center;
            }
            .signout-btn span { display: none; }
            .page-header h1 { font-size: 20px; }
            .document-actions { flex-direction: column; gap: 8px; }
            .btn { min-height: 44px; }
        }

        @media (max-width: 480px) {
            .mobile-menu-btn { top: 12px; left: 12px; width: 40px; height: 40px; }
            .main-content { padding: 12px; padding-top: 68px; }
            .top-right-controls { top: 12px; right: 12px; }
            .theme-toggle, .signout-btn { width: 40px; height: 40px; }
        }
    </style>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Top Right Controls -->
    <div class="top-right-controls">
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
            <svg id="theme-icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display:none;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>

    <script src="/js/app.js?v=202609291426"></script>
    <script>
        // API access, token refresh and error parsing come from js/app.js
        // (authFetch / extractErrorMessage / escapeHtml). Sidebar user menu,
        // mobile drawer and logout are owned by js/sidebar.js.

        function setTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('jobtrails-theme', t);
            updateThemeIcons(t);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            setTheme(current === 'dark' ? 'light' : 'dark');
        }

        function updateThemeIcons(theme) {
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');
            if (sunIcon && moonIcon) {
                sunIcon.style.display = theme === 'dark' ? 'block' : 'none';
                moonIcon.style.display = theme === 'dark' ? 'none' : 'block';
            }
        }

        setTheme(localStorage.getItem('jobtrails-theme') || 'light');

        function logout() {
            if (typeof window.handleLogout === 'function') window.handleLogout();
        }

        let toastTimer = null;
        function toast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${type} show`;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), type === 'error' ? 4000 : 2500);
        }

        function setupFileUpload(inputId, areaId, listId, docType) {
            const input = document.getElementById(inputId);
            const area = document.getElementById(areaId);
            area.addEventListener('dragover', (e) => {
                e.preventDefault();
                area.style.borderColor = 'var(--c-blue, var(--accent-blue))';
            });
            area.addEventListener('dragleave', () => { area.style.borderColor = ''; });
            area.addEventListener('drop', (e) => {
                e.preventDefault();
                area.style.borderColor = '';
                if (e.dataTransfer.files.length > 0) uploadUserDocument(e.dataTransfer.files[0], docType, listId);
            });
            input.addEventListener('change', () => {
                if (input.files.length > 0) {
                    uploadUserDocument(input.files[0], docType, listId);
                    input.value = '';
                }
            });
        }

        async function uploadUserDocument(file, docType, listId) {
            if (!requireAuth()) return;
            if (file.size > 5 * 1024 * 1024) { toast('File too large (max 5MB)', 'error'); return; }
            const formData = new FormData();
            formData.append('file', file);
            toast('Uploading…');
            try {
                const result = await uploadDocument(formData, docType);
                toast(result && result.warning ? 'Uploaded, but text could not be read from this file' : 'Uploaded',
                    result && result.warning ? 'error' : 'success');
                loadDocuments(docType, listId);
            } catch (e) {
                toast(e.message || 'Upload failed', 'error');
            }
        }

        async function loadDocuments(docType, listId) {
            if (!requireAuth()) return;
            const list = document.getElementById(listId);
            try {
                const r = await authFetch(`/users/documents?type=${encodeURIComponent(docType)}`);
                if (!r.ok) throw new Error(await extractErrorMessage(r, 'Could not load documents'));
                renderDocuments(await r.json(), listId, docType);
            } catch (e) {
                list.innerHTML = `<div class="empty-state"><p>${escapeHtml(e.message || 'Could not load documents')}</p></div>`;
            }
        }

        const FALLBACK_DOC_ICON = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>';
        const FALLBACK_MAIL_ICON = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>';

        function iconFor(name, fallback) {
            return (typeof CariaraIcons !== 'undefined' && CariaraIcons[name]) || fallback;
        }

        function renderDocuments(docs, listId, docType) {
            const list = document.getElementById(listId);
            const emptyIcon = docType === 'resume' ? iconFor('document', FALLBACK_DOC_ICON) : iconFor('email', FALLBACK_MAIL_ICON);
            const docIcon = iconFor('document', FALLBACK_DOC_ICON);

            if (!Array.isArray(docs) || docs.length === 0) {
                list.innerHTML = `<div class="empty-state">${emptyIcon}<p>No ${docType === 'resume' ? 'resumes' : 'cover letters'}</p></div>`;
                return;
            }
            list.innerHTML = docs.map(doc => {
                const id = Number(doc.id);
                return `
                <div class="document-item" data-doc-id="${id}">
                    <div class="doc-icon">${docIcon}</div>
                    <div class="doc-info">
                        <div class="doc-name" title="${escapeHtml(doc.filename)}">${escapeHtml(doc.filename)}</div>
                        <div class="doc-meta">${escapeHtml(formatDocDate(doc.created_at))}${doc.file_size ? ' &middot; ' + escapeHtml(formatFileSize(doc.file_size)) : ''}</div>
                    </div>
                    ${doc.is_default ? '<span class="doc-badge">Default</span>' : ''}
                    <div class="doc-actions">
                        ${!doc.is_default ? `<button type="button" data-action="default" class="primary">Make default</button>` : ''}
                        <button type="button" data-action="delete" class="delete">Delete</button>
                    </div>
                </div>`;
            }).join('');
            list.querySelectorAll('.document-item').forEach(item => {
                const id = Number(item.dataset.docId);
                item.querySelector('[data-action="default"]')?.addEventListener('click', () => setDefaultDocument(id, docType, listId));
                item.querySelector('[data-action="delete"]')?.addEventListener('click', () => deleteDocument(id, docType, listId));
            });
        }

        async function setDefaultDocument(docId, docType, listId) {
            if (!requireAuth()) return;
            try {
                const r = await authFetch(`/users/documents/${encodeURIComponent(docId)}/default`, { method: 'PUT' });
                if (!r.ok) throw new Error(await extractErrorMessage(r, 'Could not set the default document'));
                toast('Default updated');
                loadDocuments(docType, listId);
            } catch (e) {
                toast(e.message || 'Could not set the default document', 'error');
            }
        }

        async function deleteDocument(docId, docType, listId) {
            if (!confirm('Delete this document? This cannot be undone.')) return;
            if (!requireAuth()) return;
            try {
                const r = await authFetch(`/users/documents/${encodeURIComponent(docId)}`, { method: 'DELETE' });
                if (!r.ok) throw new Error(await extractErrorMessage(r, 'Could not delete the document'));
                toast('Deleted');
                loadDocuments(docType, listId);
            } catch (e) {
                toast(e.message || 'Could not delete the document', 'error');
            }
        }

        function formatDocDate(d) {
            if (!d) return '';
            const date = new Date(d);
            return isNaN(date) ? '' : date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatFileSize(b) {
            if (!b) return '';
            if (b < 1024) return b + ' B';
            if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
            return (b / (1024 * 1024)).toFixed(1) + ' MB';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!requireAuth()) return;
            // Check subscription status - require Quarterly Pro
            const hasAccess = await checkSubscriptionAccess();
            if (!hasAccess) return;

            setupFileUpload('resume-input', 'resume-upload-area', 'resumes-list', 'resume');
            setupFileUpload('cover-letter-input', 'cover-letter-upload-area', 'cover-letters-list', 'cover_letter');
            loadDocuments('resume', 'resumes-list');
            loadDocuments('cover_letter', 'cover-letters-list');
        });
    </script>
