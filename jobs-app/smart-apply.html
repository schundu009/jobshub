<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Apply - AI-Powered Job Applications</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        .smart-apply-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
            background: var(--bg-primary);
        }

        .smart-apply-header {
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .smart-apply-header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .job-url-input {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: 1;
            max-width: 600px;
        }

        .job-url-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
        }

        .job-url-input input:focus {
            outline: none;
            border-color: var(--accent-purple);
        }

        .btn-apply {
            padding: 10px 20px;
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-apply:hover {
            opacity: 0.9;
        }

        .iframe-container {
            flex: 1;
            position: relative;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .connection-error {
            text-align: center;
            color: var(--text-secondary);
        }

        .connection-error h3 {
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .connection-error p {
            margin-bottom: 16px;
        }

        .connection-error code {
            background: var(--bg-secondary);
            padding: 8px 16px;
            border-radius: 6px;
            display: block;
            margin: 12px 0;
        }

        .btn-retry {
            padding: 10px 20px;
            background: var(--accent-purple);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="smart-apply-container">
            <div class="smart-apply-header">
                <h1>Smart Apply</h1>
                <div class="job-url-input">
                    <input type="url" id="job-url" placeholder="Paste job URL here..." />
                    <button class="btn-apply" onclick="applyToJob()">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                        Apply
                    </button>
                </div>
                <div class="header-actions">
                    <a href="discover.html" class="btn btn-secondary" style="padding: 10px 16px; text-decoration: none; border-radius: 8px; background: var(--bg-tertiary); color: var(--text-primary);">
                        Back to Jobs
                    </a>
                </div>
            </div>

            <div class="iframe-container">
                <div class="loading-overlay" id="loading">
                    <div class="spinner"></div>
                    <p style="color: var(--text-secondary);">Connecting to Smart Apply...</p>
                </div>
                <iframe id="autoapply-frame" src="about:blank"></iframe>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/jobs-sidebar.js"></script>
    <script>
        // Production URL for Railway deployment, falls back to localhost for development
        const AUTOAPPLY_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:5001'
            : 'https://cariara-autoapply.up.railway.app';
        let connected = false;

        document.addEventListener('DOMContentLoaded', async function() {
            // Initialize sidebar
            if (typeof initJobsSidebar === 'function') {
                initJobsSidebar('smart-apply');
            }

            // Check for URL parameters
            const params = new URLSearchParams(window.location.search);
            const jobUrl = params.get('url');
            const jobId = params.get('job_id');

            if (jobUrl) {
                document.getElementById('job-url').value = decodeURIComponent(jobUrl);
            } else if (jobId) {
                // Fetch job details to get the URL
                await fetchJobUrl(jobId);
            }

            // Try to connect to autoapply
            await checkConnection();
        });

        async function fetchJobUrl(jobId) {
            try {
                const job = await apiRequest(`/jobs/${jobId}`);
                if (job && job.job_url) {
                    document.getElementById('job-url').value = job.job_url;
                }
            } catch (err) {
                console.error('Error fetching job details:', err);
            }
        }

        async function checkConnection() {
            const loading = document.getElementById('loading');
            const frame = document.getElementById('autoapply-frame');

            try {
                const response = await fetch(AUTOAPPLY_URL, { mode: 'no-cors' });
                // If we get here, the server is likely running
                connected = true;

                // Load the autoapply app with job URL if present
                const jobUrl = document.getElementById('job-url').value;
                if (jobUrl) {
                    frame.src = `${AUTOAPPLY_URL}/?url=${encodeURIComponent(jobUrl)}`;
                } else {
                    frame.src = AUTOAPPLY_URL;
                }

                frame.onload = () => {
                    loading.classList.add('hidden');
                };

                // Fallback timeout
                setTimeout(() => {
                    loading.classList.add('hidden');
                }, 3000);

            } catch (err) {
                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                loading.innerHTML = `
                    <div class="connection-error">
                        <h3>Smart Apply Not Available</h3>
                        <p>${isLocal ? 'The Smart Apply service needs to be started locally.' : 'The Smart Apply service is currently unavailable.'}</p>
                        ${isLocal ? '<code>cd /Users/chundu/autoapply && python app.py</code>' : '<p>Please try again in a few moments.</p>'}
                        <button class="btn-retry" onclick="checkConnection()">Retry Connection</button>
                    </div>
                `;
            }
        }

        function applyToJob() {
            const jobUrl = document.getElementById('job-url').value.trim();
            if (!jobUrl) {
                alert('Please enter a job URL');
                return;
            }

            const frame = document.getElementById('autoapply-frame');
            frame.src = `${AUTOAPPLY_URL}/?url=${encodeURIComponent(jobUrl)}`;

            const loading = document.getElementById('loading');
            loading.classList.remove('hidden');
            loading.innerHTML = `
                <div class="spinner"></div>
                <p style="color: var(--text-secondary);">Loading job...</p>
            `;

            frame.onload = () => {
                loading.classList.add('hidden');
            };

            setTimeout(() => {
                loading.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
