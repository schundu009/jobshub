<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account · Cariara Jobs</title>
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        body {
            background: var(--bg-primary) !important;
        }
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--bg-primary);
        }
        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-header .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .auth-header .logo {
            height: 48px;
            width: auto;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }
        .auth-header h1 {
            font-size: 32px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            letter-spacing: -0.02em;
        }
        .auth-header p {
            color: var(--text-muted);
            margin: 8px 0 0 0;
            font-size: 14px;
        }
        .auth-error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }
        .auth-error.show {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px var(--accent-blue-muted);
        }
        .form-group input::placeholder {
            color: var(--text-muted);
        }
        .password-field {
            position: relative;
        }
        .password-field input {
            padding-right: 60px;
        }
        .password-field button {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            padding: 4px 8px;
            transition: color 0.2s;
        }
        .password-field button:hover {
            color: var(--text-primary);
        }
        .password-requirements {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: var(--bg-tertiary);
            border-radius: 2px;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        .strength-weak { width: 33%; background: #ef4444; }
        .strength-medium { width: 66%; background: #f59e0b; }
        .strength-strong { width: 100%; background: #22c55e; }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease;
        }
        .btn-submit:hover {
            background: var(--accent-blue-hover);
            transform: translateY(-1px);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .auth-footer a {
            color: var(--accent-blue-light);
            text-decoration: none;
            font-weight: 500;
        }
        .auth-footer a:hover {
            color: var(--accent-blue);
            text-decoration: underline;
        }
    </style>
        <link rel="icon" href="/images/cariara-mark.svg" type="image/svg+xml">
    <meta name="robots" content="noindex,follow">
    <script src="/js/google-signin.js" defer></script>
    <script src="/js/icons.js" defer></script>
    <link rel="stylesheet" href="/css/cariara.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-container">
                    <a href="/" class="c-brand c-brand-lg" aria-label="Cariara Jobs home"><img class="c-brand-mark" src="/images/cariara-mark.svg" alt="" width="32" height="32"><img class="c-brand-word" src="/images/cariara-wordmark.svg" alt="Cariara" height="24"><span class="c-brand-product">Jobs</span></a>
                </div>
                <p>Create your job seeker account</p>
            </div>

            <div id="error-message" class="auth-error"></div>

            <div class="social-buttons"><a id="google-login" class="social-btn" href="/login.html">Continue with Google</a></div>
            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
                        <button type="button" onclick="togglePassword('password', 'password-toggle-btn')" id="password-toggle-btn">Show</button>
                    </div>
                    <div class="password-strength">
                        <div id="password-strength-bar" class="password-strength-bar"></div>
                    </div>
                    <p class="password-requirements">8+ characters, uppercase, lowercase, and number</p>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="password-field">
                        <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password">
                        <button type="button" onclick="togglePassword('confirm-password', 'confirm-toggle-btn')" id="confirm-toggle-btn">Show</button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="register-btn">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign in</a></p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = ['localhost', '127.0.0.1'].includes(window.location.hostname)
            ? 'http://localhost:8000'
            : 'https://cariara-backend.up.railway.app';
        const DEFAULT_REDIRECT = 'discover.html';

        // If a stored session still validates, skip registration and continue the
        // normal flow (onboarding -> role selection -> jobs). Never redirect on an
        // unvalidated token: that caused loops with expired sessions.
        (async function resumeExistingSession() {
            let token = localStorage.getItem('access_token') || localStorage.getItem('token');
            const refreshToken = localStorage.getItem('refresh_token');
            if (!token && !refreshToken) return;
            const statusFor = t => fetch(`${API_BASE}/api/users/onboarding-status`, { headers: { 'Authorization': `Bearer ${t}` } });
            try {
                let response = token ? await statusFor(token) : null;
                if ((!response || response.status === 401) && refreshToken) {
                    const r = await fetch(`${API_BASE}/auth/refresh`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refresh_token: refreshToken })
                    });
                    if (!r.ok) return;
                    const d = await r.json();
                    localStorage.setItem('access_token', d.access_token);
                    localStorage.setItem('token', d.access_token);
                    if (d.refresh_token) localStorage.setItem('refresh_token', d.refresh_token);
                    if (d.user) localStorage.setItem('user', JSON.stringify(d.user));
                    response = await statusFor(d.access_token);
                }
                if (!response || !response.ok) return;
                const status = await response.json();
                if (!status.onboarding_completed) window.location.replace('onboarding.html');
                else if (!status.roles_confirmed) window.location.replace('select-roles.html');
                else window.location.replace(DEFAULT_REDIRECT);
            } catch (e) {
                // Network error: stay on the registration page.
            }
        })();

        function togglePassword(inputId, buttonId) {
            const passwordInput = document.getElementById(inputId);
            const toggleBtn = document.getElementById(buttonId);
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = 'Show';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        function hideError() {
            const errorDiv = document.getElementById('error-message');
            errorDiv.classList.remove('show');
        }

        // Password strength indicator
        document.getElementById('password').addEventListener('input', (e) => {
            const password = e.target.value;
            const strengthBar = document.getElementById('password-strength-bar');

            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;

            strengthBar.className = 'password-strength-bar';
            if (strength <= 2) strengthBar.classList.add('strength-weak');
            else if (strength === 3) strengthBar.classList.add('strength-medium');
            else if (strength === 4) strengthBar.classList.add('strength-strong');
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const registerBtn = document.getElementById('register-btn');

            // Validate passwords match
            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            // Validate password requirements
            if (password.length < 8) {
                showError('Password must be at least 8 characters');
                return;
            }
            if (!/[A-Z]/.test(password)) {
                showError('Password must contain at least one uppercase letter');
                return;
            }
            if (!/[a-z]/.test(password)) {
                showError('Password must contain at least one lowercase letter');
                return;
            }
            if (!/[0-9]/.test(password)) {
                showError('Password must contain at least one number');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = 'Creating account...';

            try {
                let response;
                try {
                    response = await fetch(`${API_BASE}/auth/register`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ name, email: email.trim(), password }),
                    });
                } catch (networkError) {
                    throw new Error("Can't reach Cariara right now. Check your connection and try again.");
                }

                let data = null;
                try { data = await response.json(); } catch (e) { data = null; }

                if (!response.ok) {
                    const detail = data && data.detail;
                    const message = Array.isArray(detail)
                        ? detail.map(d => (d && d.msg) || String(d)).join('; ')
                        : (detail || (response.status >= 500
                            ? 'Cariara is having trouble right now. Please try again in a moment.'
                            : 'Registration failed'));
                    throw new Error(message);
                }

                // Store tokens
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('refresh_token', data.refresh_token);
                localStorage.setItem('token', data.access_token); // For compatibility
                localStorage.setItem('user', JSON.stringify(data.user));

                // New accounts always start with onboarding (resume, personal info, preferences)
                window.location.href = 'onboarding.html';
            } catch (error) {
                showError(error.message);
                registerBtn.disabled = false;
                registerBtn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
