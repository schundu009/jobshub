<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cariara - Job Details</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
        }
        .main-content {
            flex: 1;
            margin-left: 220px;
            padding: 24px;
            max-width: 1000px;
        }
        @media (max-width: 768px) {
            .main-content { margin-left: 0; padding: 16px; }
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .back-link:hover { color: var(--text-primary); }
        .back-link svg { width: 16px; height: 16px; }
        .job-header {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .job-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .job-company {
            font-size: 16px;
            color: var(--accent-blue);
            margin-bottom: 16px;
        }
        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .job-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .job-meta-item svg { width: 16px; height: 16px; opacity: 0.7; }
        .job-meta-item.salary { color: #22c55e; font-weight: 600; }

        /* Apply Section */
        .apply-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .apply-section h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .apply-section h3 svg { width: 20px; height: 20px; color: var(--accent-blue); }
        .apply-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover { background: var(--bg-hover); }
        .btn-download {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }
        .btn-download:hover { opacity: 0.9; }
        .btn svg { width: 18px; height: 18px; }
        .download-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        .download-section h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }
        .download-hint {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 12px;
        }

        .job-description {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
        }
        .job-description h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
        .job-description-content {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.8;
            white-space: pre-line;
        }
        .job-description-content p { margin-bottom: 12px; }
        .job-description-content ul, .job-description-content ol {
            margin: 12px 0;
            padding-left: 24px;
        }
        .job-description-content li { margin-bottom: 6px; }
        .no-description {
            text-align: center;
            padding: 32px 20px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }
        .no-description p {
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .fetch-desc-btn {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            font-size: 14px;
        }
        .fetch-desc-btn:hover {
            background: var(--accent-blue-muted);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }
        .error {
            text-align: center;
            padding: 60px;
            color: var(--accent-red);
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            display: none;
            z-index: 1000;
        }
        .toast.success { border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
        .toast.error { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .toast.show { display: block; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.applied { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .status-badge.queued { background: rgba(20, 184, 166, 0.15); color: #14b8a6; }
        .status-badge.new { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <main class="main-content">
        <a href="discover.html" class="back-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Back to Jobs
        </a>

        <div id="job-content">
            <div class="loading">Loading job details...</div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="/js/app.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get('id');
        let currentJob = null;
        let userResumes = [];

        async function loadJob() {
            console.log('[JobDetail] Starting loadJob, jobId:', jobId);
            if (!jobId) {
                document.getElementById('job-content').innerHTML = '<div class="error">No job ID provided</div>';
                return;
            }

            try {
                console.log('[JobDetail] Fetching job data...');
                const job = await apiRequest(`/jobs/${jobId}`);
                console.log('[JobDetail] Job loaded:', job?.title);

                currentJob = job;

                // Load user's resumes for download options
                const documents = await apiRequest('/users/documents').catch(e => {
                    console.log('[JobDetail] Documents fetch failed:', e.message);
                    return [];
                });

                userResumes = (documents || []).filter(d => d.document_type === 'resume');

                console.log('[JobDetail] Rendering job...');
                renderJob(job);
                console.log('[JobDetail] Job rendered successfully');
            } catch (error) {
                console.error('[JobDetail] Error loading job:', error);
                document.getElementById('job-content').innerHTML = `<div class="error">Failed to load job: ${error.message}</div>`;
            }
        }

        function renderJob(job) {
            try {
                const location = job.location || 'Location not specified';
                const department = job.department || '';
                const postedDate = job.posted_date ? formatRelativeDate(job.posted_date) : '';
                const salary = formatSalary(job.salary_min, job.salary_max);
                const companyName = job.company?.name || job.company_name || 'Company';

            document.getElementById('job-content').innerHTML = `
                <div class="job-header">
                    <h1 class="job-title">${escapeHtml(job.title)}</h1>
                    <div class="job-company">${escapeHtml(companyName)}</div>
                    <div class="job-meta">
                        <div class="job-meta-item">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            ${escapeHtml(location)}
                        </div>
                        ${department ? `<div class="job-meta-item">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                            ${escapeHtml(department)}
                        </div>` : ''}
                        ${salary ? `<div class="job-meta-item salary">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            ${salary}
                        </div>` : ''}
                        ${postedDate ? `<div class="job-meta-item">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            ${postedDate}
                        </div>` : ''}
                    </div>
                </div>

                <div class="apply-section">
                    <h3>
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Apply for this Position
                    </h3>
                    <div class="apply-actions">
                        ${job.job_url ? `<a href="${escapeHtml(job.job_url)}" target="_blank" class="btn btn-primary">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            Apply on Company Site
                        </a>` : '<p style="color:var(--text-muted);">No application URL available</p>'}
                    </div>
                    <div class="download-section">
                        <h4>Download ATS-Optimized Documents</h4>
                        <div class="apply-actions">
                            <button onclick="downloadTailoredResume()" class="btn btn-download" id="download-cv-btn">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                Download Tailored CV
                            </button>
                            <button onclick="downloadCoverLetter()" class="btn btn-download" id="download-cl-btn" style="background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                Generate Cover Letter
                            </button>
                            <a href="documents.html" class="btn btn-secondary">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                                Manage Documents
                            </a>
                        </div>
                        <p class="download-hint">These documents are tailored to match the job requirements for better ATS compatibility.</p>
                    </div>
                </div>

                <div class="job-description">
                    <h3>Job Description</h3>
                    <div class="job-description-content" id="job-description-content">
                        ${job.job_description || job.ai_summary || `
                            <div class="no-description">
                                <p>No description available.</p>
                                <button onclick="fetchJobDescription(${job.id})" class="btn btn-secondary fetch-desc-btn" id="fetch-desc-btn">
                                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="vertical-align: middle; margin-right: 6px;">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                    </svg>
                                    Fetch Description
                                </button>
                            </div>
                        `}
                    </div>
                </div>
            `;
            } catch (err) {
                console.error('Error rendering job:', err);
                document.getElementById('job-content').innerHTML = `
                    <div class="error">
                        Error rendering job details. Please refresh the page.
                        <br><br>
                        ${job?.job_url ? `<a href="${job.job_url}" target="_blank" class="btn btn-primary">View Original Job Posting</a>` : ''}
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatSalary(min, max) {
            if (!min && !max) return '';
            const fmt = (n) => '$' + n.toLocaleString();
            if (min && max) return `${fmt(min)} - ${fmt(max)}/yr`;
            if (min) return `From ${fmt(min)}/yr`;
            if (max) return `Up to ${fmt(max)}/yr`;
            return '';
        }

        function formatRelativeDate(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diffMs = now - date;
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return 'Posted today';
            if (diffDays === 1) return 'Posted yesterday';
            if (diffDays < 7) return `Posted ${diffDays} days ago`;
            if (diffDays < 30) return `Posted ${Math.floor(diffDays / 7)} weeks ago`;
            return `Posted ${date.toLocaleDateString()}`;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // Download tailored resume for this job
        async function downloadTailoredResume() {
            const btn = document.getElementById('download-cv-btn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> Generating...';

            try {
                if (!getAccessToken()) {
                    window.location.href = 'login.html';
                    return;
                }

                // Request tailored resume from AI
                const response = await apiRequest(`/ai/tailor-resume/${jobId}`, 'POST');

                if (response.tailored_resume) {
                    // Create download
                    const blob = new Blob([response.tailored_resume], { type: 'text/plain' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Resume_${currentJob?.company_name || 'Company'}_${currentJob?.title || 'Position'}.txt`.replace(/[^a-zA-Z0-9_\-\.]/g, '_');
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    showToast('Tailored resume downloaded!', 'success');
                } else {
                    showToast('Could not generate tailored resume. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Error downloading resume:', error);
                showToast(error.message || 'Failed to generate tailored resume', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> Download Tailored CV';
            }
        }

        // Generate and download cover letter for this job
        async function downloadCoverLetter() {
            const btn = document.getElementById('download-cl-btn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> Generating...';

            try {
                if (!getAccessToken()) {
                    window.location.href = 'login.html';
                    return;
                }

                // Request cover letter from AI
                const response = await apiRequest(`/ai/generate-cover-letter/${jobId}`, 'POST');

                if (response.cover_letter) {
                    // Create download
                    const blob = new Blob([response.cover_letter], { type: 'text/plain' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `CoverLetter_${currentJob?.company_name || 'Company'}_${currentJob?.title || 'Position'}.txt`.replace(/[^a-zA-Z0-9_\-\.]/g, '_');
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    showToast('Cover letter downloaded!', 'success');
                } else {
                    showToast('Could not generate cover letter. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Error downloading cover letter:', error);
                showToast(error.message || 'Failed to generate cover letter', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> Generate Cover Letter';
            }
        }

        // Check authentication and role selection
        async function init() {
            if (!getAccessToken()) {
                window.location.href = 'login.html';
                return;
            }

            // Check role selection
            try {
                const status = await apiRequest('/users/onboarding-status');
                if (!status.roles_confirmed) {
                    window.location.href = 'select-roles.html';
                    return;
                }
            } catch (error) {
                console.error('Failed to check status:', error);
            }

            loadJob();
        }

        // Fetch job description from URL
        async function fetchJobDescription(jobId) {
            const btn = document.getElementById('fetch-desc-btn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border:2px solid var(--border-color);border-top-color:var(--accent-blue);border-radius:50%;display:inline-block;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:6px;"></span>Fetching...';
            }

            try {
                const response = await apiRequest(`/ingest/refetch-description/${jobId}`, 'POST');

                if (response.new_description_length && response.new_description_length > 100) {
                    showToast('Job description fetched successfully!', 'success');
                    setTimeout(() => window.location.reload(), 1000);
                } else {
                    showToast('Could not fetch description from job URL. Try viewing the original posting.', 'warning');
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="vertical-align: middle; margin-right: 6px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>Retry Fetch';
                    }
                }
            } catch (error) {
                console.error('Error fetching description:', error);
                showToast('Failed to fetch description: ' + (error.message || 'Unknown error'), 'error');
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="vertical-align: middle; margin-right: 6px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>Retry Fetch';
                }
            }
        }

        init();
    </script>
</body>
</html>
