<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cariara Admin - Settings</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/admin-layout.css">
    <style>
        .settings-section {
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .settings-section h3 {
            margin: 0 0 5px 0;
            color: var(--text-primary);
        }
        .settings-section p {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0 0 20px 0;
        }
        .api-key-form {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .api-key-form input {
            flex: 1;
            padding: 12px 15px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-default);
            border-radius: 8px;
            font-size: 14px;
            font-family: monospace;
            color: var(--text-primary);
        }
        .api-key-form input:focus {
            border-color: var(--accent-primary);
            outline: none;
        }
        .api-key-status {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        .api-key-status.configured {
            background: var(--success-muted);
            color: var(--success);
            border: 1px solid var(--success);
        }
        .api-key-status.not-configured {
            background: var(--warning-muted);
            color: var(--warning);
            border: 1px solid var(--warning);
        }
        .api-key-status.error {
            background: var(--error-muted);
            color: var(--error);
            border: 1px solid var(--error);
        }
        .key-preview {
            font-family: monospace;
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 3px;
        }
        .btn-test {
            background: var(--info);
            color: white;
        }
        .btn-remove {
            background: var(--error);
            color: white;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="settings-section">
            <h3>OpenAI API Key</h3>

            <div id="api-key-status" class="api-key-status not-configured">
                <span class="status-icon">⏳</span> Checking API key status...
            </div>

            <div class="api-key-form" id="api-key-form">
                <input type="password" id="api-key-input" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
                <button class="btn btn-primary" onclick="saveApiKey()">Save</button>
                <button class="btn btn-test" onclick="testApiKey()">Test</button>
                <button class="btn btn-remove" onclick="removeApiKey()" id="remove-btn" style="display: none;">Remove</button>
            </div>
        </div>

        <div class="settings-section">
            <h3>Batch Ingestion</h3>

            <div id="batch-status-banner" style="display: none; background: var(--bg-tertiary); border-radius: 8px; padding: 12px 16px; margin-bottom: 15px; border-left: 4px solid var(--accent-primary);">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div id="status-indicator" style="width: 10px; height: 10px; border-radius: 50%; background: var(--accent-primary); animation: pulse 1.5s infinite;"></div>
                    <span id="batch-status-text" style="font-weight: 500; color: var(--text-primary);">Idle</span>
                    <span id="batch-current-company" style="color: var(--text-secondary); font-size: 13px;"></span>
                </div>
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                <button class="btn btn-primary" onclick="startBatchIngestion(false)" id="batch-fast-btn">
                    ▶ Start Fast Batch
                </button>
                <button class="btn btn-secondary" onclick="startBatchIngestion(true)" id="batch-slow-btn">
                    🐢 Slow Companies
                </button>
                <button class="btn btn-remove" onclick="stopBatchIngestion()" id="batch-stop-btn" style="display: none;">
                    ⏹ Stop
                </button>
                <button class="btn btn-secondary" onclick="triggerWebhook()" id="webhook-btn">
                    🔄 Trigger Scrapers
                </button>
                <button class="btn btn-secondary" onclick="checkBatchStatus()" id="batch-check-btn">
                    📊 Status
                </button>
            </div>

            <div id="batch-progress" style="display: none;">
                <div style="background: var(--bg-tertiary); border-radius: 8px; padding: 20px; margin-top: 10px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span id="batch-progress-text" style="font-weight: 500; color: var(--text-primary);">Processing...</span>
                        <span id="batch-progress-percent" style="font-weight: 600; color: var(--accent-primary);">0%</span>
                    </div>
                    <div style="background: var(--border-default); border-radius: 4px; height: 12px; overflow: hidden;">
                        <div id="batch-progress-bar" style="background: linear-gradient(90deg, var(--accent-primary), #4ade80); height: 100%; width: 0%; transition: width 0.3s;"></div>
                    </div>

                    <div id="time-metrics" style="margin-top: 12px; display: flex; gap: 20px; font-size: 12px; color: var(--text-muted);">
                        <span>⏱ Elapsed: <strong id="stat-elapsed" style="color: var(--text-secondary);">0:00</strong></span>
                        <span>⏳ Remaining: <strong id="stat-remaining" style="color: var(--text-secondary);">--</strong></span>
                        <span>📈 Rate: <strong id="stat-rate" style="color: var(--text-secondary);">-- src/min</strong></span>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; margin-top: 15px;">
                        <div style="background: var(--bg-elevated); border-radius: 6px; padding: 12px; text-align: center;">
                            <div style="font-size: 24px; font-weight: 700; color: var(--text-primary);" id="stat-processed">0</div>
                            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Processed</div>
                            <div style="font-size: 10px; color: var(--text-tertiary);">of <span id="stat-total">0</span></div>
                        </div>
                        <div style="background: var(--bg-elevated); border-radius: 6px; padding: 12px; text-align: center;">
                            <div style="font-size: 24px; font-weight: 700; color: #4ade80;" id="stat-success">0</div>
                            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Success</div>
                        </div>
                        <div style="background: var(--bg-elevated); border-radius: 6px; padding: 12px; text-align: center;">
                            <div style="font-size: 24px; font-weight: 700; color: #f87171;" id="stat-failed">0</div>
                            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Failed</div>
                        </div>
                        <div style="background: var(--bg-elevated); border-radius: 6px; padding: 12px; text-align: center;">
                            <div style="font-size: 24px; font-weight: 700; color: #60a5fa;" id="stat-added">0</div>
                            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Jobs Added</div>
                        </div>
                        <div style="background: var(--bg-elevated); border-radius: 6px; padding: 12px; text-align: center;">
                            <div style="font-size: 24px; font-weight: 700; color: #fbbf24;" id="stat-updated">0</div>
                            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Updated</div>
                        </div>
                        <div style="background: var(--bg-elevated); border-radius: 6px; padding: 12px; text-align: center;">
                            <div style="font-size: 24px; font-weight: 700; color: #a78bfa;" id="stat-deactivated">0</div>
                            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Deactivated</div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="log-container" style="margin-top: 15px; display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <h4 style="margin: 0; font-size: 14px; color: var(--text-primary);">📋 Live Logs</h4>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <span id="log-count" style="font-size: 11px; color: var(--text-muted);">0 entries</span>
                        <label style="font-size: 12px; color: var(--text-secondary);">
                            <input type="checkbox" id="auto-scroll" checked> Auto-scroll
                        </label>
                        <button onclick="clearLogs()" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px;">Clear</button>
                    </div>
                </div>
                <div id="log-viewer" style="
                    background: #0d0d1a;
                    border: 1px solid var(--border-default);
                    border-radius: 8px;
                    padding: 12px;
                    height: 350px;
                    overflow-y: auto;
                    font-family: 'Monaco', 'Menlo', monospace;
                    font-size: 12px;
                    line-height: 1.8;
                "></div>
            </div>

            <div id="batch-summary" style="display: none; margin-top: 15px; background: var(--bg-tertiary); border-radius: 8px; padding: 20px; border: 1px solid var(--border-default);">
                <h4 style="margin: 0 0 15px 0; color: var(--text-primary);">📊 Batch Summary</h4>
                <div id="summary-content"></div>
            </div>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/admin-sidebar.js"></script>
    <script>
        // Initialize admin layout and page
        document.addEventListener('DOMContentLoaded', function() {
            initAdminLayout('settings', 'Settings');

            // Initialize after layout is ready
            document.getElementById('api-key-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') saveApiKey();
            });
            checkApiKeyStatus();
            if (currentBatchJobId) checkBatchStatus(true);
        });

        async function checkApiKeyStatus() {
            const statusDiv = document.getElementById('api-key-status');
            const removeBtn = document.getElementById('remove-btn');
            const apiKeyInput = document.getElementById('api-key-input');

            try {
                const response = await apiRequest('/settings/api-key');

                if (response.is_set) {
                    statusDiv.className = 'api-key-status configured';
                    statusDiv.innerHTML = `<span class="status-icon">✓</span> API key configured: <span class="key-preview">${response.key_preview}</span>`;
                    apiKeyInput.placeholder = 'Enter new key to replace...';
                    removeBtn.style.display = 'inline-block';
                } else {
                    statusDiv.className = 'api-key-status not-configured';
                    statusDiv.innerHTML = `<span class="status-icon">⚠</span> No API key configured`;
                    apiKeyInput.placeholder = 'sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx';
                    removeBtn.style.display = 'none';
                }
            } catch (error) {
                statusDiv.className = 'api-key-status error';
                statusDiv.innerHTML = `<span class="status-icon">✗</span> Error: ${error.message}`;
            }
        }

        async function saveApiKey() {
            const input = document.getElementById('api-key-input');
            const apiKey = input.value.trim();

            if (!apiKey) {
                showAlert('Please enter an API key', 'error');
                return;
            }

            try {
                await apiRequest('/settings/api-key', 'POST', { api_key: apiKey });
                showAlert('API key saved successfully');
                input.value = '';
                checkApiKeyStatus();
            } catch (error) {
                showAlert('Failed to save API key: ' + error.message, 'error');
            }
        }

        async function testApiKey() {
            const statusDiv = document.getElementById('api-key-status');
            const input = document.getElementById('api-key-input');
            const testKey = input.value.trim();

            statusDiv.innerHTML = `<span class="status-icon">⏳</span> Testing API key...`;

            try {
                let response;
                if (testKey) {
                    response = await apiRequest('/settings/test-api-key', 'POST', { api_key: testKey });
                } else {
                    response = await apiRequest('/settings/test-api-key');
                }

                if (response.valid) {
                    statusDiv.className = 'api-key-status configured';
                    statusDiv.innerHTML = `<span class="status-icon">✓</span> API key is valid!`;
                    showAlert('API key is valid!');
                } else {
                    statusDiv.className = 'api-key-status error';
                    statusDiv.innerHTML = `<span class="status-icon">✗</span> ${response.message}`;
                    showAlert(response.message, 'error');
                }
            } catch (error) {
                statusDiv.className = 'api-key-status error';
                statusDiv.innerHTML = `<span class="status-icon">✗</span> Error: ${error.message}`;
                showAlert('Error testing API key: ' + error.message, 'error');
            }

            setTimeout(checkApiKeyStatus, 2000);
        }

        async function removeApiKey() {
            if (!confirm('Are you sure you want to remove the API key?')) return;

            try {
                await apiRequest('/settings/api-key', 'DELETE');
                showAlert('API key removed');
                checkApiKeyStatus();
            } catch (error) {
                showAlert('Failed to remove API key: ' + error.message, 'error');
            }
        }

        // Batch Ingestion
        let currentBatchJobId = localStorage.getItem('currentBatchJobId');
        let eventSource = null;
        let batchStartTime = null;
        let logCount = 0;

        function setBatchButtonsState(running) {
            document.getElementById('batch-fast-btn').disabled = running;
            document.getElementById('batch-slow-btn').disabled = running;
            document.getElementById('batch-stop-btn').style.display = running ? 'inline-block' : 'none';
        }

        async function startBatchIngestion(slowOnly = false) {
            const progressDiv = document.getElementById('batch-progress');
            const logContainer = document.getElementById('log-container');
            const logViewer = document.getElementById('log-viewer');
            const summaryDiv = document.getElementById('batch-summary');

            setBatchButtonsState(true);
            batchStartTime = Date.now();
            logCount = 0;
            document.getElementById('log-count').textContent = '0 entries';
            logViewer.innerHTML = '';
            summaryDiv.style.display = 'none';

            try {
                let url = '/ingest/sources/refresh/batch/async?batch_size=10&timeout_per_source=120';
                url += slowOnly ? '&slow_only=true' : '&exclude_slow=true';

                const response = await apiRequest(url, 'POST');
                currentBatchJobId = response.job_id;
                localStorage.setItem('currentBatchJobId', currentBatchJobId);

                document.getElementById('batch-status-banner').style.display = 'block';
                document.getElementById('batch-status-text').textContent = `Starting (${response.mode})`;
                document.getElementById('batch-current-company').textContent = `Job ID: ${response.job_id}`;

                progressDiv.style.display = 'block';
                logContainer.style.display = 'block';
                document.getElementById('stat-total').textContent = response.total_sources;

                showAlert(`Batch job started! Processing ${response.total_sources} sources.`);
                startLogStream(currentBatchJobId);
            } catch (error) {
                document.getElementById('batch-status-banner').style.display = 'block';
                document.getElementById('batch-status-text').textContent = 'Error';
                document.getElementById('batch-current-company').textContent = error.message;
                showAlert('Failed to start batch: ' + error.message, 'error');
                setBatchButtonsState(false);
            }
        }

        async function stopBatchIngestion() {
            if (!currentBatchJobId) {
                showAlert('No batch job to stop', 'error');
                return;
            }

            try {
                const response = await apiRequest(`/ingest/sources/refresh/batch/stop/${currentBatchJobId}`, 'POST');
                showAlert(response.message);
            } catch (error) {
                showAlert('Failed to stop batch: ' + error.message, 'error');
            }
        }

        function startLogStream(jobId) {
            stopLogStream();
            const logContainer = document.getElementById('log-container');
            logContainer.style.display = 'block';

            eventSource = new EventSource(`${API_BASE}/ingest/sources/refresh/batch/stream/${jobId}`);

            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'log') appendLog(data.data);
                    else if (data.type === 'status') updateBatchProgress(data.data);
                    else if (data.type === 'done') {
                        updateBatchProgress(data.data);
                        stopLogStream();
                        if (data.data.status === 'completed') showAlert('Batch ingestion completed!');
                    }
                } catch (e) { console.error('SSE parse error:', e); }
            };

            eventSource.onerror = () => {
                stopLogStream();
                startLogPolling(jobId);
            };
        }

        function stopLogStream() {
            if (eventSource) { eventSource.close(); eventSource = null; }
        }

        let logPollInterval = null;
        let logSince = 0;

        function startLogPolling(jobId) {
            stopLogPolling();
            logPollInterval = setInterval(async () => {
                try {
                    const [statusRes, logsRes] = await Promise.all([
                        apiRequest(`/ingest/sources/refresh/batch/status/${jobId}`),
                        apiRequest(`/ingest/sources/refresh/batch/logs/${jobId}?since=${logSince}`)
                    ]);
                    updateBatchProgress(statusRes);
                    logsRes.logs.forEach(log => appendLog(log));
                    logSince = logsRes.next_since;
                    if (statusRes.status !== 'running') stopLogPolling();
                } catch (e) { console.error('Poll error:', e); }
            }, 2000);
        }

        function stopLogPolling() {
            if (logPollInterval) { clearInterval(logPollInterval); logPollInterval = null; }
        }

        function appendLog(log) {
            const logViewer = document.getElementById('log-viewer');
            const autoScroll = document.getElementById('auto-scroll').checked;

            const icons = { 'info': '📋', 'success': '✅', 'error': '❌', 'warning': '⚠️' };
            const colors = { 'info': '#60a5fa', 'success': '#4ade80', 'error': '#f87171', 'warning': '#fbbf24' };

            const time = new Date(log.timestamp).toLocaleTimeString();
            const color = colors[log.level] || '#94a3b8';
            const icon = icons[log.level] || '•';

            const logLine = document.createElement('div');
            logLine.style.cssText = `color: ${color}; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.05);`;
            logLine.innerHTML = `<span style="color:#4a5568;margin-right:8px;">${time}</span><span style="margin-right:6px;">${icon}</span>${escapeHtml(log.message)}`;

            logViewer.appendChild(logLine);
            logCount++;
            document.getElementById('log-count').textContent = `${logCount} entries`;
            if (autoScroll) logViewer.scrollTop = logViewer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function checkBatchStatus(silent = false) {
            if (!currentBatchJobId) {
                if (!silent) showAlert('No batch job running.', 'error');
                return;
            }

            try {
                const response = await apiRequest(`/ingest/sources/refresh/batch/status/${currentBatchJobId}`);
                updateBatchProgress(response);

                const logsRes = await apiRequest(`/ingest/sources/refresh/batch/logs/${currentBatchJobId}`);
                const logViewer = document.getElementById('log-viewer');
                document.getElementById('log-container').style.display = 'block';
                logViewer.innerHTML = '';
                logsRes.logs.forEach(log => appendLog(log));
                logSince = logsRes.next_since;

                if (response.status === 'running') startLogStream(currentBatchJobId);
            } catch (error) {
                currentBatchJobId = null;
                localStorage.removeItem('currentBatchJobId');
                setBatchButtonsState(false);
                if (!silent) showAlert('Previous batch job no longer exists.', 'warning');
            }
        }

        function updateBatchProgress(status) {
            const progressDiv = document.getElementById('batch-progress');
            const statusBanner = document.getElementById('batch-status-banner');
            const summaryDiv = document.getElementById('batch-summary');

            progressDiv.style.display = 'block';
            statusBanner.style.display = 'block';

            const percent = status.total_sources > 0 ? Math.round((status.processed / status.total_sources) * 100) : 0;

            document.getElementById('batch-progress-bar').style.width = percent + '%';
            document.getElementById('batch-progress-percent').textContent = percent + '%';

            document.getElementById('stat-processed').textContent = status.processed;
            document.getElementById('stat-total').textContent = status.total_sources;
            document.getElementById('stat-success').textContent = status.sources_refreshed;
            document.getElementById('stat-failed').textContent = status.sources_failed;
            document.getElementById('stat-added').textContent = status.jobs_added;
            document.getElementById('stat-updated').textContent = status.jobs_updated;
            document.getElementById('stat-deactivated').textContent = status.jobs_deactivated || 0;

            if (batchStartTime) {
                const elapsed = Math.floor((Date.now() - batchStartTime) / 1000);
                document.getElementById('stat-elapsed').textContent = formatTime(elapsed);

                if (status.processed > 0 && status.total_sources > status.processed) {
                    const rate = status.processed / (elapsed / 60);
                    const remaining = (status.total_sources - status.processed) / rate * 60;
                    document.getElementById('stat-remaining').textContent = formatTime(Math.round(remaining));
                    document.getElementById('stat-rate').textContent = rate.toFixed(1) + ' src/min';
                }
            }

            const indicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('batch-status-text');
            const currentCompany = document.getElementById('batch-current-company');

            if (status.status === 'running') {
                setBatchButtonsState(true);
                indicator.style.background = '#4ade80';
                indicator.style.animation = 'pulse 1.5s infinite';
                statusText.textContent = `Running${status.mode ? ` (${status.mode})` : ''}`;
                currentCompany.textContent = status.current_source ? `→ ${status.current_source}` : '';
                document.getElementById('batch-progress-text').textContent = `Processing ${status.processed} of ${status.total_sources}`;
                summaryDiv.style.display = 'none';
            } else if (status.status === 'completed') {
                setBatchButtonsState(false);
                indicator.style.background = '#22c55e';
                indicator.style.animation = 'none';
                statusText.textContent = 'Completed';
                currentCompany.textContent = '';
                document.getElementById('batch-progress-text').textContent = 'Batch completed successfully';
                showBatchSummary(status);
            } else if (status.status === 'stopped' || status.status === 'failed') {
                setBatchButtonsState(false);
                indicator.style.background = status.status === 'stopped' ? '#fbbf24' : '#ef4444';
                indicator.style.animation = 'none';
                statusText.textContent = status.status === 'stopped' ? 'Stopped' : 'Failed';
                currentCompany.textContent = status.error || '';
                showBatchSummary(status);
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function showBatchSummary(status) {
            const summaryDiv = document.getElementById('batch-summary');
            const content = document.getElementById('summary-content');

            const successRate = status.total_sources > 0 ? ((status.sources_refreshed / status.total_sources) * 100).toFixed(1) : 0;
            const elapsed = batchStartTime ? Math.floor((Date.now() - batchStartTime) / 1000) : 0;

            content.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                    <div>
                        <div style="color: var(--text-muted); font-size: 12px; margin-bottom: 4px;">Sources Processed</div>
                        <div style="font-size: 18px; font-weight: 600; color: var(--text-primary);">${status.processed} of ${status.total_sources}</div>
                    </div>
                    <div>
                        <div style="color: var(--text-muted); font-size: 12px; margin-bottom: 4px;">Success Rate</div>
                        <div style="font-size: 18px; font-weight: 600; color: ${successRate >= 80 ? '#4ade80' : successRate >= 50 ? '#fbbf24' : '#f87171'};">${successRate}%</div>
                    </div>
                    <div>
                        <div style="color: var(--text-muted); font-size: 12px; margin-bottom: 4px;">Total Time</div>
                        <div style="font-size: 18px; font-weight: 600; color: var(--text-primary);">${formatTime(elapsed)}</div>
                    </div>
                    <div>
                        <div style="color: var(--text-muted); font-size: 12px; margin-bottom: 4px;">Jobs Impact</div>
                        <div style="font-size: 14px; color: var(--text-primary);">
                            <span style="color: #60a5fa;">+${status.jobs_added} new</span> ·
                            <span style="color: #fbbf24;">~${status.jobs_updated} updated</span> ·
                            <span style="color: #a78bfa;">-${status.jobs_deactivated || 0} removed</span>
                        </div>
                    </div>
                </div>
            `;

            summaryDiv.style.display = 'block';
            batchStartTime = null;
        }

        async function triggerWebhook() {
            try {
                const response = await fetch('https://cariara-backend-production.up.railway.app/api/scrapers/webhook/trigger?secret=cariara-scrape-2024', { method: 'POST' });
                const data = await response.json();
                if (response.ok) showAlert(`Scrapers triggered! Task ID: ${data.task_id}`, 'success');
                else showAlert('Failed to trigger scrapers: ' + (data.detail || 'Unknown error'), 'error');
            } catch (error) {
                showAlert('Failed to trigger scrapers: ' + error.message, 'error');
            }
        }

        function clearLogs() {
            document.getElementById('log-viewer').innerHTML = '';
            logSince = 0;
            logCount = 0;
            document.getElementById('log-count').textContent = '0 entries';
        }

    </script>
</body>
</html>
