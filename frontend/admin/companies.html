<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cariara - Companies</title>
    <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Cariara</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="jobs.html">Jobs</a></li>
                    <li><a href="companies.html" class="active">Companies</a></li>
                    <li><a href="analytics.html">Analytics</a></li>
                    <li><a href="settings.html">Settings</a></li>
                </ul>
                <div class="theme-toggle">
                    <button id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h2>Companies</h2>
            <button class="btn btn-primary" onclick="openModal()">Add New Company</button>
        </div>

        <div class="filter-bar">
            <input type="text" id="search-input" placeholder="Search companies...">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Company Name</th>
                        <th>Industry</th>
                        <th>Size</th>
                        <th>Location</th>
                        <th>Jobs</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="companies-table-body">
                    <tr>
                        <td colspan="6" class="loading">Loading companies...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div class="modal-overlay" id="company-modal">
        <div class="modal">
            <h3 id="modal-title">Add Company</h3>
            <form id="company-form">
                <input type="hidden" id="company-id">
                <div class="form-group">
                    <label for="name">Company Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="website">Website</label>
                    <input type="url" id="website" name="website" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label for="industry">Industry</label>
                    <input type="text" id="industry" name="industry" placeholder="e.g., Technology, Healthcare">
                </div>
                <div class="form-group">
                    <label for="size">Company Size</label>
                    <select id="size" name="size">
                        <option value="">Select size</option>
                        <option value="startup">Startup (1-50)</option>
                        <option value="small">Small (51-200)</option>
                        <option value="medium">Medium (201-1000)</option>
                        <option value="large">Large (1001-5000)</option>
                        <option value="enterprise">Enterprise (5000+)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="location">Headquarters Location</label>
                    <input type="text" id="location" name="location">
                </div>
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        // Require authentication
        requireAuth();

        // Check admin role - redirect non-admin users to user portal
        (async function checkAdminAccess() {
            try {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                if (user.role !== 'admin') {
                    window.location.href = '../jobs/discover.html';
                    return;
                }
            } catch (e) {
                console.error('Error checking admin access:', e);
            }
        })();

        let allCompanies = [];

        async function loadCompanies() {
            try {
                allCompanies = await apiRequest('/companies');
                renderCompanies(allCompanies);
            } catch (error) {
                console.error('Failed to load companies:', error);
                document.getElementById('companies-table-body').innerHTML = '<tr><td colspan="6" class="alert alert-error">Failed to load companies</td></tr>';
            }
        }

        function renderCompanies(companies) {
            const tbody = document.getElementById('companies-table-body');

            if (companies.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No companies found</td></tr>';
                return;
            }

            let html = '';
            companies.forEach(company => {
                html += `
                    <tr>
                        <td>
                            ${company.name}
                            ${company.website ? `<br><small><a href="${company.website}" target="_blank">${company.website}</a></small>` : ''}
                        </td>
                        <td>${company.industry || '-'}</td>
                        <td style="text-transform: capitalize;">${company.size || '-'}</td>
                        <td>${company.location || '-'}</td>
                        <td>${company.job_count}</td>
                        <td>
                            <button class="btn btn-secondary btn-small" onclick="editCompany(${company.id})">Edit</button>
                            <button class="btn btn-danger btn-small" onclick="deleteCompany(${company.id})">Delete</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function filterCompanies() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const filtered = allCompanies.filter(company =>
                company.name.toLowerCase().includes(searchQuery) ||
                (company.industry && company.industry.toLowerCase().includes(searchQuery))
            );
            renderCompanies(filtered);
        }

        function openModal() {
            document.getElementById('modal-title').textContent = 'Add Company';
            document.getElementById('company-form').reset();
            document.getElementById('company-id').value = '';
            document.getElementById('company-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('company-modal').classList.remove('active');
        }

        async function editCompany(id) {
            try {
                const company = await apiRequest(`/companies/${id}`);
                document.getElementById('modal-title').textContent = 'Edit Company';
                document.getElementById('company-id').value = company.id;
                document.getElementById('name').value = company.name || '';
                document.getElementById('website').value = company.website || '';
                document.getElementById('industry').value = company.industry || '';
                document.getElementById('size').value = company.size || '';
                document.getElementById('location').value = company.location || '';
                document.getElementById('notes').value = company.notes || '';
                document.getElementById('company-modal').classList.add('active');
            } catch (error) {
                showAlert('Failed to load company: ' + error.message, 'error');
            }
        }

        async function deleteCompany(id) {
            if (!confirm('Are you sure you want to delete this company? This will not delete associated jobs.')) return;

            try {
                await apiRequest(`/companies/${id}`, 'DELETE');
                showAlert('Company deleted successfully');
                loadCompanies();
            } catch (error) {
                showAlert('Failed to delete company: ' + error.message, 'error');
            }
        }

        document.getElementById('company-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const companyId = document.getElementById('company-id').value;
            const formData = {
                name: document.getElementById('name').value,
                website: document.getElementById('website').value || null,
                industry: document.getElementById('industry').value || null,
                size: document.getElementById('size').value || null,
                location: document.getElementById('location').value || null,
                notes: document.getElementById('notes').value || null
            };

            try {
                if (companyId) {
                    await apiRequest(`/companies/${companyId}`, 'PUT', formData);
                    showAlert('Company updated successfully');
                } else {
                    await apiRequest('/companies', 'POST', formData);
                    showAlert('Company created successfully');
                }
                closeModal();
                loadCompanies();
            } catch (error) {
                showAlert('Failed to save company: ' + error.message, 'error');
            }
        });

        document.getElementById('search-input').addEventListener('input', filterCompanies);

        loadCompanies();
    </script>
</body>
</html>
