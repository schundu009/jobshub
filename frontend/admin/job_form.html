<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cariara - Add/Edit Job</title>
    <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Cariara</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="jobs.html" class="active">Jobs</a></li>
                    <li><a href="companies.html">Companies</a></li>
                    <li><a href="analytics.html">Analytics</a></li>
                    <li><a href="settings.html">Settings</a></li>
                </ul>
                <div class="theme-toggle">
                    <button id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h2 id="page-title">Add New Job</h2>
        </div>

        <div class="form-container">
            <form id="job-form">
                <div class="form-group">
                    <label for="title">Job Title *</label>
                    <input type="text" id="title" name="title" required>
                </div>

                <div class="form-group">
                    <label for="company_id">Company</label>
                    <select id="company_id" name="company_id">
                        <option value="">Select a company</option>
                    </select>
                    <small style="color: #7f8c8d; margin-top: 5px; display: block;">
                        <a href="companies.html">Add a new company</a> if not listed
                    </small>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location" placeholder="e.g., Remote, New York, NY">
                    </div>
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="wishlist">Wishlist</option>
                            <option value="applied">Applied</option>
                            <option value="interviewing">Interviewing</option>
                            <option value="offer">Offer</option>
                            <option value="rejected">Rejected</option>
                            <option value="withdrawn">Withdrawn</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="salary_min">Salary Min ($)</label>
                        <input type="number" id="salary_min" name="salary_min" placeholder="e.g., 80000">
                    </div>
                    <div class="form-group">
                        <label for="salary_max">Salary Max ($)</label>
                        <input type="number" id="salary_max" name="salary_max" placeholder="e.g., 120000">
                    </div>
                </div>

                <div class="form-group">
                    <label for="job_url">Job Posting URL</label>
                    <input type="url" id="job_url" name="job_url" placeholder="https://...">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="date_found">Date Found</label>
                        <input type="date" id="date_found" name="date_found">
                    </div>
                    <div class="form-group">
                        <label for="date_applied">Date Applied</label>
                        <input type="date" id="date_applied" name="date_applied">
                    </div>
                </div>

                <div class="form-group">
                    <label>Excitement Level</label>
                    <div class="excitement-rating">
                        <label><input type="radio" name="excitement_level" value="1"> 1</label>
                        <label><input type="radio" name="excitement_level" value="2"> 2</label>
                        <label><input type="radio" name="excitement_level" value="3" checked> 3</label>
                        <label><input type="radio" name="excitement_level" value="4"> 4</label>
                        <label><input type="radio" name="excitement_level" value="5"> 5</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="job_description">Job Description</label>
                    <textarea id="job_description" name="job_description" rows="8" placeholder="Paste the job description here..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Job</button>
                    <a href="jobs.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script>
        // Require authentication
        requireAuth();

        const jobId = getUrlParam('id');
        const isEdit = !!jobId;

        async function initForm() {
            await loadCompanyOptions('company_id');

            if (isEdit) {
                document.getElementById('page-title').textContent = 'Edit Job';
                try {
                    const job = await apiRequest(`/jobs/${jobId}`);
                    document.getElementById('title').value = job.title || '';
                    document.getElementById('company_id').value = job.company_id || '';
                    document.getElementById('location').value = job.location || '';
                    document.getElementById('status').value = job.status || 'wishlist';
                    document.getElementById('salary_min').value = job.salary_min || '';
                    document.getElementById('salary_max').value = job.salary_max || '';
                    document.getElementById('job_url').value = job.job_url || '';
                    document.getElementById('date_found').value = job.date_found || '';
                    document.getElementById('date_applied').value = job.date_applied || '';
                    document.getElementById('job_description').value = job.job_description || '';

                    const excitementRadio = document.querySelector(`input[name="excitement_level"][value="${job.excitement_level || 3}"]`);
                    if (excitementRadio) excitementRadio.checked = true;
                } catch (error) {
                    showAlert('Failed to load job: ' + error.message, 'error');
                }
            } else {
                document.getElementById('date_found').value = new Date().toISOString().split('T')[0];
            }
        }

        document.getElementById('job-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                title: document.getElementById('title').value,
                company_id: document.getElementById('company_id').value ? parseInt(document.getElementById('company_id').value) : null,
                location: document.getElementById('location').value || null,
                status: document.getElementById('status').value,
                salary_min: document.getElementById('salary_min').value ? parseInt(document.getElementById('salary_min').value) : null,
                salary_max: document.getElementById('salary_max').value ? parseInt(document.getElementById('salary_max').value) : null,
                job_url: document.getElementById('job_url').value || null,
                date_found: document.getElementById('date_found').value || null,
                date_applied: document.getElementById('date_applied').value || null,
                job_description: document.getElementById('job_description').value || null,
                excitement_level: parseInt(document.querySelector('input[name="excitement_level"]:checked').value)
            };

            try {
                if (isEdit) {
                    await apiRequest(`/jobs/${jobId}`, 'PUT', formData);
                    showAlert('Job updated successfully');
                } else {
                    const result = await apiRequest('/jobs', 'POST', formData);
                    window.location.href = `job_detail.html?id=${result.id}`;
                    return;
                }
                window.location.href = 'jobs.html';
            } catch (error) {
                showAlert('Failed to save job: ' + error.message, 'error');
            }
        });

        initForm();
    </script>
</body>
</html>
