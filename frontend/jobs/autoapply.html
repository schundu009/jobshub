<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoApply - AI-Powered Job Applications</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <style>
        .autoapply-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
            background: var(--bg-primary);
        }

        .autoapply-header {
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .autoapply-header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .iframe-container {
            flex: 1;
            position: relative;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .connection-error {
            text-align: center;
            color: var(--text-secondary);
        }

        .connection-error h3 {
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .connection-error p {
            margin-bottom: 16px;
        }

        .btn-retry {
            padding: 10px 20px;
            background: var(--accent-purple);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="autoapply-container">
            <div class="autoapply-header">
                <h1>AutoApply</h1>
                <div class="header-actions">
                    <a href="discover.html" class="btn btn-secondary" style="padding: 10px 16px; text-decoration: none; border-radius: 8px; background: var(--bg-tertiary); color: var(--text-primary);">
                        Back to Jobs
                    </a>
                </div>
            </div>

            <div class="iframe-container">
                <div class="loading-overlay" id="loading">
                    <div class="spinner"></div>
                    <p style="color: var(--text-secondary);">Loading AutoApply...</p>
                </div>
                <iframe id="autoapply-frame" src="about:blank"></iframe>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/jobs-sidebar.js"></script>
    <script>
        // Production URL for Railway deployment
        const AUTOAPPLY_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:5001'
            : 'https://cariara-autoapply.up.railway.app';

        document.addEventListener('DOMContentLoaded', async function() {
            // Initialize sidebar
            if (typeof initJobsSidebar === 'function') {
                initJobsSidebar('autoapply');
            }

            // Check for URL parameter
            const params = new URLSearchParams(window.location.search);
            const jobUrl = params.get('url');

            // Load the autoapply app
            await loadAutoapply(jobUrl);
        });

        async function loadAutoapply(jobUrl) {
            const loading = document.getElementById('loading');
            const frame = document.getElementById('autoapply-frame');

            try {
                // Try to load the autoapply service
                if (jobUrl) {
                    frame.src = `${AUTOAPPLY_URL}/?url=${encodeURIComponent(jobUrl)}`;
                } else {
                    frame.src = AUTOAPPLY_URL;
                }

                frame.onload = () => {
                    loading.classList.add('hidden');
                };

                // Fallback timeout
                setTimeout(() => {
                    loading.classList.add('hidden');
                }, 5000);

            } catch (err) {
                showError();
            }
        }

        function showError() {
            const loading = document.getElementById('loading');
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            loading.innerHTML = `
                <div class="connection-error">
                    <h3>AutoApply Not Available</h3>
                    <p>${isLocal ? 'The AutoApply service needs to be started locally.' : 'The AutoApply service is currently unavailable.'}</p>
                    ${isLocal ? '<code style="display:block;background:var(--bg-secondary);padding:12px;border-radius:6px;margin:12px 0;">cd ~/autoapply && python app.py</code>' : '<p>Please try again in a few moments.</p>'}
                    <button class="btn-retry" onclick="location.reload()">Retry</button>
                </div>
            `;
        }
    </script>
</body>
</html>
