<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cariara - Documents</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../css/theme.css">
    <!-- Shared Sidebar Styles -->
    <link rel="stylesheet" href="../css/sidebar.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            font-size: 13px;
        }
        .sidebar {
            width: 220px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 100;
        }
        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-header .logo { height: 24px; width: auto; }
        .sidebar-header .brand-name { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .sidebar-nav { flex: 1; padding: 8px; overflow-y: auto; }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 2px;
            font-size: 13px;
            font-weight: 500;
        }
        .sidebar-nav a:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sidebar-nav a.active { background: var(--bg-tertiary); color: var(--text-primary); }
        .sidebar-nav a svg { width: 16px; height: 16px; flex-shrink: 0; transition: transform 0.2s; }
        .sidebar-nav a:hover svg { transform: scale(1.1); }
        .nav-section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 12px 6px;
            margin-top: 8px;
        }
        .nav-section-title:first-child { margin-top: 0; padding-top: 4px; }
        .sidebar-submenu { padding: 2px 0 4px 24px; }
        .sidebar-submenu a { padding: 6px 10px; font-size: 12px; }
        .sidebar-submenu a.active { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
        .sidebar-submenu a svg { width: 14px; height: 14px; }
        .sidebar-user { padding: 12px; border-top: 1px solid var(--border-color); }
        .sidebar-user-info { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .sidebar-user-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 600; font-size: 11px;
        }
        .sidebar-user-name { font-weight: 500; color: var(--text-primary); font-size: 12px; }
        .sidebar-user-email { font-size: 11px; color: var(--text-muted); }
        .sidebar-logout-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; padding: 6px; background: transparent;
            border: 1px solid var(--border-color); border-radius: 6px;
            color: var(--text-secondary); font-size: 11px; cursor: pointer;
        }
        .sidebar-logout-btn:hover { background: var(--bg-hover); }
        .sidebar-logout-btn svg { width: 12px; height: 12px; }
        .sidebar-login-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; padding: 8px;
            background: var(--accent-blue);
            border: none; border-radius: 6px; color: white;
            font-size: 12px; font-weight: 500; text-decoration: none;
        }

        .main-content {
            flex: 1;
            margin-left: 220px;
            padding: 16px 24px;
            max-width: 600px;
        }
        .page-header {
            margin-bottom: 16px;
        }
        .page-header h1 { font-size: 18px; font-weight: 600; }

        .section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .file-upload-area {
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            background: var(--bg-tertiary);
            position: relative;
        }
        .file-upload-area:hover {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.05);
        }
        .file-upload-area svg { width: 20px; height: 20px; color: var(--accent-blue); margin-bottom: 4px; }
        .file-upload-area p { color: var(--text-secondary); font-size: 12px; margin: 0; }
        .file-upload-area small { color: var(--text-muted); font-size: 10px; }
        .file-upload-area input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        .documents-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }
        .document-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        .document-item:hover { border-color: var(--accent-blue); }
        .document-item .doc-icon {
            width: 28px; height: 28px; border-radius: 6px;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .document-item .doc-icon svg { width: 14px; height: 14px; color: white; }
        .document-item .doc-info { flex: 1; min-width: 0; }
        .document-item .doc-name {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .document-item .doc-meta { color: var(--text-muted); font-size: 10px; }
        .document-item .doc-badge {
            padding: 2px 6px;
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            font-size: 9px;
            font-weight: 600;
            border-radius: 3px;
            text-transform: uppercase;
        }
        .document-item .doc-actions { display: flex; gap: 4px; }
        .document-item .doc-actions button {
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
        }
        .document-item .doc-actions button:hover { background: var(--bg-hover); color: var(--text-primary); }
        .document-item .doc-actions button.delete { color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }
        .document-item .doc-actions button.delete:hover { background: rgba(239, 68, 68, 0.1); }
        .document-item .doc-actions button.primary { color: var(--accent-blue); border-color: rgba(59, 130, 246, 0.3); }
        .document-item .doc-actions button.primary:hover { background: rgba(59, 130, 246, 0.1); }

        .empty-state {
            text-align: center;
            padding: 16px;
            color: var(--text-muted);
            font-size: 12px;
        }
        .empty-state svg { width: 24px; height: 24px; margin-bottom: 4px; opacity: 0.5; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.2s ease;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: #22c55e; color: white; }
        .toast.error { background: #ef4444; color: white; }

        /* Top Right Controls */
        .top-right-controls {
            position: fixed;
            top: 16px;
            right: 24px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }
        .theme-toggle:hover { background: var(--bg-hover); color: var(--text-primary); }
        .theme-toggle svg { width: 18px; height: 18px; }
        .signout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .signout-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .signout-btn svg { width: 16px; height: 16px; }

        /* Mobile Hamburger Menu */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 250;
            width: 44px;
            height: 44px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .mobile-menu-btn:hover { background: var(--bg-hover); }
        .mobile-menu-btn svg { width: 22px; height: 22px; }
        .mobile-menu-btn .menu-close { display: none; }
        .mobile-menu-btn.active .menu-open { display: none; }
        .mobile-menu-btn.active .menu-close { display: block; }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 150;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .sidebar-backdrop.active { opacity: 1; }

        @media (max-width: 768px) {
            .mobile-menu-btn { display: flex; }
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                width: 280px;
                max-width: 85vw;
            }
            .sidebar.mobile-open { transform: translateX(0); }
            .sidebar-backdrop { display: block; }
            .main-content {
                margin-left: 0;
                padding: 16px;
                padding-top: 72px;
            }
            .sidebar-nav a {
                padding: 14px 16px;
                min-height: 48px;
            }
            .top-right-controls { top: 16px; right: 16px; gap: 8px; }
            .theme-toggle, .signout-btn {
                width: 44px; height: 44px; padding: 0; justify-content: center;
            }
            .signout-btn span { display: none; }
            .page-header h1 { font-size: 20px; }
            .document-actions { flex-direction: column; gap: 8px; }
            .btn { min-height: 44px; }
        }

        @media (max-width: 480px) {
            .mobile-menu-btn { top: 12px; left: 12px; width: 40px; height: 40px; }
            .main-content { padding: 12px; padding-top: 68px; }
            .top-right-controls { top: 12px; right: 12px; }
            .theme-toggle, .signout-btn { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>
    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu" onclick="toggleMobileSidebar()">
        <svg class="menu-open" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <svg class="menu-close" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeMobileSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="../images/logo-full.svg" alt="Cariara" class="logo" style="height:40px;width:auto;">
        </div>
        <nav class="sidebar-nav">
            <!-- APPLICATION Section -->
            <div class="nav-section-title">Application</div>
            <a href="discover.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>Search</a>

            <!-- OTHER Section -->
            <div class="nav-section-title">Other</div>
            <a href="auto-apply.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>Auto Apply</a>
            <a href="documents.html" class="active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>Resumes</a>
            <a href="settings.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><circle cx="12" cy="12" r="3"></circle></svg>Settings</a>
        </nav>
        <div class="sidebar-user" id="user-menu"></div>
    </aside>

    <!-- Top Right Controls -->
    <div class="top-right-controls">
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
            <svg id="theme-icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display:none;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg id="theme-icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        <button class="signout-btn" onclick="logout()">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Sign Out
        </button>
    </div>

    <main class="main-content">
        <div class="page-header">
            <h1>Documents</h1>
        </div>

        <div id="toast" class="toast"></div>

        <div class="section">
            <div class="section-title">Resumes</div>
            <div class="file-upload-area" id="resume-upload-area">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <p>Drop or click to upload</p>
                <small>PDF, DOC, DOCX (Max 5MB)</small>
                <input type="file" id="resume-input" accept=".pdf,.doc,.docx,.txt,.rtf">
            </div>
            <div class="documents-list" id="resumes-list">
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <p>No resumes</p>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Cover Letters</div>
            <div class="file-upload-area" id="cover-letter-upload-area">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <p>Drop or click to upload</p>
                <small>PDF, DOC, DOCX (Max 5MB)</small>
                <input type="file" id="cover-letter-input" accept=".pdf,.doc,.docx,.txt,.rtf">
            </div>
            <div class="documents-list" id="cover-letters-list">
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    <p>No cover letters</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = window.location.hostname === 'cariara.com' || window.location.hostname === 'www.cariara.com'
            ? 'https://cariara-production.up.railway.app' : 'http://localhost:8000';

        function setTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('jobtrails-theme', t);
            updateThemeIcons(t);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            setTheme(current === 'dark' ? 'light' : 'dark');
        }

        function updateThemeIcons(theme) {
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');
            if (sunIcon && moonIcon) {
                if (theme === 'light') {
                    sunIcon.style.display = 'none';
                    moonIcon.style.display = 'block';
                } else {
                    sunIcon.style.display = 'block';
                    moonIcon.style.display = 'none';
                }
            }
        }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        setTheme(localStorage.getItem('jobtrails-theme') || 'dark');

        // Mobile sidebar functions
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            const btn = document.getElementById('mobile-menu-btn');
            if (sidebar.classList.contains('mobile-open')) {
                closeMobileSidebar();
            } else {
                sidebar.classList.add('mobile-open');
                backdrop.classList.add('active');
                btn.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        }
        function closeMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            const btn = document.getElementById('mobile-menu-btn');
            sidebar.classList.remove('mobile-open');
            backdrop.classList.remove('active');
            btn.classList.remove('active');
            document.body.style.overflow = '';
        }
        window.addEventListener('resize', () => window.innerWidth > 768 && closeMobileSidebar());

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            if (!token) { handleLogout(); return null; }
            return token;
        }

        async function refreshAccessToken() {
            const rt = localStorage.getItem('refresh_token');
            if (!rt) { handleLogout(); return null; }
            try {
                const r = await fetch(`${API_BASE}/auth/refresh`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: rt })
                });
                if (r.ok) {
                    const d = await r.json();
                    localStorage.setItem('access_token', d.access_token);
                    localStorage.setItem('refresh_token', d.refresh_token);
                    if (d.user) localStorage.setItem('user', JSON.stringify(d.user));
                    return d.access_token;
                }
                handleLogout();
                return null;
            } catch (e) {
                handleLogout();
                return null;
            }
        }

        async function authFetch(url, opts = {}) {
            let token = localStorage.getItem('access_token');
            if (!token) { handleLogout(); return null; }
            opts.headers = { ...opts.headers, 'Authorization': `Bearer ${token}` };
            try {
                let r = await fetch(url, opts);
                if (r.status === 401) {
                    token = await refreshAccessToken();
                    if (token) {
                        opts.headers['Authorization'] = `Bearer ${token}`;
                        r = await fetch(url, opts);
                    } else return null;
                }
                return r;
            } catch (e) { return null; }
        }

        function initUserMenu() {
            const um = document.getElementById('user-menu');
            const uj = localStorage.getItem('user');
            if (uj) {
                try {
                    const u = JSON.parse(uj);
                    const n = u.name || u.email?.split('@')[0] || 'User';
                    const i = n.split(' ').map(x => x[0]).join('').toUpperCase().slice(0, 2);
                    um.innerHTML = `
                        <div class="sidebar-user-info">
                            <div class="sidebar-user-avatar">${i}</div>
                            <div>
                                <div class="sidebar-user-name">${n}</div>
                                <div class="sidebar-user-email">${u.email || ''}</div>
                            </div>
                        </div>
                        <button class="sidebar-logout-btn" onclick="handleLogout()">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            Sign Out
                        </button>`;
                } catch (e) {}
            }
        }

        function handleLogout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        function toast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${type} show`;
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function setupFileUpload(inputId, areaId, listId, docType) {
            const input = document.getElementById(inputId);
            const area = document.getElementById(areaId);
            area.addEventListener('dragover', (e) => {
                e.preventDefault();
                area.style.borderColor = 'var(--accent-blue)';
            });
            area.addEventListener('dragleave', () => { area.style.borderColor = ''; });
            area.addEventListener('drop', (e) => {
                e.preventDefault();
                area.style.borderColor = '';
                if (e.dataTransfer.files.length > 0) uploadDocument(e.dataTransfer.files[0], docType, listId);
            });
            input.addEventListener('change', () => {
                if (input.files.length > 0) {
                    uploadDocument(input.files[0], docType, listId);
                    input.value = '';
                }
            });
        }

        async function uploadDocument(file, docType, listId) {
            if (!checkAuth()) return;
            if (file.size > 5 * 1024 * 1024) { toast('File too large (max 5MB)', 'error'); return; }
            const formData = new FormData();
            formData.append('file', file);
            try {
                const r = await authFetch(`${API_BASE}/api/users/documents?document_type=${docType}`, {
                    method: 'POST',
                    body: formData
                });
                if (!r) return;
                if (r.ok) {
                    toast('Uploaded');
                    loadDocuments(docType, listId);
                } else {
                    const e = await r.json();
                    toast(e.detail || 'Upload failed', 'error');
                }
            } catch (e) { toast('Upload error', 'error'); }
        }

        async function loadDocuments(docType, listId) {
            if (!checkAuth()) return;
            try {
                const r = await authFetch(`${API_BASE}/api/users/documents?type=${docType}`);
                if (!r) return;
                if (r.ok) renderDocuments(await r.json(), listId, docType);
            } catch (e) {}
        }

        function renderDocuments(docs, listId, docType) {
            const list = document.getElementById(listId);
            if (!docs || docs.length === 0) {
                const icon = docType === 'resume'
                    ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>'
                    : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>';
                list.innerHTML = `<div class="empty-state"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24">${icon}</svg><p>No ${docType === 'resume' ? 'resumes' : 'cover letters'}</p></div>`;
                return;
            }
            list.innerHTML = docs.map(doc => `
                <div class="document-item">
                    <div class="doc-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div>
                    <div class="doc-info">
                        <div class="doc-name">${doc.filename}</div>
                        <div class="doc-meta">${formatDate(doc.created_at)} &middot; ${formatFileSize(doc.file_size)}</div>
                    </div>
                    ${doc.is_default ? '<span class="doc-badge">Default</span>' : ''}
                    <div class="doc-actions">
                        ${!doc.is_default ? `<button onclick="setDefaultDocument(${doc.id}, '${docType}', '${listId}')" class="primary">Default</button>` : ''}
                        <button onclick="deleteDocument(${doc.id}, '${docType}', '${listId}')" class="delete">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function setDefaultDocument(docId, docType, listId) {
            if (!checkAuth()) return;
            try {
                const r = await authFetch(`${API_BASE}/api/users/documents/${docId}/default`, { method: 'PUT' });
                if (!r) return;
                if (r.ok) { toast('Default updated'); loadDocuments(docType, listId); }
            } catch (e) { toast('Error', 'error'); }
        }

        async function deleteDocument(docId, docType, listId) {
            if (!confirm('Delete this document?')) return;
            if (!checkAuth()) return;
            try {
                const r = await authFetch(`${API_BASE}/api/users/documents/${docId}`, { method: 'DELETE' });
                if (!r) return;
                if (r.ok) { toast('Deleted'); loadDocuments(docType, listId); }
            } catch (e) { toast('Error', 'error'); }
        }

        function formatDate(d) {
            if (!d) return '';
            return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function formatFileSize(b) {
            if (!b) return '';
            if (b < 1024) return b + ' B';
            if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
            return (b / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // Mobile menu functions
        function setupMobileMenu() {
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');

            function closeMobileMenu() {
                sidebar.classList.remove('mobile-open');
                backdrop.classList.remove('active');
                mobileMenuBtn.classList.remove('active');
                document.body.style.overflow = '';
            }

            function openMobileMenu() {
                sidebar.classList.add('mobile-open');
                backdrop.classList.add('active');
                mobileMenuBtn.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            if (mobileMenuBtn) {
                mobileMenuBtn.addEventListener('click', () => {
                    sidebar.classList.contains('mobile-open') ? closeMobileMenu() : openMobileMenu();
                });
            }
            if (backdrop) backdrop.addEventListener('click', closeMobileMenu);
            document.querySelectorAll('.sidebar-nav a').forEach(link => {
                link.addEventListener('click', () => window.innerWidth <= 768 && closeMobileMenu());
            });
            window.addEventListener('resize', () => window.innerWidth > 768 && closeMobileMenu());
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupMobileMenu();
            initUserMenu();
            setupFileUpload('resume-input', 'resume-upload-area', 'resumes-list', 'resume');
            setupFileUpload('cover-letter-input', 'cover-letter-upload-area', 'cover-letters-list', 'cover_letter');
            loadDocuments('resume', 'resumes-list');
            loadDocuments('cover_letter', 'cover-letters-list');
        });
    </script>

    <!-- Shared Sidebar JavaScript -->
    <script src="../js/sidebar.js"></script>
</body>
</html>
