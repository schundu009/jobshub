<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cariara - Contacts</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/jobs-layout.css">
    <style>
        .contact-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .contact-card:hover {
            border-color: var(--border-light);
        }
        .contact-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .contact-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            margin-right: 12px;
        }
        .contact-info {
            flex: 1;
        }
        .contact-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 15px;
        }
        .contact-role {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .contact-company {
            font-size: 12px;
            color: var(--text-muted);
        }
        .contact-details {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .contact-details a {
            color: var(--accent-primary);
            text-decoration: none;
        }
        .contact-details a:hover {
            text-decoration: underline;
        }
        .relationship-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: capitalize;
        }
        .relationship-strong { background: #dcfce7; color: #166534; }
        .relationship-good { background: #dbeafe; color: #1e40af; }
        .relationship-neutral { background: #f3f4f6; color: #4b5563; }
        .relationship-weak { background: #fef3c7; color: #92400e; }
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-bar input, .filter-bar select {
            padding: 10px 14px;
            border: 1px solid var(--border-default);
            background: var(--bg-elevated);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 14px;
        }
        .filter-bar input {
            flex: 1;
            min-width: 200px;
        }
    </style>
</head>
<body>
    <main>
        <div class="jobs-page-header">
            <div>
                <h1 class="jobs-page-title">Contacts</h1>
                <p class="jobs-page-subtitle">Manage your professional network</p>
            </div>
            <button class="btn btn-primary" onclick="openModal()">Add Contact</button>
        </div>

        <div class="filter-bar">
            <input type="text" id="search-input" placeholder="Search contacts...">
            <select id="relationship-filter">
                <option value="">All Relationships</option>
                <option value="strong">Strong</option>
                <option value="good">Good</option>
                <option value="neutral">Neutral</option>
                <option value="weak">Weak</option>
            </select>
            <select id="company-filter">
                <option value="">All Companies</option>
            </select>
        </div>

        <div id="contacts-list">
            <div class="jobs-empty">
                <p>Loading contacts...</p>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="contact-modal">
        <div class="modal">
            <h3 id="modal-title">Add Contact</h3>
            <form id="contact-form">
                <input type="hidden" id="contact-id">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="company_id">Company</label>
                    <select id="company_id" name="company_id">
                        <option value="">Select company</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="role">Role / Title</label>
                    <input type="text" id="role" name="role">
                </div>
                <div class="form-group">
                    <label for="linkedin_url">LinkedIn URL</label>
                    <input type="url" id="linkedin_url" name="linkedin_url">
                </div>
                <div class="form-group">
                    <label for="relationship">Relationship Strength</label>
                    <select id="relationship" name="relationship">
                        <option value="neutral">Neutral</option>
                        <option value="weak">Weak</option>
                        <option value="good">Good</option>
                        <option value="strong">Strong</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/jobs-sidebar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initJobsLayout('contacts', 'Contacts');
        });

        let allContacts = [];
        let allCompanies = [];

        async function loadContacts() {
            try {
                allContacts = await apiRequest('/contacts');
                renderContacts(allContacts);
            } catch (error) {
                console.error('Failed to load contacts:', error);
                document.getElementById('contacts-list').innerHTML = '<div class="jobs-empty"><p>Failed to load contacts</p></div>';
            }
        }

        async function loadCompanies() {
            try {
                allCompanies = await apiRequest('/companies');
                populateCompanySelects();
            } catch (error) {
                console.error('Failed to load companies:', error);
            }
        }

        function populateCompanySelects() {
            const filterSelect = document.getElementById('company-filter');
            const formSelect = document.getElementById('company_id');

            filterSelect.innerHTML = '<option value="">All Companies</option>';
            formSelect.innerHTML = '<option value="">Select company</option>';

            allCompanies.forEach(company => {
                filterSelect.innerHTML += `<option value="${company.id}">${company.name}</option>`;
                formSelect.innerHTML += `<option value="${company.id}">${company.name}</option>`;
            });
        }

        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
        }

        function renderContacts(contacts) {
            const container = document.getElementById('contacts-list');

            if (contacts.length === 0) {
                container.innerHTML = '<div class="jobs-empty"><p>No contacts found</p></div>';
                return;
            }

            let html = '';
            contacts.forEach(contact => {
                const company = allCompanies.find(c => c.id === contact.company_id);
                const companyName = company ? company.name : '';

                html += `
                    <div class="contact-card">
                        <div class="contact-header">
                            <div style="display: flex; align-items: center;">
                                <div class="contact-avatar">${getInitials(contact.name)}</div>
                                <div class="contact-info">
                                    <div class="contact-name">${contact.name}</div>
                                    ${contact.role ? `<div class="contact-role">${contact.role}</div>` : ''}
                                    ${companyName ? `<div class="contact-company">${companyName}</div>` : ''}
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span class="relationship-badge relationship-${contact.relationship || 'neutral'}">${contact.relationship || 'neutral'}</span>
                                <button class="btn btn-secondary btn-small" onclick="editContact(${contact.id})">Edit</button>
                                <button class="btn btn-danger btn-small" onclick="deleteContact(${contact.id})">Delete</button>
                            </div>
                        </div>
                        <div class="contact-details">
                            ${contact.email ? `<span>📧 <a href="mailto:${contact.email}">${contact.email}</a></span>` : ''}
                            ${contact.phone ? `<span>📱 ${contact.phone}</span>` : ''}
                            ${contact.linkedin_url ? `<span>🔗 <a href="${contact.linkedin_url}" target="_blank">LinkedIn</a></span>` : ''}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function filterContacts() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const relationshipFilter = document.getElementById('relationship-filter').value;
            const companyFilter = document.getElementById('company-filter').value;

            const filtered = allContacts.filter(contact => {
                const matchesSearch = !searchQuery ||
                    contact.name.toLowerCase().includes(searchQuery) ||
                    (contact.email && contact.email.toLowerCase().includes(searchQuery)) ||
                    (contact.role && contact.role.toLowerCase().includes(searchQuery));
                const matchesRelationship = !relationshipFilter || contact.relationship === relationshipFilter;
                const matchesCompany = !companyFilter || contact.company_id === parseInt(companyFilter);

                return matchesSearch && matchesRelationship && matchesCompany;
            });

            renderContacts(filtered);
        }

        function openModal() {
            document.getElementById('modal-title').textContent = 'Add Contact';
            document.getElementById('contact-form').reset();
            document.getElementById('contact-id').value = '';
            document.getElementById('contact-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('contact-modal').classList.remove('active');
        }

        async function editContact(id) {
            try {
                const contact = await apiRequest(`/contacts/${id}`);
                document.getElementById('modal-title').textContent = 'Edit Contact';
                document.getElementById('contact-id').value = contact.id;
                document.getElementById('name').value = contact.name || '';
                document.getElementById('email').value = contact.email || '';
                document.getElementById('phone').value = contact.phone || '';
                document.getElementById('company_id').value = contact.company_id || '';
                document.getElementById('role').value = contact.role || '';
                document.getElementById('linkedin_url').value = contact.linkedin_url || '';
                document.getElementById('relationship').value = contact.relationship || 'neutral';
                document.getElementById('notes').value = contact.notes || '';
                document.getElementById('contact-modal').classList.add('active');
            } catch (error) {
                showAlert('Failed to load contact: ' + error.message, 'error');
            }
        }

        async function deleteContact(id) {
            if (!confirm('Are you sure you want to delete this contact?')) return;

            try {
                await apiRequest(`/contacts/${id}`, 'DELETE');
                showAlert('Contact deleted successfully');
                loadContacts();
            } catch (error) {
                showAlert('Failed to delete contact: ' + error.message, 'error');
            }
        }

        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const contactId = document.getElementById('contact-id').value;
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value || null,
                phone: document.getElementById('phone').value || null,
                company_id: document.getElementById('company_id').value ? parseInt(document.getElementById('company_id').value) : null,
                role: document.getElementById('role').value || null,
                linkedin_url: document.getElementById('linkedin_url').value || null,
                relationship: document.getElementById('relationship').value,
                notes: document.getElementById('notes').value || null
            };

            try {
                if (contactId) {
                    await apiRequest(`/contacts/${contactId}`, 'PUT', formData);
                    showAlert('Contact updated successfully');
                } else {
                    await apiRequest('/contacts', 'POST', formData);
                    showAlert('Contact created successfully');
                }
                closeModal();
                loadContacts();
            } catch (error) {
                showAlert('Failed to save contact: ' + error.message, 'error');
            }
        });

        document.getElementById('search-input').addEventListener('input', filterContacts);
        document.getElementById('relationship-filter').addEventListener('change', filterContacts);
        document.getElementById('company-filter').addEventListener('change', filterContacts);

        loadCompanies();
        loadContacts();
    </script>
</body>
</html>
