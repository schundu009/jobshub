<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cariara - Profile</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            font-size: 13px;
        }
        .sidebar {
            width: 200px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 100;
        }
        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-header .logo { height: 24px; width: auto; }
        .sidebar-header .brand-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .sidebar-nav { flex: 1; padding: 8px; overflow-y: auto; }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 2px;
            font-size: 13px;
            font-weight: 500;
        }
        .sidebar-nav a:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sidebar-nav a.active { background: var(--accent-blue); color: white; }
        .sidebar-nav a svg { width: 16px; height: 16px; flex-shrink: 0; }
        .sidebar-submenu { padding: 2px 0 4px 24px; }
        .sidebar-submenu a { padding: 6px 10px; font-size: 12px; }
        .sidebar-submenu a.active { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
        .sidebar-submenu a svg { width: 14px; height: 14px; }
        .sidebar-user { padding: 12px; border-top: 1px solid var(--border-color); }
        .sidebar-user-info { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .sidebar-user-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 600; font-size: 11px;
        }
        .sidebar-user-name { font-weight: 500; color: var(--text-primary); font-size: 12px; }
        .sidebar-user-email { font-size: 11px; color: var(--text-muted); }
        .sidebar-logout-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; padding: 6px; background: transparent;
            border: 1px solid var(--border-color); border-radius: 6px;
            color: var(--text-secondary); font-size: 11px; cursor: pointer;
        }
        .sidebar-logout-btn:hover { background: var(--bg-hover); }
        .sidebar-logout-btn svg { width: 12px; height: 12px; }
        .sidebar-login-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; padding: 8px;
            background: var(--accent-blue);
            border: none; border-radius: 6px; color: white;
            font-size: 12px; font-weight: 500; text-decoration: none;
        }

        .main-content {
            flex: 1;
            margin-left: 200px;
            padding: 16px 24px;
            max-width: 680px;
        }
        .page-header {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header h1 { font-size: 18px; font-weight: 600; }
        .save-indicator {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .save-indicator.saving { color: var(--accent-blue); }
        .save-indicator.saved { color: #22c55e; }
        .save-indicator.error { color: #ef4444; }
        .save-indicator svg { width: 12px; height: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .save-indicator.saving svg { animation: spin 1s linear infinite; }

        .section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .form-grid.two-col { grid-template-columns: repeat(2, 1fr); }
        .form-grid.four-col { grid-template-columns: repeat(4, 1fr); }
        .span-2 { grid-column: span 2; }
        .span-3 { grid-column: span 3; }

        .field label {
            display: block;
            margin-bottom: 3px;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 11px;
        }
        .field input, .field select, .field textarea {
            width: 100%;
            padding: 6px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 12px;
            font-family: inherit;
        }
        .field input:focus, .field select:focus, .field textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        .field input.saved, .field select.saved, .field textarea.saved {
            border-color: #22c55e;
        }
        .field textarea { min-height: 60px; resize: vertical; }
        .field input::placeholder { color: var(--text-muted); font-size: 11px; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.2s ease;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: #22c55e; color: white; }
        .toast.error { background: #ef4444; color: white; }

        .theme-switch-container { position: fixed; top: 12px; right: 16px; z-index: 200; }
        .theme-switch {
            display: flex;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2px;
        }
        .theme-switch button {
            display: flex; align-items: center; justify-content: center;
            padding: 4px 8px; background: transparent; border: none;
            border-radius: 4px; color: var(--text-muted); cursor: pointer;
        }
        .theme-switch button.active { background: var(--bg-primary); color: var(--text-primary); }
        .theme-switch button svg { width: 14px; height: 14px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 12px; max-width: 100%; }
            .form-grid, .form-grid.two-col, .form-grid.four-col { grid-template-columns: 1fr 1fr; }
            .span-2, .span-3 { grid-column: span 1; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="../images/toritchLogo.png" alt="Cariara" class="logo">
            <span class="brand-name">Cariara</span>
        </div>
        <nav class="sidebar-nav">
            <a href="discover.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>Jobs</a>
            <a href="settings.html" class="active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><circle cx="12" cy="12" r="3"></circle></svg>Settings</a>
        </nav>
        <div class="sidebar-user" id="user-menu">
            <a href="../admin/index.html" class="sidebar-login-btn" style="background: var(--bg-hover); border-color: var(--border-light);"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>Admin Portal</a>
        </div>
    </aside>

    <div class="theme-switch-container">
        <div class="theme-switch">
            <button id="theme-light-btn" onclick="setTheme('light')"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg></button>
            <button id="theme-dark-btn" onclick="setTheme('dark')"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg></button>
        </div>
    </div>

    <main class="main-content">
        <div class="page-header">
            <h1>Profile</h1>
            <div class="save-indicator" id="save-indicator">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                <span>Saved</span>
            </div>
        </div>

        <div id="toast" class="toast"></div>

        <div class="section">
            <div class="section-title">Personal</div>
            <div class="form-grid">
                <div class="field"><label>First Name</label><input type="text" name="first_name" placeholder="John"></div>
                <div class="field"><label>Last Name</label><input type="text" name="last_name" placeholder="Doe"></div>
                <div class="field"><label>Preferred</label><input type="text" name="preferred_name" placeholder="Johnny"></div>
                <div class="field"><label>Email</label><input type="email" name="email" placeholder="john@example.com"></div>
                <div class="field"><label>Phone</label><input type="tel" name="phone" placeholder="+1 555-123-4567"></div>
                <div class="field"><label>Country</label>
                    <select name="country">
                        <option value="">-</option>
                        <option value="US">United States</option>
                        <option value="CA">Canada</option>
                        <option value="UK">United Kingdom</option>
                        <option value="DE">Germany</option>
                        <option value="IN">India</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Address</div>
            <div class="form-grid">
                <div class="field span-2"><label>Street</label><input type="text" name="address_line1" placeholder="123 Main St"></div>
                <div class="field"><label>Apt/Suite</label><input type="text" name="address_line2" placeholder="4B"></div>
                <div class="field"><label>City</label><input type="text" name="city" placeholder="San Francisco"></div>
                <div class="field"><label>State</label><input type="text" name="state" placeholder="CA"></div>
                <div class="field"><label>ZIP</label><input type="text" name="postal_code" placeholder="94102"></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Work Authorization</div>
            <div class="form-grid two-col">
                <div class="field"><label>US Authorized</label>
                    <select name="us_authorized"><option value="">-</option><option value="yes">Yes</option><option value="no">No</option></select>
                </div>
                <div class="field"><label>Sponsorship Required</label>
                    <select name="requires_sponsorship"><option value="">-</option><option value="yes">Yes</option><option value="no">No</option></select>
                </div>
                <div class="field"><label>Relocate</label>
                    <select name="willing_to_relocate"><option value="">-</option><option value="yes">Yes</option><option value="no">No</option><option value="depends">Depends</option></select>
                </div>
                <div class="field"><label>Work Arrangement</label>
                    <select name="work_arrangement"><option value="">-</option><option value="remote">Remote</option><option value="hybrid">Hybrid</option><option value="onsite">On-site</option><option value="flexible">Flexible</option></select>
                </div>
                <div class="field"><label>Gov Employee</label>
                    <select name="us_government_employee"><option value="">-</option><option value="yes">Yes</option><option value="no">No</option></select>
                </div>
                <div class="field"><label>Non-compete</label>
                    <select name="non_compete"><option value="">-</option><option value="yes">Yes</option><option value="no">No</option></select>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Links</div>
            <div class="form-grid two-col">
                <div class="field"><label>LinkedIn</label><input type="url" name="linkedin_url" placeholder="linkedin.com/in/..."></div>
                <div class="field"><label>GitHub</label><input type="url" name="github_url" placeholder="github.com/..."></div>
                <div class="field"><label>Portfolio</label><input type="url" name="portfolio_url" placeholder="yoursite.com"></div>
                <div class="field"><label>Twitter</label><input type="url" name="twitter_url" placeholder="twitter.com/..."></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Professional</div>
            <div class="form-grid">
                <div class="field"><label>Referral Source</label>
                    <select name="referral_source"><option value="">-</option><option value="linkedin">LinkedIn</option><option value="indeed">Indeed</option><option value="glassdoor">Glassdoor</option><option value="friend">Referral</option><option value="recruiter">Recruiter</option><option value="other">Other</option></select>
                </div>
                <div class="field span-2"><label>Skills</label><input type="text" name="skills" placeholder="Python, JavaScript, React..."></div>
            </div>
            <div class="form-grid" style="margin-top: 10px;">
                <div class="field span-3"><label>Bio</label><textarea name="bio" rows="2" placeholder="Brief professional summary..."></textarea></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Demographics (Optional)</div>
            <div class="form-grid four-col">
                <div class="field"><label>Gender</label>
                    <select name="gender"><option value="">-</option><option value="male">Male</option><option value="female">Female</option><option value="non_binary">Non-binary</option><option value="other">Other</option><option value="decline">Decline</option></select>
                </div>
                <div class="field"><label>Ethnicity</label>
                    <select name="ethnicity"><option value="">-</option><option value="american_indian">American Indian</option><option value="asian">Asian</option><option value="black">Black</option><option value="hispanic">Hispanic</option><option value="pacific_islander">Pacific Islander</option><option value="white">White</option><option value="two_or_more">Two+</option><option value="decline">Decline</option></select>
                </div>
                <div class="field"><label>Veteran</label>
                    <select name="veteran_status"><option value="">-</option><option value="not_veteran">No</option><option value="veteran">Yes</option><option value="protected_veteran">Protected</option><option value="decline">Decline</option></select>
                </div>
                <div class="field"><label>Disability</label>
                    <select name="disability_status"><option value="">-</option><option value="no">No</option><option value="yes">Yes</option><option value="decline">Decline</option></select>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = window.location.hostname === 'cariara.com' || window.location.hostname === 'www.cariara.com'
            ? 'https://cariara-production.up.railway.app' : 'http://localhost:8000';

        let originalValues = {};

        function setTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('jobtrails-theme', t);
            document.getElementById('theme-light-btn').classList.toggle('active', t === 'light');
            document.getElementById('theme-dark-btn').classList.toggle('active', t === 'dark');
        }
        setTheme(localStorage.getItem('jobtrails-theme') || 'dark');

        function getToken() { return localStorage.getItem('access_token'); }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        async function refreshToken() {
            const rt = localStorage.getItem('refresh_token');
            if (!rt) { logout(); return null; }
            try {
                const r = await fetch(`${API_BASE}/auth/refresh`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: rt })
                });
                if (r.ok) {
                    const d = await r.json();
                    localStorage.setItem('access_token', d.access_token);
                    localStorage.setItem('refresh_token', d.refresh_token);
                    if (d.user) localStorage.setItem('user', JSON.stringify(d.user));
                    return d.access_token;
                }
                logout();
                return null;
            } catch (e) {
                logout();
                return null;
            }
        }

        async function authFetch(url, opts = {}) {
            let token = getToken();
            if (!token) { logout(); return null; }
            opts.headers = { ...opts.headers, 'Authorization': `Bearer ${token}` };
            try {
                let r = await fetch(url, opts);
                if (r.status === 401) {
                    token = await refreshToken();
                    if (token) {
                        opts.headers['Authorization'] = `Bearer ${token}`;
                        r = await fetch(url, opts);
                        if (r.status === 401) { logout(); return null; }
                    } else return null;
                }
                return r;
            } catch (e) { return null; }
        }

        function handleLogout() { logout(); }

        function initUserMenu() {
            const um = document.getElementById('user-menu');
            const uj = localStorage.getItem('user');
            if (uj) {
                try {
                    const u = JSON.parse(uj);
                    const n = u.name || u.email?.split('@')[0] || 'User';
                    const i = n.split(' ').map(x => x[0]).join('').toUpperCase().slice(0, 2);
                    um.innerHTML = `
                        <div class="sidebar-user-info">
                            <div class="sidebar-user-avatar">${i}</div>
                            <div>
                                <div class="sidebar-user-name">${n}</div>
                                <div class="sidebar-user-email">${u.email || ''}</div>
                            </div>
                        </div>
                        <button class="sidebar-logout-btn" onclick="handleLogout()">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            Sign Out
                        </button>`;
                } catch (e) {}
            }
        }

        function toast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${type} show`;
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function setSaveStatus(status) {
            const ind = document.getElementById('save-indicator');
            ind.className = 'save-indicator ' + status;
            const icons = {
                saving: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2" stroke-dasharray="30" stroke-dashoffset="10"></circle></svg>',
                saved: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>',
                error: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>'
            };
            const texts = { saving: 'Saving...', saved: 'Saved', error: 'Error' };
            ind.innerHTML = `${icons[status] || icons.saved}<span>${texts[status] || 'Saved'}</span>`;
        }

        async function loadSettings() {
            try {
                const r = await fetch(`${API_BASE}/api/users/settings`);
                if (r.ok) {
                    const data = await r.json();
                    originalValues = { ...data };
                    document.querySelectorAll('[name]').forEach(el => {
                        if (data[el.name] !== undefined && data[el.name] !== null) {
                            el.value = data[el.name];
                        }
                    });
                }
            } catch (e) { console.log('Settings not loaded:', e); }
        }

        async function saveField(fieldName, value) {
            if (originalValues[fieldName] === value) return;
            setSaveStatus('saving');
            try {
                const r = await fetch(`${API_BASE}/api/users/settings`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ [fieldName]: value || null })
                });
                if (r.ok) {
                    originalValues[fieldName] = value;
                    const el = document.querySelector(`[name="${fieldName}"]`);
                    if (el) {
                        el.classList.add('saved');
                        setTimeout(() => el.classList.remove('saved'), 1000);
                    }
                    setSaveStatus('saved');
                } else {
                    setSaveStatus('error');
                }
            } catch (e) { setSaveStatus('error'); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initUserMenu();
            loadSettings();
            document.querySelectorAll('[name]').forEach(el => {
                el.addEventListener('blur', () => saveField(el.name, el.value));
                if (el.tagName === 'SELECT') {
                    el.addEventListener('change', () => saveField(el.name, el.value));
                }
            });
        });
    </script>
</body>
</html>
