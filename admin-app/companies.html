<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/jobs/admin/images/cariara-mark.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Companies · Cariara Admin</title>
    <link rel="stylesheet" href="/jobs/admin/css/theme.css?v=202609291817">
    <link rel="stylesheet" href="/jobs/admin/css/admin-layout.css?v=202609291817">
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="/jobs/admin/css/cariara.css?v=202609291817">
    <link rel="stylesheet" href="/jobs/admin/css/admin-cariara.css?v=202609291817">
</head>
<body>
    <main class="container">
        <div class="admin-card">
            <div class="filter-bar" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px;">
                <input type="search" id="search-input" class="form-control" placeholder="Search companies..." aria-label="Search companies" style="min-width: 0; flex: 1;">
                <button class="btn btn-primary" onclick="openModal()">+ Add Company</button>
            </div>

            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Company Name</th>
                            <th>Industry</th>
                            <th>Size</th>
                            <th>Location</th>
                            <th>Jobs</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="companies-table-body">
                        <tr>
                            <td colspan="6" class="loading">Loading companies...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="company-modal">
        <div class="modal">
            <h3 id="modal-title">Add Company</h3>
            <form id="company-form">
                <input type="hidden" id="company-id">
                <div class="form-group">
                    <label for="name">Company Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="website">Website</label>
                    <input type="url" id="website" name="website" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label for="industry">Industry</label>
                    <input type="text" id="industry" name="industry" placeholder="e.g., Technology, Healthcare">
                </div>
                <div class="form-group">
                    <label for="size">Company Size</label>
                    <select id="size" name="size">
                        <option value="">Select size</option>
                        <option value="startup">Startup (1-50)</option>
                        <option value="small">Small (51-200)</option>
                        <option value="medium">Medium (201-1000)</option>
                        <option value="large">Large (1001-5000)</option>
                        <option value="enterprise">Enterprise (5000+)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="location">Headquarters Location</label>
                    <input type="text" id="location" name="location">
                </div>
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/jobs/admin/js/app.js?v=202609291817"></script>
    <script src="/jobs/admin/js/admin-sidebar.js?v=202609291817"></script>
    <script>
        let allCompanies = [];

        async function loadCompanies() {
            try {
                allCompanies = await apiRequest('/companies');
                renderCompanies(allCompanies);
            } catch (error) {
                console.error('Failed to load companies:', error);
                document.getElementById('companies-table-body').innerHTML = `<tr><td colspan="6" class="alert alert-error">Couldn't load companies: ${escapeHtml(error.message)}</td></tr>`;
            }
        }

        function renderCompanies(companies) {
            const tbody = document.getElementById('companies-table-body');

            if (companies.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No companies found</td></tr>';
                return;
            }

            let html = '';
            companies.forEach(company => {
                const website = safeUrl(company.website);
                const id = Number(company.id);
                html += `
                    <tr>
                        <td>
                            ${escapeHtml(company.name)}
                            ${website ? `<br><small><a href="${website}" target="_blank" rel="noopener noreferrer" style="color: var(--c-blue);">${escapeHtml(company.website)}</a></small>` : ''}
                        </td>
                        <td>${escapeHtml(company.industry || '-')}</td>
                        <td style="text-transform: capitalize;">${escapeHtml(company.size || '-')}</td>
                        <td>${escapeHtml(company.location || '-')}</td>
                        <td>${Number(company.job_count || 0).toLocaleString()}</td>
                        <td>
                            <button class="btn btn-secondary btn-small" onclick="editCompany(${id})">Edit</button>
                            <button class="btn btn-danger btn-small" onclick="deleteCompany(${id})">Delete</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function filterCompanies() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const filtered = allCompanies.filter(company =>
                (company.name || '').toLowerCase().includes(searchQuery) ||
                (company.industry && company.industry.toLowerCase().includes(searchQuery))
            );
            renderCompanies(filtered);
        }

        function openModal() {
            document.getElementById('modal-title').textContent = 'Add Company';
            document.getElementById('company-form').reset();
            document.getElementById('company-id').value = '';
            document.getElementById('company-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('company-modal').classList.remove('active');
        }

        async function editCompany(id) {
            // Check if modal elements exist
            const modalTitle = document.getElementById('modal-title');
            const companyModal = document.getElementById('company-modal');

            if (!modalTitle || !companyModal) {
                showAlert('Edit modal not available on this page', 'error');
                return;
            }

            try {
                const company = await apiRequest(`/companies/${id}`);
                modalTitle.textContent = 'Edit Company';
                document.getElementById('company-id').value = company.id;
                document.getElementById('name').value = company.name || '';
                document.getElementById('website').value = company.website || '';
                document.getElementById('industry').value = company.industry || '';
                document.getElementById('size').value = company.size || '';
                document.getElementById('location').value = company.location || '';
                document.getElementById('notes').value = company.notes || '';
                companyModal.classList.add('active');
            } catch (error) {
                showAlert('Failed to load company: ' + error.message, 'error');
            }
        }

        async function deleteCompany(id) {
            if (!confirm('Are you sure you want to delete this company? This will not delete associated jobs.')) return;

            try {
                await apiRequest(`/companies/${id}`, 'DELETE');
                showAlert('Company deleted successfully');
                loadCompanies();
            } catch (error) {
                showAlert('Failed to delete company: ' + error.message, 'error');
            }
        }

        document.getElementById('company-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const companyId = document.getElementById('company-id').value;
            const formData = {
                name: document.getElementById('name').value,
                website: document.getElementById('website').value || null,
                industry: document.getElementById('industry').value || null,
                size: document.getElementById('size').value || null,
                location: document.getElementById('location').value || null,
                notes: document.getElementById('notes').value || null
            };

            try {
                if (companyId) {
                    await apiRequest(`/companies/${companyId}`, 'PUT', formData);
                    showAlert('Company updated successfully');
                } else {
                    await apiRequest('/companies', 'POST', formData);
                    showAlert('Company created successfully');
                }
                closeModal();
                loadCompanies();
            } catch (error) {
                showAlert('Failed to save company: ' + error.message, 'error');
            }
        });

        // Initialize everything after DOM is ready
        document.addEventListener('DOMContentLoaded', async function() {
            if (!requireAdmin()) return;
            initAdminLayout('companies', 'Companies');

            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

            // Set up event listeners
            document.getElementById('search-input').addEventListener('input', filterCompanies);

            // Load companies data
            await loadCompanies();
        });
    </script>
</body>
</html>
