<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/jobs/admin/images/cariara-mark.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Cariara Admin</title>
    <link rel="stylesheet" href="/jobs/admin/css/theme.css?v=202609291817">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo { margin-bottom: 24px; }
        .logo svg { height: 48px; width: auto; }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }
        .oauth-buttons { display: flex; flex-direction: column; gap: 12px; }
        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
            border: 1px solid var(--border-default);
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        .oauth-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
        }
        .oauth-btn svg { width: 20px; height: 20px; }
        .divider {
            margin: 24px 0;
            color: var(--text-tertiary);
            font-size: 13px;
        }
        .jobs-link {
            color: var(--accent-primary);
            text-decoration: none;
        }
        .jobs-link:hover { text-decoration: underline; }
        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .processing {
            padding: 40px;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-default);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
            .admin-login-form { display: flex; flex-direction: column; gap: 14px; text-align: left; margin-bottom: 8px; }
        .admin-login-form .form-group { display: flex; flex-direction: column; gap: 6px; }
        .admin-login-form input { width: 100%; }
        .login-or { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: var(--c-ink-2); font-size: 12px; }
        .login-or::before, .login-or::after { content: ""; flex: 1; height: 1px; background: var(--c-line); }
        .logo { display: flex; justify-content: center; margin-bottom: 8px; }
    </style>
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="/jobs/admin/css/cariara.css?v=202609291817">
    <link rel="stylesheet" href="/jobs/admin/css/admin-cariara.css?v=202609291817">
</head>
<body>
    <div class="login-container" id="login-container">
        <div class="logo"><a href="/jobs/admin/login.html" class="c-brand" aria-label="Cariara Admin"><img class="c-brand-mark" src="/jobs/admin/images/cariara-mark.svg" alt="" width="32" height="32"><img class="c-brand-word" src="/jobs/admin/images/cariara-wordmark.svg" alt="Cariara" height="24"><span class="c-brand-product">Admin</span></a></div>
        <h1>Sign in to Cariara Admin</h1>
        <p class="subtitle">Administrator accounts only</p>

        <div class="error-message" id="error-message"></div>

        <form id="password-form" class="admin-login-form" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-submit" id="password-btn">Sign in</button>
        </form>
        <div class="login-or"><span>or</span></div>

        <div class="oauth-buttons">
            <a href="#" id="google-login" class="oauth-btn">
                <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </a>
            <a href="#" id="github-login" class="oauth-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                Continue with GitHub
            </a>
            <a href="#" id="linkedin-login" class="oauth-btn">
                <svg viewBox="0 0 24 24" fill="#0A66C2"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                Continue with LinkedIn
            </a>
        </div>

        <p class="divider">Looking for jobs? <a href="https://jobs.cariara.com/" class="jobs-link">Go to Job Portal</a></p>
    </div>

    <div class="processing" id="processing" style="display: none;">
        <div class="spinner"></div>
        <p>Processing login...</p>
    </div>

    <script>
        const LOCAL = ['localhost', '127.0.0.1'].includes(window.location.hostname);
        const API_BASE = LOCAL ? 'http://localhost:8000' : 'https://cariara-backend.up.railway.app';
        const ADMIN_ROLES = ['admin', 'administrator', 'manager', 'developer'];
        const loginBox = document.getElementById('login-container');
        const processing = document.getElementById('processing');
        const errorBox = document.getElementById('error-message');

        function showError(message) {
            errorBox.textContent = message;
            errorBox.style.display = 'block';
            loginBox.style.display = '';
            processing.style.display = 'none';
        }

        function clearSession() {
            ['access_token', 'refresh_token', 'token', 'user'].forEach(k => localStorage.removeItem(k));
        }

        // Only same-origin paths ("/jobs/admin/jobs.html?x=1"), never "//host" or "https:".
        function nextPage() {
            const saved = localStorage.getItem('redirect_after_login') || '';
            localStorage.removeItem('redirect_after_login');
            return /^\/(?!\/)[\w\-./?=&%#]*$/.test(saved) && !/\/login\b/.test(saved) ? saved : '/jobs/admin/index.html';
        }

        // Admin pages send non-admins back here; without this check the two
        // pages redirect to each other forever.
        function finishLogin(accessToken, refreshToken, user) {
            if (!ADMIN_ROLES.includes(user?.role)) {
                clearSession();
                showError(`${user?.email || 'This account'} doesn't have admin access. Sign in with an administrator account.`);
                return;
            }
            localStorage.setItem('access_token', accessToken);
            localStorage.setItem('refresh_token', refreshToken);
            localStorage.setItem('user', JSON.stringify(user));
            window.location.replace(nextPage());
        }

        async function readError(response) {
            const text = await response.text().catch(() => '');
            try {
                const data = JSON.parse(text);
                if (Array.isArray(data.detail)) return data.detail.map(d => d.msg).join('; ');
                return data.detail || data.message || `Sign-in failed (${response.status})`;
            } catch (e) {
                return response.status >= 500 ? 'The server is having trouble. Try again in a minute.' : `Sign-in failed (${response.status})`;
            }
        }

        // OAuth callback: tokens arrive in the URL fragment.
        const hash = window.location.hash.substring(1);
        const hashParams = new URLSearchParams(hash);
        if (hashParams.get('access_token')) {
            loginBox.style.display = 'none';
            processing.style.display = 'block';
            history.replaceState(null, '', window.location.pathname);
            let jobRoles = [];
            try { jobRoles = JSON.parse(hashParams.get('job_roles') || '[]'); } catch (e) {}
            finishLogin(hashParams.get('access_token'), hashParams.get('refresh_token'), {
                id: hashParams.get('user_id'),
                email: hashParams.get('user_email'),
                name: hashParams.get('user_name') || '',
                role: hashParams.get('user_role'),
                job_roles: jobRoles
            });
        } else if (hashParams.get('error') || hashParams.get('message')) {
            history.replaceState(null, '', window.location.pathname);
            showError(hashParams.get('message') || 'Authentication failed');
        } else if (localStorage.getItem('access_token')) {
            // Already signed in: go on only if the session is live and admin.
            (async () => {
                try {
                    let token = localStorage.getItem('access_token');
                    let r = await fetch(`${API_BASE}/api/users/me`, { headers: { Authorization: `Bearer ${token}` } });
                    if (r.status === 401 && localStorage.getItem('refresh_token')) {
                        const rr = await fetch(`${API_BASE}/auth/refresh`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ refresh_token: localStorage.getItem('refresh_token') })
                        });
                        if (rr.ok) {
                            const d = await rr.json();
                            token = d.access_token;
                            localStorage.setItem('access_token', d.access_token);
                            if (d.refresh_token) localStorage.setItem('refresh_token', d.refresh_token);
                            r = await fetch(`${API_BASE}/api/users/me`, { headers: { Authorization: `Bearer ${token}` } });
                        }
                    }
                    if (!r.ok) { clearSession(); return; }
                    const me = await r.json();
                    finishLogin(token, localStorage.getItem('refresh_token'), me);
                } catch (e) { /* offline: stay on the form */ }
            })();
        }

        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            if (!email || !password) return showError('Enter your email and password.');
            const btn = document.getElementById('password-btn');
            btn.disabled = true; btn.textContent = 'Signing in…';
            errorBox.style.display = 'none';
            try {
                const r = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (!r.ok) throw new Error(await readError(r));
                const d = await r.json();
                finishLogin(d.access_token, d.refresh_token, d.user);
            } catch (err) {
                showError(err.message === 'Failed to fetch' ? "Can't reach the Cariara API right now. Check your connection and try again." : err.message);
            } finally {
                btn.disabled = false; btn.textContent = 'Sign in';
            }
        });

        document.getElementById('google-login').href = `${API_BASE}/auth/google/login?redirect=admin`;
        document.getElementById('github-login').href = `${API_BASE}/auth/github/login?redirect=admin`;
        document.getElementById('linkedin-login').href = `${API_BASE}/auth/linkedin/login?redirect=admin`;

        // Hide providers the backend reports as unconfigured (unknown = keep).
        fetch(`${API_BASE}/auth/providers`).then(r => r.ok ? r.json() : null).then(p => {
            if (!p) return;
            [['google', 'google-login'], ['github', 'github-login'], ['linkedin', 'linkedin-login']].forEach(([k, id]) => {
                const v = p[k] ?? p.providers?.[k];
                if (v === false || v?.enabled === false) document.getElementById(id).style.display = 'none';
            });
            const anyShown = ['google-login', 'github-login', 'linkedin-login'].some(id => document.getElementById(id).style.display !== 'none');
            if (!anyShown) document.querySelector('.login-or').style.display = 'none';
        }).catch(() => {});
    </script>
</body>
</html>
