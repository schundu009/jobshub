<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cariara Admin - Login</title>
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo { margin-bottom: 24px; }
        .logo svg { height: 48px; width: auto; }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }
        .oauth-buttons { display: flex; flex-direction: column; gap: 12px; }
        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
            border: 1px solid var(--border-default);
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        .oauth-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
        }
        .oauth-btn svg { width: 20px; height: 20px; }
        .divider {
            margin: 24px 0;
            color: var(--text-tertiary);
            font-size: 13px;
        }
        .jobs-link {
            color: var(--accent-primary);
            text-decoration: none;
        }
        .jobs-link:hover { text-decoration: underline; }
        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .processing {
            padding: 40px;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-default);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <meta name="robots" content="noindex,nofollow">
</head>
<body>
    <div class="login-container" id="login-container">
        <div class="logo">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#5eead4"/>
                        <stop offset="50%" style="stop-color:#14b8a6"/>
                        <stop offset="100%" style="stop-color:#0d9488"/>
                    </linearGradient>
                </defs>
                <path d="M24 6C14.059 6 6 14.059 6 24C6 33.941 14.059 42 24 42C27.8 42 31.3 40.8 34 38.8" stroke="url(#logoGradient)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
                <line x1="26" y1="18" x2="40" y2="18" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="26" y1="25" x2="36" y2="25" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="26" y1="32" x2="32" y2="32" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </div>
        <h1>Admin Portal</h1>
        <p class="subtitle">Sign in to access the admin dashboard</p>

        <div class="error-message" id="error-message"></div>

        <div class="oauth-buttons">
            <a href="#" id="google-login" class="oauth-btn">
                <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </a>
            <a href="#" id="github-login" class="oauth-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                Continue with GitHub
            </a>
            <a href="#" id="linkedin-login" class="oauth-btn">
                <svg viewBox="0 0 24 24" fill="#0A66C2"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                Continue with LinkedIn
            </a>
        </div>

        <p class="divider">Looking for jobs? <a href="https://jobs.cariara.com/" class="jobs-link">Go to Job Portal</a></p>
    </div>

    <div class="processing" id="processing" style="display: none;">
        <div class="spinner"></div>
        <p>Processing login...</p>
    </div>

    <script>
        const API_BASE = 'https://cariara-backend.up.railway.app';

        // Check for OAuth callback tokens in URL hash
        const hash = window.location.hash.substring(1);
        if (hash && hash.includes('access_token')) {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('processing').style.display = 'block';

            // Parse tokens from OAuth callback
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');
            const userId = params.get('user_id');
            const userEmail = params.get('user_email');
            const userName = params.get('user_name') || '';
            const userRole = params.get('user_role');
            const onboardingCompleted = params.get('onboarding_completed') === 'true';
            const rolesConfirmed = params.get('roles_confirmed') === 'true';
            const jobRoles = params.get('job_roles') ? JSON.parse(params.get('job_roles')) : [];

            if (accessToken && refreshToken) {
                // Store tokens
                localStorage.setItem('access_token', accessToken);
                localStorage.setItem('refresh_token', refreshToken);
                localStorage.setItem('user', JSON.stringify({
                    id: userId,
                    email: userEmail,
                    name: userName,
                    role: userRole,
                    onboarding_completed: onboardingCompleted,
                    roles_confirmed: rolesConfirmed,
                    job_roles: jobRoles
                }));

                // Clear hash and redirect to admin dashboard
                history.replaceState(null, '', window.location.pathname);
                window.location.href = '/index.html';
            }
        } else if (hash && hash.includes('error')) {
            // Show error
            const params = new URLSearchParams(hash);
            const error = params.get('message') || 'Authentication failed';
            document.getElementById('error-message').textContent = error;
            document.getElementById('error-message').style.display = 'block';
            history.replaceState(null, '', window.location.pathname);
        }

        // Check if already logged in
        const token = localStorage.getItem('access_token');
        if (token) {
            window.location.href = '/index.html';
        }

        // Set up OAuth login links - use 'admin' redirect parameter
        document.getElementById('google-login').href = `${API_BASE}/auth/google/login?redirect=admin`;
        document.getElementById('github-login').href = `${API_BASE}/auth/github/login?redirect=admin`;
        document.getElementById('linkedin-login').href = `${API_BASE}/auth/linkedin/login?redirect=admin`;
    </script>
</body>
</html>
