<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/jobs/admin/images/cariara-mark.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs · Cariara Admin</title>
    <link rel="stylesheet" href="/jobs/admin/css/theme.css?v=202609291817">
    <link rel="stylesheet" href="/jobs/admin/css/admin-layout.css?v=202609291817">
    <style>
        /* Prevent horizontal overflow - aggressive fix */
        * {
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }

        .container {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        /* Table overflow handling */
        .table-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .admin-table {
            min-width: 800px;
        }

        .admin-card {
            max-width: 100%;
            overflow: hidden;
        }

        .filter-bar {
            max-width: 100%;
            overflow-x: auto;
        }

        .hero-section {
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            color: var(--text-primary);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hero-section h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 600;
        }
        .hero-section p {
            margin: 0 0 25px 0;
            opacity: 0.9;
            font-size: 15px;
        }
        .import-box {
            background: var(--bg-subtle);
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .import-box label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        .import-form {
            display: flex;
            gap: 10px;
        }
        .import-form input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
        }
        .import-form button {
            padding: 12px 24px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .import-form button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .import-form button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .import-result {
            margin-top: 15px;
            padding: 12px 15px;
            background: var(--bg-muted);
            border-radius: 6px;
            font-size: 14px;
            text-align: left;
        }
        .import-result.error {
            background: var(--error-muted);
            color: var(--error);
        }
        .import-result.success {
            background: var(--success-muted);
            border: 1px solid var(--success);
        }

        /* Tracked companies: registry scrapers only, from one GET /api/scrapers/status. */
        .tracked {
            background: var(--c-surface);
            border: 1px solid var(--c-line);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            max-width: 100%;
            min-width: 0;
        }
        .tracked-head {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .tracked-head h3 {
            margin: 0;
            font-family: var(--c-display);
            font-size: 16px;
            font-weight: 500;
            color: var(--c-ink);
        }
        .tracked-head .tracked-meta { font-size: 13px; color: var(--c-ink-3); }
        .tracked-head .tracked-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .tracked-search { width: 240px; max-width: 100%; }
        .tracked-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 4px 16px;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .tracked-row {
            display: grid;
            grid-template-columns: 10px minmax(0, 1fr) auto auto auto;
            align-items: center;
            gap: 10px;
            min-height: 40px;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 14px;
            color: var(--c-ink);
        }
        .tracked-row:hover { background: var(--c-state); }
        .tracked-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0;
            border: 0;
            background: none;
            color: var(--c-ink);
            font: inherit;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
        }
        .tracked-name:hover { color: var(--c-blue); text-decoration: underline; }
        .tracked-count { font-variant-numeric: tabular-nums; color: var(--c-ink); font-size: 13px; text-align: right; }
        .tracked-count.zero { color: var(--c-ink-3); }
        .tracked-age { font-size: 12px; color: var(--c-ink-3); white-space: nowrap; min-width: 52px; text-align: right; }
        .health-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--c-green);
        }
        .health-dot.warn { background: var(--c-yellow); }
        .health-dot.bad { background: var(--c-red); }
        .health-dot.off { background: var(--c-outline); }
        .run-btn {
            height: 28px;
            min-width: 44px;
            padding: 0 10px;
            border: 1px solid var(--c-line);
            border-radius: 999px;
            background: var(--c-surface);
            color: var(--c-blue);
            font: 500 12px var(--c-display);
            cursor: pointer;
        }
        .run-btn:hover { background: var(--c-blue-tint); }
        .run-btn:disabled { color: var(--c-ink-3); cursor: progress; background: var(--c-surface-2); }
        .tracked-more { margin-top: 8px; }
        .tracked-empty, .tracked-error { font-size: 14px; color: var(--c-ink-2); padding: 8px 0; }
        .tracked-error { color: var(--c-red); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .tracked-fold {
            margin-top: 12px;
            border-top: 1px solid var(--c-line-soft);
            padding-top: 8px;
        }
        .tracked-fold > summary {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            font-family: var(--c-display);
            font-size: 14px;
            font-weight: 500;
            color: var(--c-ink);
            list-style: none;
        }
        .tracked-fold > summary::-webkit-details-marker { display: none; }
        .tracked-fold > summary::before {
            content: "";
            width: 0;
            height: 0;
            border-left: 5px solid var(--c-ink-2);
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            transition: transform .15s;
        }
        .tracked-fold[open] > summary::before { transform: rotate(90deg); }
        .fold-count {
            display: inline-flex;
            align-items: center;
            height: 20px;
            padding: 0 8px;
            border-radius: 999px;
            font-size: 12px;
            background: var(--c-surface-3);
            color: var(--c-ink-2);
        }
        .fold-count.warn { background: var(--c-yellow-tint); color: var(--c-yellow); }
        .issue-list { list-style: none; margin: 4px 0 0; padding: 0; }
        .issue-row {
            display: grid;
            grid-template-columns: 10px minmax(120px, 220px) minmax(0, 1fr) auto;
            gap: 10px 12px;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid var(--c-line-soft);
            font-size: 13px;
        }
        .issue-row:last-child { border-bottom: 0; }
        .issue-group {
            padding: 12px 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em;
            text-transform: uppercase; color: var(--c-ink-2);
        }
        .issue-group span { font-family: var(--font-mono); font-weight: 500; margin-left: 4px; }
        .issue-row .tracked-name { font-size: 14px; }
        .issue-why { color: var(--c-ink-2); min-width: 0; overflow-wrap: anywhere; }
        .issue-why .reason { color: var(--c-ink); font-weight: 500; }
        .issue-why .err {
            display: block;
            margin-top: 2px;
            color: var(--c-ink-3);
            font-family: var(--c-mono);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @media (max-width: 720px) {
            .tracked { padding: 12px; }
            .tracked-search { width: 100%; }
            .issue-row { grid-template-columns: 10px minmax(0, 1fr) auto; }
            .issue-why { grid-column: 2 / -1; }
        }
        .stats-error { font-size: 13px; color: var(--c-ink-2); margin: -8px 0 16px; display: flex; gap: 8px; align-items: center; }
        .stats-error[hidden] { display: none; }

        .time-filter {
            display: flex;
            gap: 6px;
            margin-right: auto;
        }
        .time-pill {
            padding: 6px 12px;
            border: 1px solid var(--border-light);
            border-radius: 16px;
            background: var(--bg-elevated);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .time-pill:hover {
            border-color: var(--border-subtle);
            background: var(--bg-hover);
        }
        .time-pill.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            max-width: 100%;
        }
        .filter-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
        .filter-check input { padding: 0; }
        .group-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .group-bar label { font-size: 13px; color: var(--text-secondary); }
        .group-bar select { padding: 6px 10px; border: 1px solid var(--border-default); background: var(--bg-elevated); color: var(--text-primary); border-radius: 8px; font-family: inherit; }
        .group-strip { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 100%; }
        .group-chip { display: inline-flex; gap: 6px; align-items: baseline; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border-default); background: var(--bg-elevated); color: var(--text-primary); font: inherit; font-size: 13px; cursor: pointer; }
        .group-chip b { font-weight: 600; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
        .group-chip.active { border-color: var(--accent-primary, #26619C); background: color-mix(in srgb, var(--accent-primary, #26619C) 14%, transparent); }
        .tag { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
        .filter-bar select, .filter-bar input {
            padding: 10px 14px;
            border: 1px solid var(--border-default);
            background: var(--bg-elevated);
            color: var(--text-primary);
            border-radius: 8px;
            font-family: inherit;
            max-width: 100%;
            min-width: 0;
        }

        .source-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .source-manual { background: #e3f2fd; color: #1565c0; }
        .source-greenhouse { background: #e8f5e9; color: #2e7d32; }
        .source-lever { background: #fff8e1; color: #f57f17; }
        .source-ashby { background: #fce4ec; color: #c2185b; }
        .source-smartrecruiters { background: #e0f2f1; color: #00695c; }
        .source-workable { background: #ede7f6; color: #512da8; }
        .source-recruitee { background: #fff3e0; color: #e65100; }
        .source-workday { background: #e8eaf6; color: #283593; }

        .stats-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            max-width: 100%;
        }
        .stat-mini {
            background: var(--bg-elevated);
            padding: 18px 24px;
            border-radius: 12px;
            text-align: center;
            flex: 1;
            min-width: 140px;
            border: 1px solid var(--border-default);
        }
        .stat-mini .number {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .stat-mini:nth-child(2) .number { color: var(--success); }
        .stat-mini:nth-child(3) .number { color: var(--warning); }
        .stat-mini .label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            font-weight: 500;
        }

        .import-tabs {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 20px;
        }
        .import-tab {
            background: var(--bg-muted);
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .import-tab:hover { background: var(--border-default); }
        .import-tab.active {
            background: var(--accent-primary);
            color: white;
        }
        .import-tab-content { display: none; width: 100%; }
        .import-tab-content.active { display: block; }

        .refresh-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 4px;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }
        .refresh-btn:hover { background: var(--bg-muted); color: var(--text-primary); }
        .refresh-btn.loading { animation: spin 1s linear infinite; }
        .refresh-btn.success { color: var(--success); }
        .refresh-btn.error { color: var(--error); }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .job-title-link {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
        }
        .job-title-link:hover {
            color: var(--accent-primary);
            text-decoration: underline;
        }
        .external-link {
            color: var(--text-muted);
            font-size: 11px;
            margin-left: 6px;
        }
    </style>
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="/jobs/admin/css/cariara.css?v=202609291817">
    <link rel="stylesheet" href="/jobs/admin/css/admin-cariara.css?v=202609291817">
</head>
<body>
    <main class="container">
        <!-- Hero Import Section -->
        <div class="hero-section">
            <div class="import-tabs">
                <button class="import-tab active" onclick="switchImportTab('auto', this)">Auto Import</button>
                <button class="import-tab" onclick="switchImportTab('custom', this)">Custom Company</button>
            </div>

            <div id="auto-import-tab" class="import-tab-content active">
                <div class="import-box">
                    <label>Career Page URL</label>
                    <div class="import-form">
                        <input type="text" id="career-url" placeholder="Enter career page URL">
                        <button onclick="ingestJobs()" id="ingest-btn">Import Jobs</button>
                    </div>
                    <div id="import-result"></div>
                </div>
            </div>

            <div id="custom-import-tab" class="import-tab-content">
                <div class="import-box">
                    <label>Company Name</label>
                    <input type="text" id="custom-company-name" placeholder="Company name" style="width: 100%; padding: 12px; border: none; border-radius: 6px; margin-bottom: 12px;">
                    <label>Career Page URL</label>
                    <div class="import-form" style="gap: 8px;">
                        <input type="text" id="custom-career-url" placeholder="Enter career page URL">
                        <button onclick="detectJobBoard()" id="detect-btn">Detect</button>
                        <button onclick="addCustomCompany()" id="custom-btn" disabled>Add & Scrape</button>
                    </div>
                    <div id="custom-result"></div>
                </div>
            </div>
        </div>

        <!-- Quick Stats: /api/analytics/summary + the scraper status list -->
        <div class="stats-row">
            <div class="stat-mini">
                <div class="number" id="stat-total">-</div>
                <div class="label">Active jobs</div>
            </div>
            <div class="stat-mini">
                <div class="number" id="stat-companies">-</div>
                <div class="label">Companies tracked</div>
            </div>
            <div class="stat-mini">
                <div class="number" id="stat-wishlist">-</div>
                <div class="label">In wishlist</div>
            </div>
            <div class="stat-mini">
                <div class="number" id="stat-applied">-</div>
                <div class="label">Applied</div>
            </div>
        </div>
        <div class="stats-error" id="stats-error" role="status" hidden>
            <span id="stats-error-text">Couldn't load job counts.</span>
            <button type="button" class="btn btn-secondary btn-small" onclick="loadStats()">Retry</button>
        </div>

        <!-- Tracked Companies: one GET /api/scrapers/status, no per-company requests -->
        <section class="tracked" aria-labelledby="tracked-title">
            <div class="tracked-head">
                <h3 id="tracked-title">Tracked companies</h3>
                <span class="tracked-meta" id="tracked-meta"></span>
                <div class="tracked-actions">
                    <input type="search" id="tracked-search" class="tracked-search" placeholder="Filter tracked companies" aria-label="Filter tracked companies">
                    <button type="button" class="btn btn-secondary btn-small" onclick="refreshAllWithStatus(this)" id="refresh-btn" title="Re-fetch companies added with Import (not the scrapers below)">Refresh imports</button>
                </div>
            </div>
            <ul class="tracked-list" id="tracked-list" aria-live="polite">
                <li class="tracked-empty">Loading…</li>
            </ul>
            <div class="tracked-more" id="tracked-more" hidden>
                <button type="button" class="btn btn-secondary btn-small" id="tracked-toggle"></button>
            </div>

            <details class="tracked-fold" id="attention-fold">
                <summary>Needs attention <span class="fold-count" id="attention-count">0</span></summary>
                <ul class="issue-list" id="attention-list"></ul>
            </details>

            <details class="tracked-fold" id="nojobs-fold">
                <summary>No active jobs <span class="fold-count" id="nojobs-count">0</span></summary>
                <ul class="issue-list" id="nojobs-list"></ul>
            </details>

            <details class="tracked-fold" id="disabled-fold">
                <summary>Disabled boards <span class="fold-count" id="disabled-count">0</span></summary>
                <ul class="issue-list" id="disabled-list"></ul>
            </details>
        </section>

        <!-- Jobs List -->
        <div class="admin-card">
            <div class="admin-card-header">
                <h3 class="admin-card-title">All Jobs</h3>
            </div>

            <div class="filter-bar">
                <div class="time-filter">
                    <button class="time-pill active" data-days="0" onclick="setTimeFilter(0)">All Time</button>
                    <button class="time-pill" data-days="1" onclick="setTimeFilter(1)">Today</button>
                    <button class="time-pill" data-days="7" onclick="setTimeFilter(7)">Past Week</button>
                    <button class="time-pill" data-days="30" onclick="setTimeFilter(30)">Past Month</button>
                </div>
                <input type="search" id="search-input" placeholder="Search title, company, location, skills" aria-label="Search jobs">
                <select id="f-countries" aria-label="Country"><option value="">All Countries</option></select>
                <input type="search" id="f-location" placeholder="City or metro" aria-label="Location">
                <select id="f-role_category" aria-label="Role"><option value="">All Roles</option></select>
                <select id="f-domain" aria-label="Domain"><option value="">All Domains</option></select>
                <select id="f-seniority_level" aria-label="Seniority"><option value="">All Levels</option></select>
                <select id="f-work_type" aria-label="Work type"><option value="">Any Work Type</option></select>
                <select id="f-employment_type" aria-label="Job type"><option value="">Any Job Type</option></select>
                <select id="company-filter" aria-label="Company"><option value="">All Companies</option></select>
                <select id="status-filter" aria-label="Status">
                    <option value="">All Statuses</option>
                    <option value="wishlist">Wishlist</option>
                    <option value="applied">Applied</option>
                    <option value="interviewing">Interviewing</option>
                    <option value="offer">Offer</option>
                    <option value="rejected">Rejected</option>
                    <option value="withdrawn">Withdrawn</option>
                </select>
                <label class="filter-check"><input type="checkbox" id="f-visa_ok"> No citizenship required</label>
                <button type="button" class="btn btn-secondary btn-small" id="clear-filters">Clear</button>
            </div>
            <div class="group-bar">
                <label for="group-by">Group by</label>
                <select id="group-by">
                    <option value="role_category">Role</option>
                    <option value="domain">Domain</option>
                    <option value="seniority_level">Seniority</option>
                    <option value="countries">Country</option>
                    <option value="company">Company</option>
                </select>
                <div id="group-strip" class="group-strip"></div>
            </div>

            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Job Title</th>
                            <th>Company</th>
                            <th>Location</th>
                            <th>Source</th>
                            <th>Role</th>
                            <th>Domain</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="jobs-table-body">
                        <tr>
                            <td colspan="7" class="loading">Loading jobs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="jobs-pagination" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px 0 0;">
                <span id="jobs-range" style="font-size: 13px; color: var(--c-ink-2);"></span>
                <div style="display: flex; gap: 8px;">
                    <button type="button" class="btn btn-secondary btn-small" id="prev-page" disabled>Previous</button>
                    <button type="button" class="btn btn-secondary btn-small" id="next-page" disabled>Next</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/jobs/admin/js/app.js?v=202609291817"></script>
    <script src="/jobs/admin/js/admin-sidebar.js?v=202609291817"></script>
    <script>
        // Every filter is a GET /api/jobs parameter, so paging, totals and the dropdown
        // counts (GET /api/jobs/facets, same parameters) always describe the same set.
        const PAGE_SIZE = 50;
        // select id suffix -> API parameter (and facet key)
        const FACET_SELECTS = ['countries', 'role_category', 'domain', 'seniority_level', 'work_type', 'employment_type'];
        const FACET_KEY = { countries: 'countries', role_category: 'role_category', domain: 'domain',
                            seniority_level: 'seniority', work_type: 'work_type', employment_type: 'employment_type' };
        const ANY_LABEL = { countries: 'All Countries', role_category: 'All Roles', domain: 'All Domains',
                            seniority_level: 'All Levels', work_type: 'Any Work Type', employment_type: 'Any Job Type' };
        const WORK_LABELS = { remote: 'Remote', hybrid: 'Hybrid', onsite: 'On-site' };
        const EMPLOYMENT_LABELS = { full_time: 'Full-time', part_time: 'Part-time', internship: 'Internship', temporary: 'Temporary' };

        let currentPage = 0;
        let serverTotal = 0;
        let allCompanies = [];
        let timeFilterDays = 0;
        let loadSeq = 0;
        let facetSeq = 0;
        let lastFacets = null;
        let taxonomy = { role_category: {}, domain: {}, seniority: {} };
        let pendingCompanyParam = null;
        const regionNames = (() => { try { return new Intl.DisplayNames(['en'], { type: 'region' }); } catch { return null; } })();
        const countryName = (code) => (regionNames && regionNames.of(code)) || code;

        function getFilters() {
            const val = (id) => document.getElementById(id).value.trim();
            const f = {
                q: val('search-input'),
                location: val('f-location'),
                company_id: val('company-filter'),
                status: val('status-filter'),
                visa_ok: document.getElementById('f-visa_ok').checked,
            };
            FACET_SELECTS.forEach(k => { f[k] = val('f-' + k); });
            return f;
        }

        function anyFilter(f = getFilters()) {
            return !!(timeFilterDays || Object.values(f).some(Boolean));
        }

        // The list and the facets share these; paging is added by loadJobs.
        function filterParams(f = getFilters()) {
            const params = new URLSearchParams({ country: 'ALL', include_evergreen: 'true', active_only: 'true' });
            for (const [k, v] of Object.entries(f)) {
                if (v === true) params.set(k, 'true');
                else if (v) params.set(k, v);
            }
            if (timeFilterDays > 0) params.set('posted_within_hours', String(timeFilterDays * 24));
            return params;
        }

        function setSelectValue(id, value) {
            const el = document.getElementById(id);
            if (value && ![...el.options].some(o => o.value === value)) el.add(new Option(value, value));
            el.value = value || '';
        }

        // ?q= ?location= ?countries= ?role_category= ?domain= ?seniority_level= ?work_type=
        // ?employment_type= ?company=(id|name) ?status= ?visa_ok=1 ?days= ?page= ?group=
        function applyUrlFilters() {
            const params = new URLSearchParams(window.location.search);
            document.getElementById('search-input').value = params.get('q') || '';
            document.getElementById('f-location').value = params.get('location') || '';
            FACET_SELECTS.forEach(k => setSelectValue('f-' + k, params.get(k)));
            setSelectValue('status-filter', params.get('status'));
            document.getElementById('f-visa_ok').checked = params.get('visa_ok') === '1';
            const group = params.get('group');
            if (group) setSelectValue('group-by', group);
            pendingCompanyParam = params.get('company') || params.get('company_id');
            const days = parseInt(params.get('days'), 10);
            if ([1, 7, 30].includes(days)) setTimeFilter(days, false);
            const page = parseInt(params.get('page'), 10);
            if (page > 1) currentPage = page - 1;
        }

        function syncUrl() {
            const f = getFilters();
            const params = new URLSearchParams();
            for (const [k, v] of Object.entries(f)) {
                if (k === 'company_id') { if (v) params.set('company', v); }
                else if (v === true) params.set(k, '1');
                else if (v) params.set(k, v);
            }
            if (timeFilterDays) params.set('days', timeFilterDays);
            if (currentPage) params.set('page', currentPage + 1);
            const group = document.getElementById('group-by').value;
            if (group !== 'role_category') params.set('group', group);
            const qs = params.toString();
            history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : ''));
        }

        // Resolve ?company=<id|name> once the company list is known.
        function resolveCompanyParam() {
            if (!pendingCompanyParam) return false;
            const raw = pendingCompanyParam;
            pendingCompanyParam = null;
            const select = document.getElementById('company-filter');
            const match = /^\d+$/.test(raw)
                ? allCompanies.find(c => String(c.id) === raw)
                : allCompanies.find(c => (c.name || '').toLowerCase() === raw.toLowerCase());
            if (match) {
                select.value = String(match.id);
                return true;
            }
            if (!/^\d+$/.test(raw)) document.getElementById('search-input').value = raw;
            return true;
        }

        async function loadTaxonomy() {
            try {
                const t = await apiRequest('/jobs/taxonomy');
                const toMap = (rows) => Object.fromEntries((rows || []).map(r => [r.value, r.label]));
                taxonomy = { role_category: toMap(t.role_categories), domain: toMap(t.domains), seniority: toMap(t.seniorities) };
            } catch (error) {
                console.error('Failed to load job taxonomy:', error);
            }
        }

        // facet key -> [{value, label, count}] in display order
        function facetOptions(facets, key) {
            const v = facets[key];
            if (key === 'countries') return (v || []).map(c => ({ value: c.code, label: countryName(c.code), count: c.count }));
            if (key === 'work_type') return Object.entries(v || {}).map(([k, n]) => ({ value: k, label: WORK_LABELS[k] || k, count: n }));
            if (key === 'employment_type') return Object.entries(v || {}).map(([k, n]) => ({ value: k, label: EMPLOYMENT_LABELS[k] || k, count: n }));
            if (key === 'companies') return (v || []).map(c => ({ value: c.name, label: c.name, count: c.count }));
            return v || [];
        }

        function fillFacetSelect(k, facets) {
            const select = document.getElementById('f-' + k);
            const current = select.value;
            const options = facetOptions(facets, FACET_KEY[k]).filter(o => o.count > 0 || o.value === current);
            select.innerHTML = '';
            select.add(new Option(ANY_LABEL[k], ''));
            options.forEach(o => select.add(new Option(`${o.label} (${Number(o.count).toLocaleString()})`, o.value)));
            if (current && ![...select.options].some(o => o.value === current)) select.add(new Option(current, current));
            select.value = current;
        }

        async function loadFacets() {
            const seq = ++facetSeq;
            try {
                const facets = await apiRequest(`/jobs/facets?${filterParams().toString()}`, 'GET', null, { timeout: 20000 });
                if (seq !== facetSeq) return;
                lastFacets = facets;
                FACET_SELECTS.forEach(k => fillFacetSelect(k, facets));
                renderGroups();
            } catch (error) {
                if (seq !== facetSeq) return;
                console.error('Failed to load filter counts:', error);
                document.getElementById('group-strip').innerHTML = `<span class="tag">Couldn't load counts: ${escapeHtml(error.message)}</span>`;
            }
        }

        // Group by = the chosen facet as chips; a chip applies that filter, clicking it again clears it.
        function renderGroups() {
            const strip = document.getElementById('group-strip');
            if (!lastFacets) return;
            const by = document.getElementById('group-by').value;
            const key = by === 'company' ? 'companies' : FACET_KEY[by];
            const current = by === 'company'
                ? (allCompanies.find(c => String(c.id) === document.getElementById('company-filter').value) || {}).name || ''
                : document.getElementById('f-' + by).value;
            const groups = facetOptions(lastFacets, key).filter(o => o.count > 0)
                .sort((a, b) => b.count - a.count).slice(0, by === 'company' ? 40 : 60);
            strip.innerHTML = groups.length
                ? groups.map(o => `<button type="button" class="group-chip${o.value === current ? ' active' : ''}" data-value="${escapeHtml(o.value)}">${escapeHtml(o.label)} <b>${Number(o.count).toLocaleString()}</b></button>`).join('')
                : '<span class="tag">No jobs</span>';
            strip.querySelectorAll('.group-chip').forEach(chip => chip.addEventListener('click', () => {
                const value = chip.dataset.value === current ? '' : chip.dataset.value;
                if (by === 'company') {
                    const match = allCompanies.find(c => c.name === value);
                    document.getElementById('company-filter').value = match ? String(match.id) : '';
                } else {
                    setSelectValue('f-' + by, value);
                }
                resetAndLoad();
            }));
        }

        async function loadCompanies() {
            try {
                const companies = await apiRequest('/companies');
                allCompanies = (Array.isArray(companies) ? companies : [])
                    .filter(c => c && c.name)
                    .sort((a, b) => a.name.localeCompare(b.name));
                const select = document.getElementById('company-filter');
                const currentValue = select.value;
                select.innerHTML = '<option value="">All Companies</option>';
                allCompanies.forEach(c => select.add(new Option(c.name, String(c.id))));
                if (currentValue) select.value = currentValue;
                return resolveCompanyParam();
            } catch (error) {
                console.error('Failed to load companies:', error);
                return false;
            }
        }

        // Header counts from one cached aggregate (no job list). Companies
        // tracked comes from the scraper status list (renderTracked).
        async function loadStats() {
            const ids = ['stat-total', 'stat-wishlist', 'stat-applied'];
            const errorBox = document.getElementById('stats-error');
            errorBox.hidden = true;
            ids.forEach(id => { document.getElementById(id).textContent = '…'; });
            try {
                const summary = await apiRequest('/analytics/summary', 'GET', null, { timeout: 15000 });
                const sc = summary.status_counts || {};
                document.getElementById('stat-total').textContent = Number(summary.total_jobs || 0).toLocaleString();
                document.getElementById('stat-wishlist').textContent = Number(sc.wishlist || 0).toLocaleString();
                document.getElementById('stat-applied').textContent = Number(sc.applied || 0).toLocaleString();
            } catch (error) {
                ids.forEach(id => { document.getElementById(id).textContent = '—'; });
                document.getElementById('stats-error-text').textContent = `Couldn't load job counts: ${error.message}`;
                errorBox.hidden = false;
            }
        }

        function switchImportTab(tab, btn) {
            document.querySelectorAll('.import-tab').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            document.querySelectorAll('.import-tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tab + '-import-tab').classList.add('active');
        }

        let detectedBoardInfo = null;

        async function detectJobBoard() {
            const urlInput = document.getElementById('custom-career-url');
            const detectBtn = document.getElementById('detect-btn');
            const addBtn = document.getElementById('custom-btn');
            const resultDiv = document.getElementById('custom-result');

            const url = urlInput.value.trim();
            if (!url) {
                resultDiv.innerHTML = '<div class="import-result error">Please enter a career page URL</div>';
                return;
            }

            detectBtn.disabled = true;
            detectBtn.textContent = 'Detecting...';
            addBtn.disabled = true;
            resultDiv.innerHTML = '<div class="import-result">Analyzing job board type...</div>';

            try {
                const response = await apiRequest('/scrapers/custom/detect', 'POST', { careers_url: url });
                detectedBoardInfo = response;

                if (!response || response.board_type === 'unknown') {
                    resultDiv.innerHTML = `<div class="import-result error">Could not detect a job board with jobs. Supported: Greenhouse, Lever, Ashby, SmartRecruiters, Workday</div>`;
                    addBtn.disabled = true;
                } else {
                    resultDiv.innerHTML = `
                        <div class="import-result success">
                            <strong>${escapeHtml(String(response.board_type).toUpperCase())}</strong> detected
                            ${response.job_count ? ` - ${Number(response.job_count).toLocaleString()} jobs available` : ''}
                        </div>
                    `;
                    addBtn.disabled = false;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="import-result error">Detection failed: ${escapeHtml(error.message)}</div>`;
                addBtn.disabled = true;
            } finally {
                detectBtn.disabled = false;
                detectBtn.textContent = 'Detect';
            }

        async function addCustomCompany() {
            const nameInput = document.getElementById('custom-company-name');
            const urlInput = document.getElementById('custom-career-url');
            const addBtn = document.getElementById('custom-btn');
            const resultDiv = document.getElementById('custom-result');

            const name = nameInput.value.trim();
            if (!name) {
                resultDiv.innerHTML = '<div class="import-result error">Please enter a company name</div>';
                return;
            }

            if (!detectedBoardInfo || detectedBoardInfo.board_type === 'unknown') {
                resultDiv.innerHTML = '<div class="import-result error">Please detect the job board type first</div>';
                return;
            }

            addBtn.disabled = true;
            addBtn.textContent = 'Creating...';

            try {
                const response = await apiRequest('/scrapers/custom/add', 'POST', {
                    company_name: name,
                    careers_url: urlInput.value.trim()
                }, { timeout: 60000 });

                resultDiv.innerHTML = `
                    <div class="import-result success">
                        <strong>${escapeHtml(response.company_name)}</strong> added - ${Number(response.job_count || 0).toLocaleString()} jobs
                    </div>
                `;
                nameInput.value = '';
                urlInput.value = '';
                detectedBoardInfo = null;
                addBtn.disabled = true;
                loadScraperStatus();
                loadJobs();
            } catch (error) {
                resultDiv.innerHTML = `<div class="import-result error">Error: ${escapeHtml(error.message)}</div>`;
                addBtn.disabled = false;
            } finally {
                addBtn.textContent = 'Add & Scrape';
            }
        }

        async function loadJobs() {
            const tableBody = document.getElementById('jobs-table-body');
            const seq = ++loadSeq;
            const params = filterParams();
            params.set('all', 'true');
            params.set('limit', String(PAGE_SIZE));
            params.set('offset', String(currentPage * PAGE_SIZE));
            params.set('description_chars', '300');

            tableBody.innerHTML = '<tr><td colspan="7" class="loading" style="text-align:center;padding:40px;">Loading jobs...</td></tr>';
            document.getElementById('prev-page').disabled = true;
            document.getElementById('next-page').disabled = true;
            syncUrl();
            loadFacets();

            try {
                const response = await apiRequest(`/jobs?${params.toString()}`);
                if (seq !== loadSeq) return; // a newer request superseded this one
                const jobs = Array.isArray(response) ? response : (response.jobs || []);
                serverTotal = Number(response.total ?? jobs.length);
                if (!jobs.length && currentPage > 0 && serverTotal > 0) {  // page past the end after a filter change
                    currentPage = Math.max(0, Math.ceil(serverTotal / PAGE_SIZE) - 1);
                    return loadJobs();
                }
                renderJobs(jobs);
                renderRange(jobs.length);
            } catch (error) {
                if (seq !== loadSeq) return;
                console.error('Failed to load jobs:', error);
                tableBody.innerHTML = `<tr><td colspan="7" class="alert alert-error">Couldn't load jobs: ${escapeHtml(error.message)} <button type="button" class="btn btn-secondary btn-small" onclick="loadJobs()">Retry</button></td></tr>`;
                document.getElementById('jobs-range').textContent = '';
            }
        }

        function renderRange(count) {
            const start = serverTotal === 0 ? 0 : currentPage * PAGE_SIZE + 1;
            const end = Math.min(serverTotal, currentPage * PAGE_SIZE + count);
            document.getElementById('jobs-range').textContent = serverTotal
                ? `Showing ${start.toLocaleString()}–${end.toLocaleString()} of ${serverTotal.toLocaleString()} jobs` : '';
            document.getElementById('prev-page').disabled = currentPage === 0;
            document.getElementById('next-page').disabled = end >= serverTotal;
        }

        function getSourceBadge(source) {
            const labels = {
                'manual': 'Manual', 'greenhouse': 'Greenhouse', 'lever': 'Lever',
                'ashby': 'Ashby', 'smartrecruiters': 'SmartRecruiters', 'workable': 'Workable',
                'recruitee': 'Recruitee', 'workday': 'Workday'
            };
            const key = labels[source] ? source : 'manual';
            return `<span class="source-badge source-${key}">${escapeHtml(labels[source] || source || 'Manual')}</span>`;
        }

        function renderJobs(jobs) {
            const tbody = document.getElementById('jobs-table-body');

            if (jobs.length === 0) {
                const filtered = anyFilter();
                tbody.innerHTML = `<tr><td colspan="7" class="empty-state">${filtered ? 'No jobs match these filters.' : 'No jobs found. Import jobs from a company above!'}</td></tr>`;
                return;
            }

            tbody.innerHTML = jobs.map(job => {
                const role = taxonomy.role_category[job.role_category] || '';
                const level = taxonomy.seniority[job.seniority] || '';
                const domain = taxonomy.domain[job.company_domain] || '';
                const jobUrl = safeUrl(job.job_url || job.url);
                const externalLink = jobUrl ? ` <a href="${jobUrl}" target="_blank" rel="noopener noreferrer" class="external-link" title="Open original posting">↗</a>` : '';
                const companyName = job.company_name || (job.company ? job.company.name : null) || '-';
                const detail = `job_detail.html?id=${encodeURIComponent(job.id)}`;
                return `
                    <tr>
                        <td><a href="${detail}" class="job-title-link">${escapeHtml(job.title || 'Untitled')}</a>${externalLink}</td>
                        <td>${escapeHtml(companyName)}</td>
                        <td>${escapeHtml(job.location || '-')}</td>
                        <td>${getSourceBadge(job.source)}</td>
                        <td><span class="tag">${escapeHtml(role || '-')}</span>${level ? `<br><span class="tag">${escapeHtml(level)}</span>` : ''}</td>
                        <td><span class="tag">${escapeHtml(domain || '-')}</span></td>
                        <td><a href="${detail}" class="btn btn-secondary btn-small">View</a></td>
                    </tr>
                `;
            }).join('');
        }

        function resetAndLoad() {
            currentPage = 0;
            loadJobs();
        }

        function setTimeFilter(days, reload = true) {
            timeFilterDays = days;
            document.querySelectorAll('.time-pill').forEach(pill => {
                pill.classList.toggle('active', parseInt(pill.dataset.days, 10) === days);
            });
            if (reload) resetAndLoad();
        }

        function filterByCompany(companyName) {
            const match = allCompanies.find(c => (c.name || '').toLowerCase() === String(companyName).toLowerCase());
            if (match) {
                document.getElementById('company-filter').value = String(match.id);
                document.getElementById('search-input').value = '';
            } else {
                document.getElementById('company-filter').value = '';
                document.getElementById('search-input').value = companyName;
            }
            resetAndLoad();
            document.querySelector('.table-container').scrollIntoView({ behavior: 'smooth' });
        }

        async function ingestJobs() {
            const urlInput = document.getElementById('career-url');
            const btn = document.getElementById('ingest-btn');
            const resultDiv = document.getElementById('import-result');

            const url = urlInput.value.trim();
            if (!url) {
                resultDiv.innerHTML = '<div class="import-result error">Please enter a career page URL</div>';
                return;

            resultDiv.innerHTML = '<div class="import-result">Fetching jobs...</div>';

            try {

                const company = `<strong>${escapeHtml(response.company_name)}</strong>`;

                } else if (response.jobs_updated > 0) {

        // ── Tracked companies ─────────────────────────────────────────────
        // One GET /api/scrapers/status (cached 60s server-side) feeds the list,
        // "Needs attention", "Disabled boards" and the Companies tracked stat.
        const TRACKED_TOP = 25;
        const STALE_MS = 48 * 3600 * 1000;
        const ATTENTION_ERRORS = { save_failed: 'Jobs found but not saved', empty_result: 'Returned 0 jobs', timeout: 'Timed out' };
        let scraperStatus = [];
        let trackedShowAll = false;
        var attentionShowAll = false;
        var noJobsShowAll = false;
        let statusSeq = 0;

        function parseUtc(value) {
            if (!value) return NaN;
            const v = String(value);
            return Date.parse(/[zZ]|[+-]\d\d:?\d\d$/.test(v) ? v : v + 'Z');
        }

        function timeAgo(value) {
            const t = parseUtc(value);
            if (isNaN(t)) return 'never';
            const s = Math.max(0, (Date.now() - t) / 1000);
            if (s < 90) return 'just now';
            if (s < 3600) return `${Math.round(s / 60)}m ago`;
            if (s < 86400) return `${Math.round(s / 3600)}h ago`;
            return `${Math.round(s / 86400)}d ago`;
        }

        // Needs-attention groups, most severe first. A board is in exactly one.
        const ATTENTION_GROUPS = [
            { key: 'save_error', label: 'Save failed (database error)' },
            { key: 'quota', label: 'Usage limit reached' },
            { key: 'failing', label: 'Failing runs' },
            { key: 'never', label: 'Never succeeded' },
            { key: 'stale', label: 'No successful run in 48h' },
        ];
        // Boards whose runs work but that have nothing active - not failures.
        const NO_JOBS_GROUPS = [
            { key: 'non_it', label: 'No IT/tech roles on this board' },
            { key: 'all_old', label: 'Every posting is older than the age limit' },
            { key: 'empty', label: 'Last run found 0 jobs' },
            { key: 'no_jobs', label: 'Jobs found, none active' },
        ];
        const QUOTA_RE = /hard limit|usage limit|quota|limit exceeded|payment required|\b402\b/i;

        // "N jobs found, 0 saved: 0 new, 0 updated, 21 skipped_old" or the run note
        // "saved: 0 new, 0 updated, 40 skipped_non_it": nothing saved only because
        // every job was filtered out (too old / not an IT role) - no errors.
        function filteredOutCounts(text) {
            const t = String(text || '');
            if (!/0 new, 0 updated/.test(t) || /error|failed|raised/i.test(t)) return { old: 0, nonIt: 0, total: 0 };
            const n = re => Number((t.match(re) || [])[1] || 0);
            const old = n(/(\d+) skipped_old/), nonIt = n(/(\d+) skipped_non_it/);
            return { old, nonIt, total: old + nonIt };
        }

        // {group, level, reasons} - group is an ATTENTION_GROUPS / NO_JOBS_GROUPS
        // key, or null when healthy; level drives the dot colour.
        function assessScraper(s) {
            const failures = Number(s.consecutive_failures || 0);
            const lastOk = parseUtc(s.last_success_at);
            const lastFail = parseUtc(s.last_failure_at);
            const lastRunFailed = !isNaN(lastFail) && (isNaN(lastOk) || lastFail > lastOk);
            const active = Number(s.active_jobs) || 0;
            // Older runs recorded "all jobs too old" as a save failure; it isn't one.
            const filtered = filteredOutCounts(lastRunFailed ? s.last_error : s.last_run_note);
            const failing = lastRunFailed && !(s.last_error_type === 'save_failed' && filtered.total);
            const reasons = [];
            const at = (group, level) => ({ group, level, reasons, lastRunFailed: failing });

            if (failing && s.last_error_type === 'save_failed') {
                reasons.push('Jobs found but not saved');
                if (failures >= 2) reasons.push(`${failures} failed runs in a row`);
                return at('save_error', 'bad');
            }
            if (failing && QUOTA_RE.test(s.last_error || '')) {
                reasons.push(`Usage limit reached · ${failures} failed runs in a row`);
                return at('quota', 'bad');
            }
            if (failing && (failures >= 2 || ATTENTION_ERRORS[s.last_error_type])) {
                if (ATTENTION_ERRORS[s.last_error_type]) reasons.push(ATTENTION_ERRORS[s.last_error_type]);
                reasons.push(failures === 1 ? 'Last run failed' : `${failures} failed runs in a row`);
                return at('failing', 'bad');
            }
            if (isNaN(lastOk)) {
                reasons.push('Never succeeded');
                return at('never', 'warn');
            }
            if (Date.now() - lastOk > STALE_MS) {
                reasons.push(`Last success ${timeAgo(s.last_success_at)}`);
                return at('stale', 'warn');
            }
            if (!active) {
                if (filtered.nonIt && filtered.nonIt >= filtered.old) {
                    reasons.push(`All ${filtered.total.toLocaleString()} jobs found are outside IT/tech`);
                    return at('non_it', 'warn');
                }
                if (filtered.total) {
                    reasons.push(`All ${filtered.total.toLocaleString()} jobs found are older than the age limit`);
                    return at('all_old', 'warn');
                }
                if (s.last_run_success && Number(s.last_run_jobs_found) === 0) {
                    reasons.push('Last run found 0 jobs');
                    return at('empty', 'warn');
                }
                reasons.push(s.last_run_jobs_found ? `Last run found ${Number(s.last_run_jobs_found).toLocaleString()} jobs, 0 active` : '0 active jobs');
                return at('no_jobs', 'warn');
            }
            return at(null, 'ok');
        }

        function trackedScrapers() {
            return scraperStatus.filter(s => s.is_enabled !== false && s.has_scraper !== false);
        }

        async function loadScraperStatus() {
            const seq = ++statusSeq;
            const list = document.getElementById('tracked-list');
            const statCompanies = document.getElementById('stat-companies');
            if (!scraperStatus.length) list.innerHTML = '<li class="tracked-empty">Loading…</li>';
            try {
                const data = await apiRequest('/scrapers/status', 'GET', null, { timeout: 20000 });
                if (seq !== statusSeq) return;
                scraperStatus = (Array.isArray(data) ? data : (data?.scrapers || []))
                    .filter(s => s && (s.company_slug || s.slug))
                    .map(s => ({ ...s, company_slug: s.company_slug || s.slug, company_name: s.company_name || s.company_slug || s.slug }));
                renderTracked();
            } catch (error) {
                if (seq !== statusSeq) return;
                statCompanies.textContent = '—';
                document.getElementById('tracked-meta').textContent = '';
                document.getElementById('tracked-more').hidden = true;
                list.innerHTML = `<li class="tracked-error">Couldn't load tracked companies: ${escapeHtml(error.message)}
                    <button type="button" class="btn btn-secondary btn-small" onclick="loadScraperStatus()">Retry</button></li>`;
            }
        }

        function nameButton(s) {
            return `<button type="button" class="tracked-name" onclick="filterByCompany('${jsAttr(s.company_name)}')" title="Show ${escapeHtml(s.company_name)} jobs (${escapeHtml(s.company_slug)})">${escapeHtml(s.company_name)}</button>`;
        }

        function runButton(s) {
            return `<button type="button" class="run-btn" onclick="runScraper('${jsAttr(s.company_slug)}', this)" aria-label="Run the ${escapeHtml(s.company_name)} scraper">Run</button>`;
        }

        function issueRow(s) {
            const h = s._health;
            const err = h.lastRunFailed && s.last_error ? `<span class="err" title="${escapeHtml(s.last_error)}">${escapeHtml(s.last_error)}</span>` : '';
            const active = Number(s.active_jobs) || 0;
            const meta = [active ? `${active.toLocaleString()} active` : (h.group in NO_JOBS_KEYS ? '' : '0 active jobs'),
                          s.last_success_at ? `last success ${timeAgo(s.last_success_at)}` : ''].filter(Boolean);
            return `<li class="issue-row">
                <span class="health-dot ${h.level === 'ok' ? '' : h.level}" aria-hidden="true"></span>
                ${nameButton(s)}
                <span class="issue-why"><span class="reason">${escapeHtml(h.reasons.join(' · '))}</span>${meta.length ? ' · ' + escapeHtml(meta.join(' · ')) : ''}${err}</span>
                ${runButton(s)}
            </li>`;
        }

        const NO_JOBS_KEYS = Object.fromEntries(NO_JOBS_GROUPS.map(g => [g.key, true]));

        // One fold: rows grouped under a heading per group (in `groups` order),
        // first TRACKED_TOP rows unless expanded.
        function renderIssueFold(id, rows, groups, emptyText, showAllVar) {
            const count = document.getElementById(`${id}-count`);
            count.textContent = rows.length.toLocaleString();
            count.classList.toggle('warn', id === 'attention' && rows.length > 0);
            const showAll = window[showAllVar];
            const shown = showAll ? rows : rows.slice(0, TRACKED_TOP);
            const html = [];
            let current = null;
            for (const s of shown) {
                if (s._health.group !== current) {
                    current = s._health.group;
                    const g = groups.find(x => x.key === current);
                    const n = rows.filter(r => r._health.group === current).length;
                    html.push(`<li class="issue-group">${escapeHtml(g.label)} <span>${n.toLocaleString()}</span></li>`);
                }
                html.push(issueRow(s));
            }
            if (rows.length > TRACKED_TOP) {
                html.push(`<li class="tracked-more"><button type="button" class="btn btn-secondary btn-small" onclick="${showAllVar} = !${showAllVar}; renderTracked()">${showAll ? `Show first ${TRACKED_TOP}` : `Show all (${rows.length.toLocaleString()})`}</button></li>`);
            }
            document.getElementById(`${id}-list`).innerHTML = rows.length ? html.join('') : `<li class="tracked-empty">${escapeHtml(emptyText)}</li>`;
        }

        function renderTracked() {
            const tracked = trackedScrapers().map(s => ({ ...s, _health: assessScraper(s) }));
            tracked.sort((a, b) => (Number(b.active_jobs) || 0) - (Number(a.active_jobs) || 0)
                || String(a.company_name).localeCompare(String(b.company_name)));
            const disabled = scraperStatus.filter(s => s.is_enabled === false)
                .sort((a, b) => String(a.company_name).localeCompare(String(b.company_name)));
            const byGroup = groups => {
                const order = Object.fromEntries(groups.map((g, i) => [g.key, i]));
                return tracked.filter(s => s._health.group in order)
                    .sort((a, b) => order[a._health.group] - order[b._health.group]
                        || (Number(b.consecutive_failures) || 0) - (Number(a.consecutive_failures) || 0)
                        || String(a.company_name).localeCompare(String(b.company_name)));
            };
            const attention = byGroup(ATTENTION_GROUPS);
            const noJobs = byGroup(NO_JOBS_GROUPS);
            const withJobs = tracked.filter(s => Number(s.active_jobs) > 0).length;

            document.getElementById('stat-companies').textContent = tracked.length.toLocaleString();
            document.getElementById('tracked-meta').textContent = tracked.length
                ? `${withJobs.toLocaleString()} of ${tracked.length.toLocaleString()} with active jobs`
                : '';

            // Main list: top N by active jobs, or every match of the filter.
            const q = document.getElementById('tracked-search').value.trim().toLowerCase();
            const matches = q ? tracked.filter(s => String(s.company_name).toLowerCase().includes(q) || s.company_slug.includes(q)) : tracked;
            const shown = (q || trackedShowAll) ? matches : matches.slice(0, TRACKED_TOP);
            const list = document.getElementById('tracked-list');
            if (!tracked.length) {
                list.innerHTML = '<li class="tracked-empty">No scrapers are enabled.</li>';
            } else if (!shown.length) {
                list.innerHTML = `<li class="tracked-empty">No tracked company matches “${escapeHtml(q)}”.</li>`;
            } else {
                list.innerHTML = shown.map(s => {
                    const h = s._health;
                    const title = h.reasons.length ? h.reasons.join(' · ') : 'Healthy';
                    const jobs = Number(s.active_jobs) || 0;
                    return `<li class="tracked-row">
                        <span class="health-dot ${h.level === 'ok' ? '' : h.level}" role="img" aria-label="${escapeHtml(title)}" title="${escapeHtml(title)}"></span>
                        ${nameButton(s)}
                        <span class="tracked-count${jobs ? '' : ' zero'}" title="Active jobs">${jobs.toLocaleString()}</span>
                        <span class="tracked-age" title="Last successful run">${escapeHtml(timeAgo(s.last_success_at))}</span>
                        ${runButton(s)}
                    </li>`;
                }).join('');
            }
            const more = document.getElementById('tracked-more');
            const toggle = document.getElementById('tracked-toggle');
            more.hidden = !!q || tracked.length <= TRACKED_TOP;
            toggle.textContent = trackedShowAll ? `Show top ${TRACKED_TOP}` : `Show all (${tracked.length.toLocaleString()})`;

            // Needs attention (failures) and No active jobs (working boards with nothing active)
            renderIssueFold('attention', attention, ATTENTION_GROUPS, 'Every tracked scraper is running fine.', 'attentionShowAll');
            renderIssueFold('nojobs', noJobs, NO_JOBS_GROUPS, 'Every tracked company has active jobs.', 'noJobsShowAll');

            // Disabled boards: switched off in code (disabled_reason; needs a code fix)
            // or switched off in settings / by auto-heal (can be re-enabled here).
            document.getElementById('disabled-count').textContent = disabled.length.toLocaleString();
            const inSettings = disabled.filter(s => !s.disabled_reason);
            const disabledRow = s => `<li class="issue-row">
                        <span class="health-dot off" aria-hidden="true"></span>
                        <span class="tracked-name" style="cursor:default;text-decoration:none;color:var(--c-ink)">${escapeHtml(s.company_name)}</span>
                        <span class="issue-why">${escapeHtml(s.disabled_reason || 'Switched off in settings (auto-disabled after repeated failures)')}${s.last_error ? `<span class="err" title="${escapeHtml(s.last_error)}">${escapeHtml(s.last_error)}</span>` : ''}</span>
                        ${s.disabled_reason ? '<span></span>' : `<button type="button" class="run-btn" onclick="enableScrapers(['${jsAttr(s.company_slug)}'], this)" aria-label="Enable the ${escapeHtml(s.company_name)} scraper">Enable</button>`}
                    </li>`;
            const inCode = disabled.filter(s => s.disabled_reason);
            document.getElementById('disabled-list').innerHTML = disabled.length
                ? (inSettings.length ? `<li class="issue-group">Switched off in settings <span>${inSettings.length}</span>
                        <button type="button" class="btn btn-secondary btn-small" style="margin-left:8px" onclick="enableScrapers(${escapeHtml(JSON.stringify(inSettings.map(s => s.company_slug)))}, this)">Enable all</button></li>`
                        + inSettings.map(disabledRow).join('') : '')
                  + (inCode.length ? `<li class="issue-group">No working board (needs a code fix) <span>${inCode.length}</span></li>` + inCode.map(disabledRow).join('') : '')
                : '<li class="tracked-empty">No disabled boards.</li>';
        }

        async function refreshAllWithStatus(btn = document.getElementById('refresh-btn')) {
            btn.disabled = true;
            btn.textContent = 'Refreshing...';

            try {
                const response = await apiRequest('/ingest/refresh', 'POST', null, { timeout: 120000 });
                showAlert(`Refreshed ${Number(response.sources_refreshed || 0).toLocaleString()} companies. Added ${Number(response.total_jobs_added || 0).toLocaleString()} new jobs.`);
                loadJobs();
                loadScraperStatus();
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Refresh All';
            }
        }

        // POST /scrapers/{slug}/enable (also resets the failure streak), then reload.
        async function enableScrapers(slugs, btn) {
            const originalText = btn ? btn.textContent : '';
            if (btn) { btn.disabled = true; btn.textContent = '…'; }
            let ok = 0;
            const failed = [];
            for (const slug of slugs) {
                try {
                    await apiRequest(`/scrapers/${encodeURIComponent(slug)}/enable`, 'POST');
                    ok++;
                } catch (e) {
                    failed.push(`${slug}: ${e.message}`);
                }
            }
            if (btn) { btn.disabled = false; btn.textContent = originalText; }
            showAlert(failed.length ? `Enabled ${ok}; failed: ${failed.join('; ')}` : `Enabled ${ok} scraper${ok === 1 ? '' : 's'} — they run on the next schedule, or click Run`, failed.length ? 'error' : 'success');
            loadScraperStatus();
        }

        async function runScraper(slug, btn) {
            const originalText = btn ? btn.textContent : '';
            if (btn) { btn.disabled = true; btn.textContent = '…'; }

            try {
                const response = await apiRequest(`/scrapers/${encodeURIComponent(slug)}/run-sync`, 'POST', null, { timeout: 180000 });
                if (response.status === 'success') {
                    showToast(`${slug}: found ${Number(response.jobs_found || 0).toLocaleString()} jobs (${Number(response.jobs_new || 0).toLocaleString()} new, ${Number(response.jobs_updated || 0).toLocaleString()} updated)`);
                    loadJobs();
                } else if (response.status === 'queued') {
                    showToast(`${slug}: queued on the worker — results appear when the run finishes`, 'info');
                } else {
                    showToast(`${slug} failed: ${response.error || response.status || 'unknown error'}`, 'error');
                }
                loadScraperStatus();
            } catch (error) {
                showToast(`Error running ${slug}: ${error.message}`, 'error');
            } finally {
                if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = originalText; }
            }
        }

        let searchTimer = null;

        document.addEventListener('DOMContentLoaded', async function() {
            if (!requireAdmin()) return;
            initAdminLayout('jobs', 'Jobs Management');

            ['status-filter', 'company-filter', 'f-visa_ok', ...FACET_SELECTS.map(k => 'f-' + k)].forEach(id =>
                document.getElementById(id).addEventListener('change', resetAndLoad));
            ['search-input', 'f-location'].forEach(id => document.getElementById(id).addEventListener('input', () => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(resetAndLoad, 350);
            }));
            document.getElementById('group-by').addEventListener('change', () => { syncUrl(); renderGroups(); });
            document.getElementById('clear-filters').addEventListener('click', () => {
                document.getElementById('search-input').value = '';
                document.getElementById('f-location').value = '';
                document.getElementById('f-visa_ok').checked = false;
                ['status-filter', 'company-filter', ...FACET_SELECTS.map(k => 'f-' + k)].forEach(id => setSelectValue(id, ''));
                setTimeFilter(0, false);
                resetAndLoad();
            });
            document.getElementById('prev-page').addEventListener('click', () => { if (currentPage > 0) { currentPage--; loadJobs(); } });
            document.getElementById('next-page').addEventListener('click', () => { currentPage++; loadJobs(); });
            document.getElementById('career-url').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') ingestJobs();
            });
            let trackedTimer = null;
            document.getElementById('tracked-search').addEventListener('input', () => {
                clearTimeout(trackedTimer);
                trackedTimer = setTimeout(renderTracked, 120);
            });
            document.getElementById('tracked-toggle').addEventListener('click', () => {
                trackedShowAll = !trackedShowAll;
                renderTracked();
            });

            applyUrlFilters();

            // First paint: the labels, then the jobs page (which also asks for its filter
            // counts), the scraper status list and the summary counts in parallel.
            // ?company=<name> needs the company list before the jobs query.
            await loadTaxonomy();
            if (pendingCompanyParam) {
                await Promise.allSettled([loadCompanies().then(() => loadJobs()), loadScraperStatus(), loadStats()]);
            } else {
                await Promise.allSettled([loadJobs(), loadScraperStatus(), loadStats(), loadCompanies()]);
            }
        });
    </script>
</body>
</html>
