<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/images/cariara-mark.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs · Cariara Admin</title>
    <link rel="stylesheet" href="/css/theme.css?v=202609291648">
    <link rel="stylesheet" href="/css/admin-layout.css?v=202609291648">
    <style>
        /* Prevent horizontal overflow - aggressive fix */
        * {
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }

        .container {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        /* Table overflow handling */
        .table-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .admin-table {
            min-width: 800px;
        }

        .admin-card {
            max-width: 100%;
            overflow: hidden;
        }

        .filter-bar {
            max-width: 100%;
            overflow-x: auto;
        }

        .hero-section {
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            color: var(--text-primary);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hero-section h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 600;
        }
        .hero-section p {
            margin: 0 0 25px 0;
            opacity: 0.9;
            font-size: 15px;
        }
        .import-box {
            background: var(--bg-subtle);
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .import-box label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        .import-form {
            display: flex;
            gap: 10px;
        }
        .import-form input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
        }
        .import-form button {
            padding: 12px 24px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .import-form button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .import-form button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .import-result {
            margin-top: 15px;
            padding: 12px 15px;
            background: var(--bg-muted);
            border-radius: 6px;
            font-size: 14px;
            text-align: left;
        }
        .import-result.error {
            background: var(--error-muted);
            color: var(--error);
        }
        .import-result.success {
            background: var(--success-muted);
            border: 1px solid var(--success);
        }

        .tracked-companies {
            background: var(--bg-elevated);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 25px;
            border: 1px solid var(--border-default);
            overflow: hidden;
            max-width: 100%;
        }
        .tracked-companies h3 {
            margin: 0 0 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-primary);
            font-size: 16px;
        }
        .company-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-width: 100%;
            overflow: hidden;
        }
        .company-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--bg-subtle);
            border-radius: 20px;
            font-size: 13px;
            text-decoration: none;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .company-chip:hover {
            background: var(--bg-hover);
            border-color: var(--border-subtle);
        }
        .company-chip .name { font-weight: 500; }
        .company-chip .count {
            background: var(--bg-muted);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .company-chip .refresh-btn-mini {
            background: none;
            border: none;
            padding: 2px 4px;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-muted);
            border-radius: 4px;
            transition: all 0.2s;
        }
        .company-chip .refresh-btn-mini:hover {
            background: var(--primary);
            color: white;
        }
        .company-chip .refresh-btn-mini:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .time-filter {
            display: flex;
            gap: 6px;
            margin-right: auto;
        }
        .time-pill {
            padding: 6px 12px;
            border: 1px solid var(--border-light);
            border-radius: 16px;
            background: var(--bg-elevated);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .time-pill:hover {
            border-color: var(--border-subtle);
            background: var(--bg-hover);
        }
        .time-pill.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            max-width: 100%;
        }
        .filter-bar select, .filter-bar input {
            padding: 10px 14px;
            border: 1px solid var(--border-default);
            background: var(--bg-elevated);
            color: var(--text-primary);
            border-radius: 8px;
            font-family: inherit;
            max-width: 100%;
            min-width: 0;
        }

        .source-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .source-manual { background: #e3f2fd; color: #1565c0; }
        .source-greenhouse { background: #e8f5e9; color: #2e7d32; }
        .source-lever { background: #fff8e1; color: #f57f17; }
        .source-ashby { background: #fce4ec; color: #c2185b; }
        .source-smartrecruiters { background: #e0f2f1; color: #00695c; }
        .source-workable { background: #ede7f6; color: #512da8; }
        .source-recruitee { background: #fff3e0; color: #e65100; }
        .source-workday { background: #e8eaf6; color: #283593; }

        .stats-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            max-width: 100%;
        }
        .stat-mini {
            background: var(--bg-elevated);
            padding: 18px 24px;
            border-radius: 12px;
            text-align: center;
            flex: 1;
            min-width: 140px;
            border: 1px solid var(--border-default);
        }
        .stat-mini .number {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .stat-mini:nth-child(2) .number { color: var(--success); }
        .stat-mini:nth-child(3) .number { color: var(--warning); }
        .stat-mini .label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            font-weight: 500;
        }

        .import-tabs {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 20px;
        }
        .import-tab {
            background: var(--bg-muted);
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .import-tab:hover { background: var(--border-default); }
        .import-tab.active {
            background: var(--accent-primary);
            color: white;
        }
        .import-tab-content { display: none; width: 100%; }
        .import-tab-content.active { display: block; }

        .refresh-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 4px;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }
        .refresh-btn:hover { background: var(--bg-muted); color: var(--text-primary); }
        .refresh-btn.loading { animation: spin 1s linear infinite; }
        .refresh-btn.success { color: var(--success); }
        .refresh-btn.error { color: var(--error); }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .job-title-link {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
        }
        .job-title-link:hover {
            color: var(--accent-primary);
            text-decoration: underline;
        }
        .external-link {
            color: var(--text-muted);
            font-size: 11px;
            margin-left: 6px;
        }
    </style>

<body>
    <main class="container">
        <!-- Hero Import Section -->
        <div class="hero-section">
            <div class="import-tabs">
                <button class="import-tab active" onclick="switchImportTab('auto', this)">Auto Import</button>
                <button class="import-tab" onclick="switchImportTab('custom', this)">Custom Company</button>
            </div>

            <div id="auto-import-tab" class="import-tab-content active">
                <div class="import-box">
                    <label>Career Page URL</label>
                    <div class="import-form">
                        <input type="text" id="career-url" placeholder="Enter career page URL">
                        <button onclick="ingestJobs()" id="ingest-btn">Import Jobs</button>
                    </div>
                    <div id="import-result"></div>
                </div>
            </div>

            <div id="custom-import-tab" class="import-tab-content">
                <div class="import-box">
                    <label>Company Name</label>
                    <input type="text" id="custom-company-name" placeholder="Company name" style="width: 100%; padding: 12px; border: none; border-radius: 6px; margin-bottom: 12px;">
                    <label>Career Page URL</label>
                    <div class="import-form" style="gap: 8px;">
                        <input type="text" id="custom-career-url" placeholder="Enter career page URL">
                        <button onclick="detectJobBoard()" id="detect-btn">Detect</button>
                        <button onclick="addCustomCompany()" id="custom-btn" disabled>Add & Scrape</button>
                    </div>
                    <div id="custom-result"></div>
                </div>
            </div>
        </div>

        <!-- Quick Stats -->
        <div class="stats-row">
            <div class="stat-mini">
                <div class="number" id="stat-total">-</div>
                <div class="label">Total Jobs</div>
            </div>
            <div class="stat-mini">
                <div class="number" id="stat-companies">-</div>
                <div class="label">Companies Tracked</div>
            </div>
            <div class="stat-mini">
                <div class="number" id="stat-wishlist">-</div>
                <div class="label">Wishlist</div>
            </div>
            <div class="stat-mini">
                <div class="number" id="stat-applied">-</div>
                <div class="label">Applied</div>
            </div>
        </div>

        <!-- Tracked Companies -->
        <div class="tracked-companies">
            <h3>
                <span>Tracked Companies (<span id="companies-count">0</span>)</span>
                <button class="btn btn-secondary btn-small" onclick="refreshAllWithStatus(this)" id="refresh-btn">Refresh All</button>
            </h3>
            <div id="companies-grid" class="company-grid">
                <div class="empty-companies">Loading...</div>
            </div>
        </div>

        <!-- Jobs List -->
        <div class="admin-card">
            <div class="admin-card-header">
                <h3 class="admin-card-title">All Jobs</h3>
            </div>

            <div class="filter-bar">
                <div class="time-filter">
                    <button class="time-pill active" data-days="0" onclick="setTimeFilter(0)">All Time</button>
                    <button class="time-pill" data-days="1" onclick="setTimeFilter(1)">Today</button>
                    <button class="time-pill" data-days="7" onclick="setTimeFilter(7)">Past Week</button>
                    <button class="time-pill" data-days="30" onclick="setTimeFilter(30)">Past Month</button>
                </div>
                <select id="status-filter">
                    <option value="">All Statuses</option>
                    <option value="wishlist">Wishlist</option>
                    <option value="applied">Applied</option>
                    <option value="interviewing">Interviewing</option>
                    <option value="offer">Offer</option>
                    <option value="rejected">Rejected</option>
                    <option value="withdrawn">Withdrawn</option>
                </select>
                <select id="source-filter">
                    <option value="">All Sources</option>
                    <option value="greenhouse">Greenhouse</option>
                    <option value="ashby">Ashby</option>
                    <option value="workday">Workday</option>
                    <option value="lever">Lever</option>
                    <option value="smartrecruiters">SmartRecruiters</option>
                    <option value="workable">Workable</option>
                    <option value="recruitee">Recruitee</option>
                    <option value="manual">Manual</option>
                </select>
                <select id="type-filter">
                    <option value="">All Job Types</option>
                </select>
                <select id="company-filter">
                    <option value="">All Companies</option>
                </select>
                <input type="search" id="search-input" placeholder="Search jobs..." aria-label="Search jobs">
            </div>
            <p id="filter-hint" style="display: none; margin: 0 0 12px; font-size: 13px; color: var(--c-ink-2);"></p>

            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Job Title</th>
                            <th>Company</th>
                            <th>Location</th>
                            <th>Source</th>
                            <th>Status</th>
                            <th>Excitement</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="jobs-table-body">
                        <tr>
                            <td colspan="7" class="loading">Loading jobs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="jobs-pagination" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px 0 0;">
                <span id="jobs-range" style="font-size: 13px; color: var(--c-ink-2);"></span>
                <div style="display: flex; gap: 8px;">
                    <button type="button" class="btn btn-secondary btn-small" id="prev-page" disabled>Previous</button>
                    <button type="button" class="btn btn-secondary btn-small" id="next-page" disabled>Next</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/app.js?v=202609291648"></script>
    <script src="/js/admin-sidebar.js?v=202609291648"></script>
    <script>
        // Server-side paging: GET /api/jobs?all=true supports limit/offset, status,
        // source, company_id, posted_within_hours and description_chars, and returns
        // `total` for the filtered set. It does NOT support free-text search or job
        // type, so those two are applied client-side to the current page only; while
        // either is active we fetch bigger pages (CLIENT_FILTER_PAGE_SIZE) so the
        // filter has more rows to work with, and say so in #filter-hint.
        const PAGE_SIZE = 50;
        const CLIENT_FILTER_PAGE_SIZE = 500;

        let currentPage = 0;
        let currentPageJobs = [];
        let serverTotal = 0;
        let allSources = [];
        let allCompanies = [];
        let timeFilterDays = 0;
        let loadSeq = 0;
        let pendingCompanyParam = null;

        // Same patterns and order as backend /api/analytics/by-job-type, so the
        // dropdown counts and the client-side matcher classify titles identically.
        const JOB_TYPE_PATTERNS = {
            'fullstack': [/full\s*stack/, /fullstack/],
            'frontend': [/front\s*end/, /frontend/, /\bui\b/, /\bux\b/, /react/, /angular/, /vue/],
            'backend': [/back\s*end/, /backend/, /server/, /\bapi\b/, /java\b/, /python/, /golang/, /node/],
            'devops': [/devops/, /\bsre\b/, /site reliability/, /platform/, /infrastructure/, /cloud/],
            'data': [/\bdata\b/, /analytics/, /\bml\b/, /machine learning/, /\bai\b/, /artificial intelligence/, /scientist/],
            'mobile': [/mobile/, /\bios\b/, /android/, /swift/, /kotlin/],
            'security': [/security/, /infosec/, /cyber/],
            'qa': [/\bqa\b/, /quality/, /\btest/, /sdet/],
            'manager': [/manager/, /\blead\b/, /director/, /head of/, /vp /, /principal/],
        };
        const JOB_TYPE_LABELS = {
            fullstack: 'Full Stack', frontend: 'Frontend', backend: 'Backend', devops: 'DevOps',
            data: 'Data/ML', mobile: 'Mobile', security: 'Security', qa: 'QA/Test', manager: 'Manager', other: 'Other'
        };

        function getJobType(title) {
            const t = (title || '').toLowerCase();
            for (const [type, patterns] of Object.entries(JOB_TYPE_PATTERNS)) {
                if (patterns.some(re => re.test(t))) return type;
            }
            return 'other';
        }

        function getFilters() {
            return {
                status: document.getElementById('status-filter').value,
                source: document.getElementById('source-filter').value,
                companyId: document.getElementById('company-filter').value,
                type: document.getElementById('type-filter').value,
                q: document.getElementById('search-input').value.trim(),
            };
        }

        function clientFiltering(f = getFilters()) {
            return !!(f.type || f.q);
        }

        // ?status=, ?source=, ?company= (id or name), ?q=, ?type=, ?days=, ?page=
        function applyUrlFilters() {
            const params = new URLSearchParams(window.location.search);
            const setSelect = (id, value) => {
                if (!value) return;
                const el = document.getElementById(id);
                if (![...el.options].some(o => o.value === value)) {
                    el.add(new Option(value, value));
                }
                el.value = value;
            };
            setSelect('status-filter', params.get('status'));
            setSelect('source-filter', params.get('source'));
            setSelect('type-filter', params.get('type'));
            if (params.get('q')) document.getElementById('search-input').value = params.get('q');
            pendingCompanyParam = params.get('company') || params.get('company_id');
            const days = parseInt(params.get('days'), 10);
            if ([1, 7, 30].includes(days)) setTimeFilter(days, false);
            const page = parseInt(params.get('page'), 10);
            if (page > 1) currentPage = page - 1;
        }

        function syncUrl() {
            const f = getFilters();
            const params = new URLSearchParams();
            if (f.status) params.set('status', f.status);
            if (f.source) params.set('source', f.source);
            if (f.companyId) params.set('company', f.companyId);
            if (f.type) params.set('type', f.type);
            if (f.q) params.set('q', f.q);
            if (timeFilterDays) params.set('days', timeFilterDays);
            if (currentPage) params.set('page', currentPage + 1);
            const qs = params.toString();
            history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : ''));
        }

        // Resolve ?company=<id|name> once the company list is known.
        function resolveCompanyParam() {
            if (!pendingCompanyParam) return false;
            const raw = pendingCompanyParam;
            pendingCompanyParam = null;
            const select = document.getElementById('company-filter');
            const match = /^\d+$/.test(raw)
                ? allCompanies.find(c => String(c.id) === raw)
                : allCompanies.find(c => (c.name || '').toLowerCase() === raw.toLowerCase());
            if (match) {
                select.value = String(match.id);
                return true;
            }
            if (!/^\d+$/.test(raw)) document.getElementById('search-input').value = raw;
            return true;
        }

        async function loadJobTypeCounts() {
            try {
                const data = await apiRequest('/analytics/by-job-type');
                const select = document.getElementById('type-filter');
                const currentValue = select.value;
                select.innerHTML = '<option value="">All Job Types</option>';
                (data.job_types || []).forEach(jt => {
                    const opt = new Option(`${JOB_TYPE_LABELS[jt.type] || jt.type} (${Number(jt.count).toLocaleString()} active)`, jt.type);
                    select.add(opt);
                });
                if (currentValue) {
                    if (![...select.options].some(o => o.value === currentValue)) select.add(new Option(JOB_TYPE_LABELS[currentValue] || currentValue, currentValue));
                    select.value = currentValue;
                }
            } catch (error) {
                console.error('Failed to load job type counts:', error);
                const select = document.getElementById('type-filter');
                if (select.options.length <= 1) {
                    Object.entries(JOB_TYPE_LABELS).forEach(([k, v]) => select.add(new Option(v, k)));
                }
            }
        }

        async function loadCompanies() {
            try {
                const companies = await apiRequest('/companies');
                allCompanies = (Array.isArray(companies) ? companies : [])
                    .filter(c => c && c.name)
                    .sort((a, b) => a.name.localeCompare(b.name));
                const select = document.getElementById('company-filter');
                const currentValue = select.value;
                select.innerHTML = '<option value="">All Companies</option>';
                allCompanies.forEach(c => select.add(new Option(c.name, String(c.id))));
                if (currentValue) select.value = currentValue;
                return resolveCompanyParam();
            } catch (error) {
                console.error('Failed to load companies:', error);
                return false;
            }
        }

        async function loadStats() {
            try {
                const summary = await apiRequest('/analytics/summary');
                const sc = summary.status_counts || {};
                document.getElementById('stat-total').textContent = Number(summary.total_jobs || 0).toLocaleString();
                document.getElementById('stat-wishlist').textContent = Number(sc.wishlist || 0).toLocaleString();
                document.getElementById('stat-applied').textContent = Number(sc.applied || 0).toLocaleString();
            } catch (error) {
                console.error('Failed to load stats:', error);
                ['stat-total', 'stat-wishlist', 'stat-applied'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el && el.textContent === '-') el.textContent = '—';
                });
            }
        }

        function switchImportTab(tab, btn) {
            document.querySelectorAll('.import-tab').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            document.querySelectorAll('.import-tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tab + '-import-tab').classList.add('active');
        }

        let detectedBoardInfo = null;

        async function detectJobBoard() {
            const urlInput = document.getElementById('custom-career-url');
            const detectBtn = document.getElementById('detect-btn');
            const addBtn = document.getElementById('custom-btn');
            const resultDiv = document.getElementById('custom-result');

            const url = urlInput.value.trim();
            if (!url) {
                resultDiv.innerHTML = '<div class="import-result error">Please enter a career page URL</div>';
                return;
            }

            detectBtn.disabled = true;
            detectBtn.textContent = 'Detecting...';
            addBtn.disabled = true;
            resultDiv.innerHTML = '<div class="import-result">Analyzing job board type...</div>';

            try {
                const response = await apiRequest('/scrapers/custom/detect', 'POST', { careers_url: url });
                detectedBoardInfo = response;

                if (!response || response.board_type === 'unknown') {
                    resultDiv.innerHTML = `<div class="import-result error">Could not detect job board type. Supported: Greenhouse, Lever, Workday, Ashby</div>`;
                    addBtn.disabled = true;
                } else {
                    resultDiv.innerHTML = `
                        <div class="import-result success">
                            <strong>${escapeHtml(String(response.board_type).toUpperCase())}</strong> detected
                            ${response.job_count ? ` - ${Number(response.job_count).toLocaleString()} jobs available` : ''}
                        </div>
                    `;
                    addBtn.disabled = false;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="import-result error">Detection failed: ${escapeHtml(error.message)}</div>`;
                addBtn.disabled = true;
            } finally {
                detectBtn.disabled = false;
                detectBtn.textContent = 'Detect';
            }
        }

        async function addCustomCompany() {
            const nameInput = document.getElementById('custom-company-name');
            const urlInput = document.getElementById('custom-career-url');
            const addBtn = document.getElementById('custom-btn');
            const resultDiv = document.getElementById('custom-result');

            const name = nameInput.value.trim();
            if (!name) {
                resultDiv.innerHTML = '<div class="import-result error">Please enter a company name</div>';
                return;
            }

            if (!detectedBoardInfo || detectedBoardInfo.board_type === 'unknown') {
                resultDiv.innerHTML = '<div class="import-result error">Please detect the job board type first</div>';
                return;
            }

            addBtn.disabled = true;
            addBtn.textContent = 'Creating...';

            try {
                const response = await apiRequest('/scrapers/custom/add', 'POST', {
                    company_name: name,
                    careers_url: urlInput.value.trim()
                }, { timeout: 60000 });

                resultDiv.innerHTML = `
                    <div class="import-result success">
                        <strong>${escapeHtml(response.company_name)}</strong> scraper created - ${Number(response.job_count || 0).toLocaleString()} jobs
                    </div>
                `;
                nameInput.value = '';
                urlInput.value = '';
                detectedBoardInfo = null;
                addBtn.disabled = true;
                loadSources();
                loadJobs();
            } catch (error) {
                resultDiv.innerHTML = `<div class="import-result error">Error: ${escapeHtml(error.message)}</div>`;
                addBtn.disabled = false;
            } finally {
                addBtn.textContent = 'Add & Scrape';
            }
        }

        async function loadJobs() {
            const tableBody = document.getElementById('jobs-table-body');
            const seq = ++loadSeq;
            const f = getFilters();
            const pageSize = clientFiltering(f) ? CLIENT_FILTER_PAGE_SIZE : PAGE_SIZE;

            const params = new URLSearchParams({
                all: 'true',
                active_only: 'true',
                limit: String(pageSize),
                offset: String(currentPage * pageSize),
                description_chars: '300',
            });
            if (f.status) params.set('status', f.status);
            if (f.source) params.set('source', f.source);
            if (f.companyId) params.set('company_id', f.companyId);
            if (timeFilterDays > 0) params.set('posted_within_hours', String(timeFilterDays * 24));

            tableBody.innerHTML = '<tr><td colspan="7" class="loading" style="text-align:center;padding:40px;">Loading jobs...</td></tr>';
            document.getElementById('prev-page').disabled = true;
            document.getElementById('next-page').disabled = true;
            syncUrl();

            try {
                const response = await apiRequest(`/jobs?${params.toString()}`);
                if (seq !== loadSeq) return; // a newer request superseded this one
                currentPageJobs = Array.isArray(response) ? response : (response.jobs || []);
                serverTotal = Number(response.total ?? currentPageJobs.length);
                renderCurrentPage(pageSize);
            } catch (error) {
                if (seq !== loadSeq) return;
                console.error('Failed to load jobs:', error);
                tableBody.innerHTML = `<tr><td colspan="7" class="alert alert-error">Couldn't load jobs: ${escapeHtml(error.message)} <button type="button" class="btn btn-secondary btn-small" onclick="loadJobs()">Retry</button></td></tr>`;
                document.getElementById('jobs-range').textContent = '';
            }
        }

        // Search and job type are not supported by GET /api/jobs, so they filter
        // only the rows of the current (server) page.
        function applyClientFilters(jobs) {
            const f = getFilters();
            const q = f.q.toLowerCase();
            return jobs.filter(job => {
                const companyName = job.company_name || (job.company ? job.company.name : '') || '';
                const matchesType = !f.type || getJobType(job.title) === f.type;
                const matchesSearch = !q ||
                    (job.title || '').toLowerCase().includes(q) ||
                    companyName.toLowerCase().includes(q) ||
                    (job.location || '').toLowerCase().includes(q);
                return matchesType && matchesSearch;
            });
        }

        function renderCurrentPage(pageSize) {
            const f = getFilters();
            const rows = applyClientFilters(currentPageJobs);
            renderJobs(rows);

            const start = serverTotal === 0 ? 0 : currentPage * pageSize + 1;
            const end = Math.min(serverTotal, currentPage * pageSize + currentPageJobs.length);
            const rangeEl = document.getElementById('jobs-range');
            const hint = document.getElementById('filter-hint');
            if (clientFiltering(f)) {
                rangeEl.textContent = `${rows.length.toLocaleString()} match${rows.length === 1 ? '' : 'es'} in jobs ${start.toLocaleString()}–${end.toLocaleString()} of ${serverTotal.toLocaleString()}`;
                hint.style.display = '';
                hint.textContent = `Search and job type are matched within each batch of ${CLIENT_FILTER_PAGE_SIZE} jobs (the API can't filter by them yet). Use Next to scan further.`;
            } else {
                rangeEl.textContent = serverTotal ? `Showing ${start.toLocaleString()}–${end.toLocaleString()} of ${serverTotal.toLocaleString()} jobs` : '';
                hint.style.display = 'none';
            }
            document.getElementById('prev-page').disabled = currentPage === 0;
            document.getElementById('next-page').disabled = end >= serverTotal;
        }

        function getSourceBadge(source) {
            const labels = {
                'manual': 'Manual', 'greenhouse': 'Greenhouse', 'lever': 'Lever',
                'ashby': 'Ashby', 'smartrecruiters': 'SmartRecruiters', 'workable': 'Workable',
                'recruitee': 'Recruitee', 'workday': 'Workday'
            };
            const key = labels[source] ? source : 'manual';
            return `<span class="source-badge source-${key}">${escapeHtml(labels[source] || source || 'Manual')}</span>`;
        }

        function renderJobs(jobs) {
            const tbody = document.getElementById('jobs-table-body');

            if (jobs.length === 0) {
                const filtered = Object.values(getFilters()).some(Boolean) || timeFilterDays;
                tbody.innerHTML = `<tr><td colspan="7" class="empty-state">${filtered ? 'No jobs match these filters.' : 'No jobs found. Import jobs from a company above!'}</td></tr>`;
                return;
            }

            tbody.innerHTML = jobs.map(job => {
                const level = Math.min(5, Math.max(0, Number(job.excitement_level) || 3));
                const excitement = '★'.repeat(level) + '☆'.repeat(5 - level);
                const jobUrl = safeUrl(job.job_url || job.url);
                const externalLink = jobUrl ? ` <a href="${jobUrl}" target="_blank" rel="noopener noreferrer" class="external-link" title="Open original posting">↗</a>` : '';
                const companyName = job.company_name || (job.company ? job.company.name : null) || '-';
                const detail = `job_detail.html?id=${encodeURIComponent(job.id)}`;
                return `
                    <tr>
                        <td><a href="${detail}" class="job-title-link">${escapeHtml(job.title || 'Untitled')}</a>${externalLink}</td>
                        <td>${escapeHtml(companyName)}</td>
                        <td>${escapeHtml(job.location || '-')}</td>
                        <td>${getSourceBadge(job.source)}</td>
                        <td>${getStatusBadge(job.status)}</td>
                        <td>${excitement}</td>
                        <td><a href="${detail}" class="btn btn-secondary btn-small">View</a></td>
                    </tr>
                `;
            }).join('');
        }

        function resetAndLoad() {
            currentPage = 0;
            loadJobs();
        }

        function setTimeFilter(days, reload = true) {
            timeFilterDays = days;
            document.querySelectorAll('.time-pill').forEach(pill => {
                pill.classList.toggle('active', parseInt(pill.dataset.days, 10) === days);
            });
            if (reload) resetAndLoad();
        }

        function filterByCompany(companyName) {
            const match = allCompanies.find(c => (c.name || '').toLowerCase() === String(companyName).toLowerCase());
            if (match) {
                document.getElementById('company-filter').value = String(match.id);
                document.getElementById('search-input').value = '';
            } else {
                document.getElementById('company-filter').value = '';
                document.getElementById('search-input').value = companyName;
            }
            resetAndLoad();
            document.querySelector('.table-container').scrollIntoView({ behavior: 'smooth' });
        }

        async function ingestJobs() {
            const urlInput = document.getElementById('career-url');
            const btn = document.getElementById('ingest-btn');
            const resultDiv = document.getElementById('import-result');

            const url = urlInput.value.trim();
            if (!url) {
                resultDiv.innerHTML = '<div class="import-result error">Please enter a career page URL</div>';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Importing...';
            resultDiv.innerHTML = '<div class="import-result">Fetching jobs...</div>';

            try {
                const response = await apiRequest('/ingest/company', 'POST', { career_page_url: url }, { timeout: 90000 });
                const company = `<strong>${escapeHtml(response.company_name)}</strong>`;
                let message = '';
                if (response.jobs_added > 0) {
                    message = `Added <strong>${Number(response.jobs_added).toLocaleString()}</strong> new jobs from ${company}`;
                } else if (response.jobs_updated > 0) {
                    message = `Updated <strong>${Number(response.jobs_updated).toLocaleString()}</strong> jobs from ${company}`;
                } else {
                    message = `${company} is already up to date`;
                }
                resultDiv.innerHTML = `<div class="import-result success">${message}</div>`;
                urlInput.value = '';
                loadJobs();
                loadSources();
            } catch (error) {
                resultDiv.innerHTML = `<div class="import-result error">Error: ${escapeHtml(error.message)}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Import Jobs';
            }
        }

        async function loadSources() {
            const statCompanies = document.getElementById('stat-companies');
            if (statCompanies) statCompanies.textContent = '...';

            const [ingestRes, scraperRes] = await Promise.allSettled([
                apiRequest('/ingest/sources'),
                apiRequest('/scrapers/status')
            ]);
            if (ingestRes.status === 'rejected' && scraperRes.status === 'rejected') {
                console.error('Failed to load sources:', ingestRes.reason, scraperRes.reason);
                if (statCompanies) statCompanies.textContent = '—';
                document.getElementById('companies-grid').innerHTML = `<div class="empty-companies" style="width: 100%;">Couldn't load tracked companies: ${escapeHtml(ingestRes.reason.message)}</div>`;
                return;
            }
            const ingestSources = ingestRes.status === 'fulfilled' ? ingestRes.value : [];
            const scraperStatus = scraperRes.status === 'fulfilled' ? scraperRes.value : [];

            const sourceMap = new Map();
            (Array.isArray(ingestSources) ? ingestSources : (ingestSources?.sources || [])).forEach(s => {
                sourceMap.set(s.company_name?.toLowerCase(), {
                    company_name: s.company_name,
                    ats_type: s.ats_type,
                    job_count: s.job_count || 0,
                    career_page_url: s.career_page_url
                });
            });

            (Array.isArray(scraperStatus) ? scraperStatus : (scraperStatus?.scrapers || [])).forEach(s => {
                const key = s.company_name?.toLowerCase();
                const existing = sourceMap.get(key);
                const scraperJobs = s.active_jobs || 0;
                if (!existing || scraperJobs > (existing.job_count || 0)) {
                    sourceMap.set(key, {
                        company_name: s.company_name,
                        company_slug: s.company_slug || s.slug,
                        ats_type: existing?.ats_type || 'scraper',
                        job_count: scraperJobs,
                        career_page_url: existing?.career_page_url || ''
                    });
                }
            });

            allSources = Array.from(sourceMap.values());
            if (statCompanies) statCompanies.textContent = allSources.length.toLocaleString();
            renderSources();
        }

        function renderSources() {
            const container = document.getElementById('companies-grid');
            const countSpan = document.getElementById('companies-count');
            if (!container) return;

            if (allSources.length === 0) {
                container.innerHTML = '<div class="empty-companies" style="width: 100%;">No companies tracked yet.</div>';
                if (countSpan) countSpan.textContent = '0';
                return;
            }

            allSources.sort((a, b) => {
                if ((b.job_count || 0) !== (a.job_count || 0)) return (b.job_count || 0) - (a.job_count || 0);
                return (a.company_name || '').localeCompare(b.company_name || '');
            });

            container.innerHTML = allSources.map(source => {
                const hasJobs = (source.job_count || 0) > 0;
                const companyName = source.company_name || 'Unknown';
                const runBtn = source.company_slug
                    ? `<button type="button" class="refresh-btn-mini" onclick="event.stopPropagation(); runScraper('${jsAttr(source.company_slug)}', this)" title="Run scraper" aria-label="Run ${escapeHtml(companyName)} scraper">↻</button>`
                    : '';
                return `
                    <div class="company-chip"${hasJobs ? '' : ' style="opacity: 0.5;"'}>
                        <span class="name" role="button" tabindex="0" onclick="filterByCompany('${jsAttr(companyName)}')">${escapeHtml(companyName)}</span>
                        <span class="count">${Number(source.job_count || 0).toLocaleString()}</span>
                        ${runBtn}
                    </div>
                `;
            }).join('');

            const withJobs = allSources.filter(s => (s.job_count || 0) > 0).length;
            if (countSpan) countSpan.textContent = `${withJobs}/${allSources.length}`;
        }

        async function refreshAllWithStatus(btn = document.getElementById('refresh-btn')) {
            btn.disabled = true;
            btn.textContent = 'Refreshing...';

            try {
                const response = await apiRequest('/ingest/refresh', 'POST', null, { timeout: 120000 });
                showAlert(`Refreshed ${Number(response.sources_refreshed || 0).toLocaleString()} companies. Added ${Number(response.total_jobs_added || 0).toLocaleString()} new jobs.`);
                loadJobs();
                loadSources();
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Refresh All';
            }
        }

        async function runScraper(slug, btn) {
            const originalText = btn ? btn.textContent : '';
            if (btn) { btn.disabled = true; btn.textContent = '...'; }

            try {
                const response = await apiRequest(`/scrapers/${encodeURIComponent(slug)}/run-sync`, 'POST', null, { timeout: 120000 });
                if (response.status === 'success') {
                    showAlert(`${slug}: Found ${response.jobs_found} jobs (${response.jobs_new} new, ${response.jobs_updated} updated)`);
                    loadJobs();
                    loadSources();
                } else if (response.status === 'queued') {
                    showAlert(`${slug}: queued on the worker — results appear when the run finishes`);
                } else {
                    showAlert(`${slug} failed: ${response.error || response.status || 'unknown error'}`, 'error');
                }
            } catch (error) {
                showAlert(`Error running ${slug}: ${error.message}`, 'error');
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = originalText; }
            }
        }

        let searchTimer = null;

        document.addEventListener('DOMContentLoaded', async function() {
            if (!requireAdmin()) return;
            initAdminLayout('jobs', 'Jobs Management');

            ['status-filter', 'source-filter', 'company-filter'].forEach(id =>
                document.getElementById(id).addEventListener('change', resetAndLoad));
            // Type filter is client-side, but switching modes changes the page size.
            document.getElementById('type-filter').addEventListener('change', resetAndLoad);
            document.getElementById('search-input').addEventListener('input', () => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(resetAndLoad, 350);
            });
            document.getElementById('prev-page').addEventListener('click', () => { if (currentPage > 0) { currentPage--; loadJobs(); } });
            document.getElementById('next-page').addEventListener('click', () => { currentPage++; loadJobs(); });
            document.getElementById('career-url').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') ingestJobs();
            });
            document.getElementById('companies-grid').addEventListener('keydown', (e) => {
                if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.company-chip .name')) {
                    e.preventDefault();
                    e.target.click();
                }
            });

            applyUrlFilters();

            // First paint: at most 4 parallel requests (jobs, companies, 2x sources).
            // ?company=<name> needs the company list before the first jobs query.
            const firstJobs = pendingCompanyParam
                ? loadCompanies().then(() => loadJobs())
                : Promise.all([loadJobs(), loadCompanies()]);
            await Promise.allSettled([firstJobs, loadSources()]);
            // Second wave: global counts.
            loadJobTypeCounts();
            loadStats();
        });
    </script>
</body>
</html>
